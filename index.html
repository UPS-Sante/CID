<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centre d'Intelligence des Données · Situation Room MSPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root {
    /* PPTX palette · bleu royal */
    --royal: #1F3864;
    --royal-d: #16294A;
    --royal-l: #46628F;
    --royal-pale: #C7D2E4;
    --royal-tint: #E8EDF7;
    /* Active / accent */
    --gold: #B4913C;
    --gold-d: #856722;
    --gold-l: #DCC084;
    --gold-tint: #F5ECD7;
    /* Backgrounds */
    --bg: #F1EFEA;
    --surface: #FFFFFF;
    --surface-2: #F8F6F1;
    --border: #E4E0D5;
    --border-2: #CEC8BA;
    /* Text */
    --ink: #1B1A16;
    --body: #44403A;
    --muted: #75706B;
    --muted-2: #A09A93;
    /* RAG (4 colors · saturated) */
    --rag-green: #2E6B3F;
    --rag-green-l: #D8EBDD;
    --rag-yellow: #7D5C07;
    --rag-yellow-l: #F6EED6;
    --rag-orange: #AF4E10;
    --rag-orange-l: #FBEEE3;
    --rag-red: #A02233;
    --rag-red-l: #F3D8DA;
    --rag-na: #655F52;
    --rag-na-l: #E9E6DE;
    /* Direction colors */
    --dir-vacc: #33518C;
    --dir-dsr: #8C4A5E;
    --dir-dsc: #3F6B52;
    --dir-dpml: #8C5A2E;
    --dir-dpsis: #5C6470;
    --dir-drh: #5F5286;
    --dir-cousp: #8C4038;
    --dir-prog: #3E6E78;
    /* PDA specific */
    --pda: #2563EB;
    --pda-tint: #DBEAFE;

    --font: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-h: 'Source Serif 4', Georgia, serif;
    --font-mono: 'Source Sans 3', -apple-system, sans-serif;

    --header-h: 56px;
    --sb-w: 268px;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(27,26,22,0.07);
    --shadow: 0 2px 5px rgba(27,26,22,0.07), 0 1px 2px rgba(27,26,22,0.05);
    --shadow-md: 0 6px 16px rgba(27,26,22,0.09), 0 2px 5px rgba(27,26,22,0.05);
    --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--royal-l);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    color: var(--body);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     HEADER (bandeau bleu royal · fidèle PPTX)
  ============================================================ */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--royal);
    color: white;
    z-index: 100;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: var(--sb-w);
    padding-right: 20px;
    border-right: 1px solid rgba(255,255,255,0.12);
    margin-right: 20px;
    height: 100%;
  }
  .h-logo-DEPRECATED {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.15);
    color: white;
    font-family: var(--font-h);
    font-weight: 700;
    font-size: 14px;
    border-radius: 6px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .h-title {
    font-family: var(--font-h);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.1px;
    line-height: 1.1;
  }
  .h-sub {
    font-size: 10px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .h-context {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .h-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .h-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    background: rgba(255,255,255,0.95);
    color: var(--royal-d);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .h-pill .ico { font-size: 12px; }
  .h-pill.live {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .h-pill.live .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rag-green);
    box-shadow: 0 0 8px rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ============================================================
     LAYOUT
  ============================================================ */
  .layout {
    display: flex;
    height: 100vh;
    padding-top: var(--header-h);
  }

  /* ============================================================
     SIDEBAR
  ============================================================ */
  .sb {
    width: var(--sb-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding-bottom: 24px;
  }
  .sb::-webkit-scrollbar { width: 6px; }
  .sb::-webkit-scrollbar-track { background: transparent; }
  .sb::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sb-search {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .sb-search-box {
    width: 100%;
    padding: 7px 10px 7px 30px;
    font-size: 12px;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    background: var(--surface-2);
    font-family: var(--font);
    color: var(--body);
    position: relative;
  }
  .sb-search-wrap { position: relative; }
  .sb-search-icon {
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .sb-section {
    padding: 14px 14px 6px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  .prog {
    border-left: 3px solid transparent;
    position: relative;
  }
  .prog-head {
    padding: 9px 14px 9px 11px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    transition: background 0.12s ease;
    user-select: none;
  }
  .prog-head:hover {
    background: var(--surface-2);
  }
  .prog.open {
    background: var(--surface-2);
  }
  .prog.open .prog-head {
    background: transparent;
  }
  .prog.active {
    border-left-color: var(--gold);
    background: var(--gold-tint);
  }
  .prog.active .prog-head {
    background: transparent;
  }
  .prog-icon {
    width: 24px; height: 24px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: white;
    background: var(--dir-vacc);
  }
  .prog[data-c="dsr"] .prog-icon { background: var(--dir-dsr); }
  .prog[data-c="dsc"] .prog-icon { background: var(--dir-dsc); }
  .prog[data-c="dpml"] .prog-icon { background: var(--dir-dpml); }
  .prog[data-c="dpsis"] .prog-icon { background: var(--dir-dpsis); }
  .prog[data-c="drh"] .prog-icon { background: var(--dir-drh); }
  .prog[data-c="cousp"] .prog-icon { background: var(--dir-cousp); }
  .prog[data-c="prog"] .prog-icon { background: var(--dir-prog); }
  .prog[data-c="min"] .prog-icon {
    background: linear-gradient(135deg, var(--gold-d), var(--gold));
    color: var(--ink);
    font-size: 10px;
    letter-spacing: -0.2px;
  }
  .prog.priority {
    border: 1.5px solid var(--gold);
    background: linear-gradient(135deg, var(--gold-tint) 0%, var(--gold-tint) 100%);
    box-shadow: 0 2px 6px rgba(202,138,4,0.15);
    margin-bottom: 10px;
  }
  .prog.priority .prog-label {
    font-weight: 700;
    color: var(--ink);
  }
  .prog.priority::before {
    content: '';
    position: absolute;
    top: 6px; right: 8px;
    color: var(--gold-d);
    font-size: 10px;
  }
  .prog.priority { position: relative; }

  .prog-label {
    flex: 1;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.1px;
  }
  .prog-count {
    font-size: 9px;
    color: var(--muted-2);
    background: var(--border);
    padding: 2px 6px;
    border-radius: 100px;
    font-weight: 600;
    margin-left: 4px;
    font-family: var(--font-mono);
  }
  .prog.active .prog-count {
    background: var(--gold);
    color: var(--ink);
  }
  .prog-chev {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    transition: transform 0.2s ease;
    width: 14px;
    text-align: center;
    line-height: 1;
  }
  .prog-chev::before { content: '+'; }
  .prog.open .prog-chev {
    color: var(--royal);
  }
  .prog.open .prog-chev::before { content: '−'; }

  .subprog-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .prog.open .subprog-list {
    max-height: 800px;
  }

  .subprog {
    padding: 7px 14px 7px 47px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .subprog::before {
    content: '';
    position: absolute;
    left: 28px; top: 50%;
    width: 10px; height: 1px;
    background: var(--border-2);
  }
  .subprog:hover {
    color: var(--ink);
    background: var(--surface-2);
  }
  .subprog.active {
    color: var(--royal-d);
    font-weight: 700;
    background: var(--royal-tint);
  }
  .subprog.active::before {
    background: var(--royal);
    width: 14px;
  }
  .subprog .sp-label { flex: 1; }
  .subprog .sp-pda-badge {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 1px 5px;
    background: var(--pda);
    color: white;
    border-radius: 3px;
    margin-left: 4px;
  }
  .subprog .sp-status {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .sp-status.green { background: var(--rag-green); }
  .sp-status.yellow { background: var(--rag-yellow); }
  .sp-status.orange { background: var(--rag-orange); }
  .sp-status.red { background: var(--rag-red); }

  .sb-footer {
    margin: 14px 12px 0;
    padding: 10px 12px;
    background: var(--royal-tint);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 10.5px;
    color: var(--royal-d);
    line-height: 1.45;
  }
  .sb-footer-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 4px;
  }
  .sb-footer strong { font-weight: 700; color: var(--ink); }

  /* ============================================================
     MAIN
  ============================================================ */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

  /* Topbar · sticky controls */
  .topbar {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 11px 22px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-height: 56px;
  }
  .breadcrumb {
    flex: 1;
    min-width: 180px;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .breadcrumb .crumb-current {
    color: var(--royal-d);
    font-weight: 700;
  }
  .breadcrumb .sep {
    margin: 0 8px;
    color: var(--border-2);
  }

  .period-pills {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }
  .pp {
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
  }
  .pp:hover { color: var(--royal-d); }
  .pp.on {
    background: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-sm);
  }

  .time-block, .scope-block {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .time-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .period-sel {
    padding: 5px 26px 5px 10px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--surface) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%2364748B' d='M5 6L0 0h10z'/%3E%3C/svg%3E") no-repeat right 8px center;
    border: 1px solid var(--border-2);
    border-radius: 5px;
    color: var(--ink);
    font-family: var(--font);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    min-width: 150px;
  }
  .period-sel:hover { border-color: var(--royal); }
  .period-sel:focus { outline: none; border-color: var(--royal); box-shadow: 0 0 0 3px rgba(30,64,175,0.12); }
  .scope-sel { min-width: 200px; }

  .scope-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--body);
  }
  .scope-pill.pda {
    background: var(--pda-tint);
    border-color: var(--pda);
    color: var(--royal-d);
  }
  .scope-pill .ico { font-size: 13px; }

  .topbar-spacer { flex: 1; }

  /* Page header */
  .ph {
    padding: 22px 22px 4px;
  }
  .ph-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 6px;
  }
  .ph-title {
    font-family: var(--font-h);
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.4px;
    line-height: 1.15;
  }
  .ph-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    max-width: 760px;
  }

  /* Filter bar (PDA only) */
  .filter-bar {
    margin: 16px 22px 0;
    padding: 11px 14px;
    background: linear-gradient(90deg, var(--pda-tint) 0%, var(--royal-tint) 100%);
    border: none;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fb-left {
    flex: 1;
    min-width: 240px;
  }
  .fb-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 2px;
  }
  .fb-text {
    font-size: 12.5px;
    color: var(--body);
    font-weight: 500;
  }
  .fb-text strong { color: var(--royal-d); font-weight: 700; }
  .fb-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 3px;
  }
  .fb-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: white;
    border: 1px solid var(--gold);
    border-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .fb-badge-icon {
    font-size: 20px;
    line-height: 1;
  }
  .fb-badge-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold-d);
  }
  .fb-badge-val {
    font-family: var(--font-h);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 1px;
  }
  .fb-btn {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    font-family: var(--font);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .fb-btn:hover:not(.on) { color: var(--royal-d); }
  .fb-btn.on {
    background: var(--royal);
    color: white;
  }
  .fb-btn .ct {
    background: rgba(255,255,255,0.15);
    color: white;
    padding: 1px 5px;
    border-radius: 100px;
    font-size: 9.5px;
    font-family: var(--font-mono);
  }
  .fb-btn:not(.on) .ct {
    background: var(--border);
    color: var(--muted);
  }

  /* PDA tabs (D1-D7) */
  .pda-tabs {
    margin: 16px 22px 0;
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 1px;
    position: relative;
  }
  /* Edge-fade affordance · appears only when tabs overflow horizontally */
  .pda-tabs[data-overflow-right="true"] {
    -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 32px), rgba(0,0,0,0.15) 100%);
            mask-image: linear-gradient(to right, black 0, black calc(100% - 32px), rgba(0,0,0,0.15) 100%);
  }
  .pda-tabs[data-overflow-left="true"][data-overflow-right="true"] {
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.15) 0, black 32px, black calc(100% - 32px), rgba(0,0,0,0.15) 100%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.15) 0, black 32px, black calc(100% - 32px), rgba(0,0,0,0.15) 100%);
  }
  .pda-tabs[data-overflow-left="true"]:not([data-overflow-right="true"]) {
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.15) 0, black 32px, black 100%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.15) 0, black 32px, black 100%);
  }
  .pda-tabs::-webkit-scrollbar { height: 4px; }
  .pda-tabs::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
  .pda-tab {
    padding: 8px 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: var(--font);
    transition: all 0.15s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pda-tab:hover { color: var(--ink); }
  .pda-tab.on {
    color: var(--royal-d);
    border-bottom-color: var(--royal);
    font-weight: 700;
  }
  .pda-tab .pda-num {
    font-size: 9.5px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 700;
  }
  .pda-tab.on .pda-num {
    background: var(--royal-tint);
    color: var(--royal-d);
  }

  /* ============================================================
     CONTENT
  ============================================================ */
  .content {
    padding: 18px 22px 32px;
  }

  /* KPI grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .kpi {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 13px 14px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .kpi::after {
    content: '';
    position: absolute;
    top: 4px; bottom: 0; left: 0;
    width: 3px;
    opacity: 0.85;
  }
  .kpi.green::before  { background: var(--rag-green); }
  .kpi.yellow::before { background: var(--rag-yellow); }
  .kpi.orange::before { background: var(--rag-orange); }
  .kpi.red::before    { background: var(--rag-red); }
  .kpi.na::before     { background: var(--rag-na); }
  .kpi.green::after  { background: var(--rag-green); }
  .kpi.yellow::after { background: var(--rag-yellow); }
  .kpi.orange::after { background: var(--rag-orange); }
  .kpi.red::after    { background: var(--rag-red); }
  .kpi.na::after     { background: var(--rag-na); }
  .kpi.green  { border-color: rgba(21,128,61,0.25); }
  .kpi.yellow { border-color: rgba(202,138,4,0.30); }
  .kpi.orange { border-color: rgba(194,65,12,0.30); }
  .kpi.red    { border-color: rgba(153,27,27,0.30); }
  .kpi.green  .kpi-value { color: var(--rag-green); }
  .kpi.yellow .kpi-value { color: var(--rag-yellow); }
  .kpi.orange .kpi-value { color: var(--rag-orange); }
  .kpi.red    .kpi-value { color: var(--rag-red); }
  .kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    line-height: 1.3;
    min-height: 26px;
  }
  .kpi-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .kpi-head .kpi-label { flex: 1; }
  .kpi-rag-dot {
    width: 10px; height: 10px;
    border-radius: 100px;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
  }
  .kpi-rag-dot.green  { background: var(--rag-green); }
  .kpi-rag-dot.yellow { background: var(--rag-yellow); }
  .kpi-rag-dot.orange { background: var(--rag-orange); }
  .kpi-rag-dot.red    { background: var(--rag-red); animation: pulse-red 2s ease-in-out infinite; }
  .kpi-rag-dot.na     { background: var(--rag-na); }
  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,0.6), 0 0 0 0 rgba(153,27,27,0.45); }
    50%      { box-shadow: 0 0 0 2px rgba(255,255,255,0.6), 0 0 0 4px rgba(153,27,27,0); }
  }
  .kpi-val-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 4px;
  }
  .kpi-value {
    font-family: var(--font-h);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .kpi-unit {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .kpi-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .kpi-target {
    font-size: 10.5px;
    color: var(--muted);
  }
  .kpi-trend {
    font-size: 10.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .kpi-trend.up { color: var(--rag-green); }
  .kpi-trend.down { color: var(--rag-red); }
  .kpi-trend.up.inverse { color: var(--rag-red); }
  .kpi-trend.down.inverse { color: var(--rag-green); }
  .kpi-trend.flat { color: var(--muted); }

  /* Card */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border:none;
    overflow: hidden;
  }
  .card-hdr {
    padding: 14px 16px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.1px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-body { padding: 14px 16px; }
  .card-foot {
    padding: 10px 16px;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--muted);
  }

  /* Grids */
  .g-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 14px; }
  .g-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 14px; }
  .g-1-1 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .g-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }

  /* ============================================================
     MAP · Grille structurée 5 colonnes × 6 rangées
  ============================================================ */
  .map-wrap {
    position: relative;
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-2) 100%);
    padding: 60px 16px 18px;
  }
  .map-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    aspect-ratio: 5/5.5;
    max-width: 540px;
    margin: 0 auto;
  }
  .map-cell {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    text-align: center;
    padding: 6px 4px;
    position: relative;
    overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .map-cell.rag-green  { background: var(--rag-green); }
  .map-cell.rag-yellow { background: var(--rag-yellow); }
  .map-cell.rag-orange { background: var(--rag-orange); }
  .map-cell.rag-red    { background: var(--rag-red); }
  .map-cell.dark-text {
    color: var(--body);
    text-shadow: none;
  }
  .map-cell.dim { opacity: 0.32; }
  .map-cell.pda-active {
    box-shadow: 0 0 0 2.5px var(--gold-d), 0 0 0 4.5px rgba(202,138,4,0.25), 0 2px 8px rgba(15,23,42,0.15);
    z-index: 2;
  }
  .map-cell.selected {
    box-shadow: 0 0 0 3px var(--royal-d), 0 0 0 5px rgba(30,58,138,0.25), 0 4px 12px rgba(30,58,138,0.2);
    z-index: 3;
  }
  .map-cell:hover {
    transform: scale(1.06);
    z-index: 4;
    box-shadow: 0 6px 16px rgba(15,23,42,0.28);
  }
  .map-cell.pda-active:hover {
    box-shadow: 0 0 0 2.5px var(--gold-d), 0 6px 16px rgba(15,23,42,0.3);
  }
  .map-cell.selected:hover {
    box-shadow: 0 0 0 3px var(--royal-d), 0 6px 16px rgba(15,23,42,0.3);
  }
  .mc-name {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 3px;
    letter-spacing: -0.1px;
  }
  .mc-val {
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: -0.4px;
    line-height: 1;
  }
  .mc-pda {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.8px;
    margin-top: 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .map-cell.dark-text .mc-pda {
    color: var(--gold-d);
    text-shadow: none;
  }

  /* ============================================================
     MAP · Carte géographique SVG (vraies frontières TCD-ADM1)
  ============================================================ */
  .map-wrap {
    position: relative;
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-2) 100%);
    padding: 56px 16px 18px;
  }
  .map-svg-wrap {
    max-width: 520px;
    margin: 0 auto;
    position: relative;
    transition: max-width 0.22s ease;
    touch-action: none; /* allow custom pinch/pan gestures */
  }
  .map-svg-wrap[data-size="S"] { max-width: 380px; }
  .map-svg-wrap[data-size="M"] { max-width: 520px; }
  .map-svg-wrap[data-size="L"] { max-width: 820px; }
  .map-svg-wrap[data-size="XL"] { max-width: 100%; }
  .map-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: hidden;
    border-radius: 6px;
    user-select: none;
    -webkit-user-select: none;
    background: transparent;
    cursor: grab;
  }
  .map-svg.is-panning { cursor: grabbing; }

  /* === Toolbar (taille + zoom) === */
  .map-toolbar {
    position: absolute;
    top: 12px; left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 4;
    flex-wrap: wrap;
  }
  .map-tb-group {
    display: inline-flex;
    align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    height: 30px;
  }
  .map-tb-label {
    padding: 0 8px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted-2);
    display: flex;
    align-items: center;
    border-right: 1px solid var(--border);
    background: var(--surface-2);
  }
  .map-tb-btn {
    background: var(--surface);
    border: none;
    border-right: 1px solid var(--border);
    color: var(--body);
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--font-mono);
    cursor: pointer;
    min-width: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .map-tb-btn:last-child { border-right: none; }
  .map-tb-btn:hover { background: var(--surface-2); }
  .map-tb-btn.on {
    background: var(--royal);
    color: #fff;
  }
  .map-tb-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .map-tb-zoom-pct {
    padding: 0 9px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    color: var(--body);
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    min-width: 48px;
    justify-content: center;
  }

  .map-prov {
    fill: var(--rag-yellow);
    stroke: #FFFFFF;
    stroke-width: 1.1;
    stroke-linejoin: round;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease, stroke-width 0.15s ease;
  }
  .map-prov.rag-green  { fill: var(--rag-green); }
  .map-prov.rag-yellow { fill: var(--rag-yellow); }
  .map-prov.rag-orange { fill: var(--rag-orange); }
  .map-prov.rag-red    { fill: var(--rag-red); }
  .map-prov.dim {
    opacity: 0.30;
  }
  .map-prov.pda-active {
    stroke: var(--gold-d);
    stroke-width: 2.2;
    filter: drop-shadow(0 0 3px rgba(202,138,4,0.45));
  }
  .map-prov.selected {
    stroke: var(--royal-d);
    stroke-width: 2.8;
    filter: drop-shadow(0 0 4px rgba(30,58,138,0.55));
  }
  .map-prov:hover {
    filter: brightness(1.10) drop-shadow(0 2px 6px rgba(15,23,42,0.35));
    stroke-width: 1.8;
  }
  .map-prov.pda-active:hover {
    filter: brightness(1.08) drop-shadow(0 0 4px rgba(202,138,4,0.55));
  }
  .map-prov.selected:hover {
    filter: brightness(1.08) drop-shadow(0 0 5px rgba(30,58,138,0.7));
  }
  .map-label {
    pointer-events: none;
    font-family: var(--font-sans);
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .map-label-name {
    font-size: 10px;
    font-weight: 700;
    fill: #FFFFFF;
    paint-order: stroke;
    stroke: rgba(15,23,42,0.55);
    stroke-width: 2.4;
    stroke-linejoin: round;
    letter-spacing: -0.1px;
  }
  .map-label-name.dark {
    fill: var(--body);
    stroke: rgba(255,255,255,0.7);
  }
  .map-label-val {
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    fill: #FFFFFF;
    paint-order: stroke;
    stroke: rgba(15,23,42,0.55);
    stroke-width: 2.4;
    stroke-linejoin: round;
    letter-spacing: -0.3px;
  }
  .map-label-val.dark {
    fill: var(--body);
    stroke: rgba(255,255,255,0.7);
  }
  .map-label.tiny .map-label-name { font-size: 8px; }
  .map-label.tiny .map-label-val  { font-size: 9px; }
  .map-pda-marker {
    pointer-events: none;
    fill: var(--gold);
    stroke: #FFFFFF;
    stroke-width: 1.2;
  }

  /* ============================================================
     APERÇU MINISTÉRIEL · Executive dashboard
  ============================================================ */
  .ph-exec {
    background: linear-gradient(135deg, var(--gold-tint) 0%, var(--gold-tint) 100%);
    border-left: 4px solid var(--gold-d);
    padding: 18px 22px;
    margin-bottom: 0;
  }
  .ph-tag-exec {
    color: var(--gold-d) !important;
    font-weight: 700;
  }

  .exec-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px 22px 0;
    background: var(--surface-2);
    margin-bottom: 0;
  }
  .exec-tab {
    background: var(--surface);
    border: 1.5px solid var(--border-2);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: var(--font);
    text-align: left;
    color: var(--body);
  }
  .exec-tab:hover {
    border-color: var(--royal);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .exec-tab.on {
    background: linear-gradient(135deg, var(--royal-d), var(--royal));
    border-color: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-md);
  }
  .et-num {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
    opacity: 0.8;
    color: var(--royal-d);
    min-width: 38px;
  }
  .exec-tab.on .et-num { color: var(--gold); opacity: 1; }
  .et-text { flex: 1; min-width: 0; }
  .et-label {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .et-meta {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .exec-tab.on .et-meta { color: rgba(255,255,255,0.7); }

  .exec-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }

  .kpi-exec {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
  }
  .kpi-exec::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .kpi-exec.rag-green::before  { background: var(--rag-green); }
  .kpi-exec.rag-yellow::before { background: var(--rag-yellow); }
  .kpi-exec.rag-orange::before { background: var(--rag-orange); }
  .kpi-exec.rag-red::before    { background: var(--rag-red); }
  .kpi-exec:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .kpe-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .kpe-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--royal-d);
    opacity: 0.4;
    flex-shrink: 0;
    min-width: 38px;
    line-height: 1;
  }
  .kpe-title { flex: 1; min-width: 0; }
  .kpe-label {
    font-family: var(--font-h);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }
  .kpe-cat {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .kpe-status {
    flex-shrink: 0;
    font-size: 10px;
    padding: 2px 8px;
  }

  .kpe-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 0 10px;
  }
  .kpe-value-block { flex: 1; }
  .kpe-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
    line-height: 1;
  }
  .kpe-num-big {
    font-family: var(--font-h);
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--ink);
  }
  .kpe-unit {
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
  }
  .kpe-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 11px;
  }
  .kpe-target {
    color: var(--muted);
  }
  .kpe-target strong {
    color: var(--ink);
    font-weight: 700;
  }
  .kpe-trend {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 11px;
  }
  .kpe-trend.up   { background: var(--rag-green-l); color: var(--rag-green); }
  .kpe-trend.down { background: var(--rag-red-l);   color: var(--rag-red); }
  .kpe-trend.flat { background: var(--surface-2);   color: var(--muted); }
  .kpe-trend-lbl {
    font-weight: 500;
    opacity: 0.8;
    font-size: 9.5px;
  }
  .kpe-spark-block {
    text-align: center;
    min-width: 140px;
  }
  .mini-spark {
    width: 100%;
    height: 32px;
    display: block;
  }
  .kpe-spark-lbl {
    font-size: 9px;
    color: var(--muted-2);
    margin-top: 2px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .kpe-action {
    background: var(--royal-tint);
    padding: 9px 12px;
    margin-top: 10px;
    border-radius: 4px;
    display: flex;
    gap: 8px;
    font-size: 11.5px;
    color: var(--body);
    line-height: 1.4;
  }
  .kpe-action-icon {
    color: var(--royal);
    font-weight: 800;
    flex-shrink: 0;
  }

  .kpe-source {
    font-size: 10px;
    color: var(--muted-2);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    letter-spacing: 0.3px;
  }

  /* Executive footer */
  .exec-footer {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--ink) 0%, var(--royal-d) 100%);
    color: white;
    border-radius: var(--radius);
    padding: 16px 22px;
  }
  .exec-footer-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .exec-footer-row > div {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ef-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .ef-val {
    font-size: 12px;
    font-weight: 500;
    color: white;
  }

  /* Language switcher */
  .lang-block {
    display: inline-flex;
    align-items: center;
  }
  .lang-pills {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
    letter-spacing: 0.3px;
  }
  .lang-btn:hover { color: var(--royal-d); }
  .lang-btn.on {
    background: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-sm);
  }

  /* RTL adjustments for Arabic */
  [dir="rtl"] body { font-family: var(--font); }
  [dir="rtl"] .sb { border-right: none; border-left: 1px solid var(--border); }
  [dir="rtl"] .breadcrumb .sep { display: inline-block; transform: scaleX(-1); }
  [dir="rtl"] .kpi::after,
  [dir="rtl"] .si-card::before {
    left: auto; right: 0;
  }
  [dir="rtl"] .ai-box { text-align: right; }
  [dir="rtl"] .kpe-action { border-left: none; border-right: 3px solid var(--royal); }
  [dir="rtl"] .pda-prov-card { text-align: right; }
  [dir="rtl"] .map-info { left: auto; right: 16px; }
  [dir="rtl"] .map-legend { right: auto; left: 16px; }
  [dir="rtl"] .map-mode-toggle { right: auto; left: 12px; }

  /* Map mode toggle (Performance ↔ Zones) */
  .map-mode-toggle {
    position: absolute;
    top: 12px; right: 12px;
    background: white;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 3px;
    display: inline-flex;
    z-index: 6;
    box-shadow: var(--shadow-sm);
  }
  .mm-btn {
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .mm-btn:hover { color: var(--royal-d); background: var(--surface-2); }
  .mm-btn.on {
    background: var(--royal-d);
    color: white;
  }
  .mm-btn.on:hover { background: var(--royal-d); }
  .mm-icon { font-size: 12px; }
  .map-legend {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 11px;
  }
  .map-legend-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--body);
    margin-bottom: 2px;
  }
  .leg-item:last-child { margin-bottom: 0; }
  .leg-dot {
    width: 11px; height: 11px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .map-info {
    position: absolute;
    top: 60px; right: 16px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 10px 12px;
    box-shadow: var(--shadow-md);
    min-width: 195px;
    z-index: 5;
  }
  .map-info-tag {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 2px;
  }
  .map-info-name {
    font-family: var(--font-h);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .map-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    padding: 2px 0;
    border-bottom: 1px solid var(--border);
  }
  .map-info-row:last-child { border-bottom: none; }
  .map-info-val {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--ink);
  }
  .map-info-pda {
    display: inline-block;
    background: var(--pda);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ============================================================
     BARS / CHART
  ============================================================ */
  .bar-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 150px 1fr 56px;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .bar-label {
    font-size: 11.5px;
    color: var(--body);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 100px;
    position: relative;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--royal);
  }
  .bar-fill.green { background: var(--rag-green); }
  .bar-fill.yellow { background: var(--rag-yellow); }
  .bar-fill.orange { background: var(--rag-orange); }
  .bar-fill.red { background: var(--rag-red); }
  .bar-target {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 2px;
    background: var(--ink);
    opacity: 0.55;
    border-radius: 2px;
  }
  .bar-val {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    text-align: right;
  }
  .bar-val.green { color: var(--rag-green); }
  .bar-val.yellow { color: var(--rag-yellow); }
  .bar-val.orange { color: var(--rag-orange); }
  .bar-val.red { color: var(--rag-red); }

  /* Sparkline / line chart */
  .chart-svg {
    width: 100%;
    height: 200px;
  }
  .chart-legend {
    display: flex;
    gap: 14px;
    padding: 6px 0 0 0;
    flex-wrap: wrap;
  }
  .cl-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--body);
  }
  .cl-mark {
    width: 16px; height: 2px;
    border-radius: 2px;
  }

  /* Data table */
  .dt {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .dt th {
    text-align: left;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 10px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .dt td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--body);
  }
  .dt td.num {
    text-align: right;
    font-family: var(--font-mono);
    font-weight: 600;
  }
  .dt td.l { font-weight: 600; color: var(--ink); }
  .dt tr:hover td { background: var(--royal-tint); }
  .dt tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .pill.green { background: var(--rag-green-l); color: var(--rag-green); }
  .pill.yellow { background: var(--rag-yellow-l); color: var(--rag-yellow); }
  .pill.orange { background: var(--rag-orange-l); color: var(--rag-orange); }
  .pill.red { background: var(--rag-red-l); color: var(--rag-red); }

  /* Province context banner · shown when single province selected */
  .prov-banner {
    margin: 14px 22px 0;
    padding: 11px 14px;
    background: linear-gradient(90deg, var(--royal-tint) 0%, white 70%);
    border: none;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .prov-banner.pda {
    background: linear-gradient(90deg, var(--gold-tint) 0%, white 70%);
    border-color: var(--gold);
    border-left-color: var(--gold-d);
  }
  .prov-banner-icon {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--royal);
    color: white;
    font-size: 14px;
    flex-shrink: 0;
  }
  .prov-banner.pda .prov-banner-icon {
    background: var(--gold-d);
  }
  .prov-banner-text { flex: 1; }
  .prov-banner-tag {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--royal);
  }
  .prov-banner.pda .prov-banner-tag { color: var(--gold-d); }
  .prov-banner-name {
    font-family: var(--font-h);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 1px;
  }
  .prov-banner-clear {
    background: white;
    border: 1px solid var(--border-2);
    border-radius: 5px;
    padding: 6px 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s ease;
  }
  .prov-banner-clear:hover {
    color: var(--royal-d);
    border-color: var(--royal);
    background: var(--royal-tint);
  }

  /* SI table · system icon */
  .si-icon {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--royal-d), var(--royal));
    color: white;
    font-family: var(--font-h);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: -0.3px;
  }
  .si-table td { padding: 11px 12px; }

  /* SI grid · airy cards layout (replaces dense table) */
  .si-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }
  .si-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .si-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .si-card.rag-green::before { background: var(--rag-green); }
  .si-card.rag-yellow::before { background: var(--rag-yellow); }
  .si-card.rag-orange::before { background: var(--rag-orange); }
  .si-card.rag-red::before { background: var(--rag-red); }
  .si-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .si-card-hdr {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .si-card-icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--royal-d), var(--royal));
    color: white;
    font-family: var(--font-h);
    font-size: 13px;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -0.3px;
  }
  .si-card-title { flex: 1; min-width: 0; }
  .si-card-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.2px;
  }
  .si-card-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .si-card-status {
    font-size: 14px;
    font-weight: 700;
    padding: 4px 10px;
    flex-shrink: 0;
  }
  .si-card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 1px dashed var(--border);
    font-size: 10.5px;
    color: var(--muted);
  }
  .si-meta-pf {
    background: var(--royal-tint);
    color: var(--royal-d);
    padding: 2px 7px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.3px;
  }
  .si-meta-dot { color: var(--border-2); }
  .si-meta-freq { font-weight: 500; }
  .si-card-metrics {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .si-metric {
    display: grid;
    grid-template-columns: 90px 1fr 60px 70px;
    align-items: center;
    gap: 12px;
  }
  .si-metric-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--body);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .si-metric-bar {
    height: 7px;
    background: var(--surface-2);
    border-radius: 100px;
    overflow: hidden;
  }
  .si-metric-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .si-metric-fill.green { background: var(--rag-green); }
  .si-metric-fill.yellow { background: var(--rag-yellow); }
  .si-metric-fill.orange { background: var(--rag-orange); }
  .si-metric-fill.red { background: var(--rag-red); }
  .si-metric-val {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    text-align: right;
    letter-spacing: -0.5px;
  }
  .si-metric-val span {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-left: 1px;
  }
  .si-metric-val.green { color: var(--rag-green); }
  .si-metric-val.yellow { color: var(--gold-d); }
  .si-metric-val.orange { color: var(--rag-orange); }
  .si-metric-val.red { color: var(--rag-red); }
  .si-metric-target {
    font-size: 10px;
    color: var(--muted-2);
    text-align: right;
    font-family: var(--font-mono);
  }

  /* AI Box · Santex (lecture algorithmique) */
  .ai-box {
    background: linear-gradient(135deg, var(--royal-d) 0%, var(--royal) 60%, var(--royal-l) 130%);
    border-radius: var(--radius);
    padding: 18px 20px;
    color: white;
    position: relative;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .ai-box::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(250,204,21,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .ai-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 4px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 9px;
  }
  .ai-title {
    font-family: var(--font-h);
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.25;
  }
  .ai-text {
    font-size: 12.5px;
    color: rgba(255,255,255,0.88);
    line-height: 1.55;
  }
  .ai-text strong { color: var(--gold); font-weight: 700; }
  .ai-meta {
    display: flex;
    gap: 14px;
    margin-top: 11px;
    padding-top: 11px;
    border-top: 1px solid rgba(255,255,255,0.15);
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.7px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Alerts */
  .alert {
    background: var(--surface);
    border-left: 3px solid var(--rag-orange);
    border-radius: 4px;
    padding: 9px 12px;
    margin-bottom: 7px;
    display: flex;
    gap: 9px;
    align-items: flex-start;
    box-shadow: var(--shadow-sm);
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .alert.red { border-left-color: var(--rag-red); }
  .alert.green { border-left-color: var(--rag-green); }
  .alert.yellow { border-left-color: var(--rag-yellow); }
  .alert-ic {
    width: 22px; height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: white;
    background: var(--rag-orange);
  }
  .alert.red .alert-ic { background: var(--rag-red); }
  .alert.green .alert-ic { background: var(--rag-green); }
  .alert.yellow .alert-ic { background: var(--rag-yellow); color: var(--ink); }
  .alert-body { flex: 1; }
  .alert-t {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 1px;
  }
  .alert-d {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.45;
  }
  .alert-m {
    font-size: 10px;
    color: var(--muted-2);
    margin-top: 3px;
    font-family: var(--font-mono);
  }

  /* PDA score cards */
  .pda-prov-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .pda-prov-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 14px;
    position: relative;
    overflow: hidden;
  }
  .pda-prov-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
  }
  .pda-prov-card[data-prov="HL"]::before { background: var(--royal-l); }
  .pda-prov-card[data-prov="KN"]::before { background: var(--rag-orange); }
  .pda-prov-card[data-prov="LC"]::before { background: var(--rag-green); }
  .pda-prov-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 11px;
  }
  .pda-prov-name {
    font-family: var(--font-h);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .pda-prov-id {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 3px;
    background: var(--royal-tint);
    color: var(--royal-d);
    font-family: var(--font-mono);
  }
  .pda-prov-score {
    font-family: var(--font-h);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .pda-prov-score-unit {
    font-family: var(--font);
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
  }
  .pda-prov-bar {
    height: 6px;
    background: var(--surface-2);
    border-radius: 100px;
    margin-top: 9px;
    overflow: hidden;
  }
  .pda-prov-bar-fill {
    height: 100%;
    border-radius: 100px;
  }
  .pda-prov-meta {
    margin-top: 9px;
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--muted);
  }
  .pda-prov-status {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 100px;
    font-size: 9.5px;
    font-weight: 700;
  }
  .pda-prov-card.focused {
    box-shadow: 0 0 0 2px var(--gold-d), 0 4px 12px rgba(15,23,42,0.08);
    border-color: var(--gold);
  }
  .pda-prov-card.dimmed {
    opacity: 0.45;
  }
  .pda-prov-card:not(.dimmed):hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .pda-prov-focus-tag {
    display: inline-block;
    background: var(--gold);
    color: var(--ink);
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* Animation */
  .fade-in {
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Coordination view extras */
  .donut-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 6px 0;
  }
  .donut-svg {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }

  @media (max-width: 1280px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .g-2-1, .g-1-2 { grid-template-columns: 1fr; }
  }
  /* ============================================================
     RESPONSIVE · Mobile-first hamburger drawer + stacked layouts
  ============================================================ */

  /* Hamburger button · hidden by default, shown on mobile */
  .sb-hamburger {
    display: none;
    width: 38px; height: 38px;
    border-radius: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    cursor: pointer;
    padding: 10px 9px;
    flex-direction: column;
    justify-content: space-between;
    margin-right: 8px;
    transition: background 0.15s ease;
    box-sizing: border-box;
  }
  .sb-hamburger:hover { background: rgba(255,255,255,0.22); }
  .sb-hamburger span {
    display: block;
    height: 2.5px;
    width: 100%;
    background: white;
    border-radius: 2px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  body.sb-open .sb-hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  body.sb-open .sb-hamburger span:nth-child(2) { opacity: 0; }
  body.sb-open .sb-hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .sb-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.55);
    z-index: 90;
    backdrop-filter: blur(2px);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  body.sb-open .sb-backdrop {
    opacity: 1;
    pointer-events: auto;
  }

  /* ====== TABLET (≤ 1024px) ====== */
  @media (max-width: 1024px) {
    .h-context { display: none; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .exec-grid { grid-template-columns: 1fr; }
    .pda-prov-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ====== MOBILE / SMALL TABLET (≤ 900px) ====== */
  @media (max-width: 900px) {
    .sb-hamburger { display: flex; }
    .sb-backdrop { display: block; }

    /* Universal grid stacking · applies to ALL pages */
    .g-1-1, .g-3 { grid-template-columns: 1fr !important; gap: 10px !important; }
    .g-2-1, .g-1-2 { grid-template-columns: 1fr !important; }
    .pda-prov-grid { grid-template-columns: 1fr !important; }

    /* Tables · make any large table horizontally scrollable */
    .card-body { min-width: 0; }
    .card-body table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    .card-body table th, .card-body table td {
      font-size: 11px;
      padding: 7px 8px;
    }
    /* Edge-fade affordance · appears only when the table overflows horizontally */
    .card-body table[data-overflow-right="true"] {
      -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 32px), rgba(0,0,0,0.18) 100%);
              mask-image: linear-gradient(to right, black 0, black calc(100% - 32px), rgba(0,0,0,0.18) 100%);
    }
    .card-body table[data-overflow-left="true"][data-overflow-right="true"] {
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.18) 0, black 32px, black calc(100% - 32px), rgba(0,0,0,0.18) 100%);
              mask-image: linear-gradient(to right, rgba(0,0,0,0.18) 0, black 32px, black calc(100% - 32px), rgba(0,0,0,0.18) 100%);
    }
    .card-body table[data-overflow-left="true"]:not([data-overflow-right="true"]) {
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.18) 0, black 32px, black 100%);
              mask-image: linear-gradient(to right, rgba(0,0,0,0.18) 0, black 32px, black 100%);
    }

    /* ai-box · clip decorative ::after to prevent phantom horizontal overflow */
    .ai-box {
      overflow-wrap: anywhere;
      word-break: break-word;
      contain: paint;
    }

    /* Sidebar becomes off-canvas drawer */
    .layout { display: block; }
    .sb {
      position: fixed;
      top: 0; left: 0;
      width: 280px;
      max-width: 85vw;
      height: 100vh;
      transform: translateX(-100%);
      transition: transform 0.28s ease;
      z-index: 95;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      overflow-y: auto;
    }
    body.sb-open .sb { transform: translateX(0); }
    [dir="rtl"] .sb {
      left: auto; right: 0;
      transform: translateX(100%);
      box-shadow: -4px 0 20px rgba(0,0,0,0.25);
    }
    [dir="rtl"] body.sb-open .sb { transform: translateX(0); }

    .main {
      width: 100%;
      margin-left: 0;
    }

    /* Header compresses */
    .header {
      padding: 10px 12px;
      gap: 8px;
    }
    .h-logo-DEPRECATED { width: 32px; height: 32px; font-size: 11px; }
    .h-title { font-size: 14px; }
    .h-sub { font-size: 9.5px; }
    .h-right { gap: 5px; }
    .h-pill { padding: 4px 8px; font-size: 10.5px; }
    .h-pill .ico { font-size: 11px; }

    /* Topbar wraps and stacks blocks */
    .topbar {
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
    }
    .breadcrumb {
      width: 100%;
      font-size: 10.5px;
      order: 1;
    }
    .breadcrumb .crumb-current { font-size: 11px; }
    /* Hide non-current crumbs on mobile, keep only last */
    .breadcrumb span:not(.crumb-current):not(.sep) { display: none; }
    .breadcrumb .sep { display: none; }
    .breadcrumb .crumb-current { display: inline; }
    /* Show inline ellipsis before current */
    .breadcrumb::before {
      content: '…';
      color: var(--muted);
      margin-right: 6px;
      font-size: 11px;
    }
    .breadcrumb:has(span:not(.crumb-current))::before { content: '…'; }

    .time-block, .scope-block, .lang-block {
      flex-shrink: 1;
    }
    .time-label { display: none; }
    .period-pills { padding: 2px; }
    .pp { padding: 4px 8px; font-size: 10.5px; }
    .period-sel { font-size: 11.5px; padding: 4px 6px; max-width: 130px; }
    .scope-sel { max-width: 180px; }
    .lang-pills { padding: 2px; }
    .lang-btn { padding: 4px 7px; font-size: 10.5px; }

    /* Page header */
    .ph { padding: 14px 16px; }
    .ph-title {
      font-size: 19px !important;
      line-height: 1.25;
    }
    .ph-sub { font-size: 11.5px; line-height: 1.4; }
    .ph-tag { font-size: 10px; }

    /* Content padding */
    .content { padding: 14px; }
    .content > * + * { margin-top: 12px !important; }

    /* KPI grid → single column on phones */
    .kpi-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .kpi { padding: 14px; }
    .kpi-value { font-size: 24px; }
    .kpi-label { font-size: 10.5px; }

    /* 2-column grid → 1-column */
    .grid-2 { grid-template-columns: 1fr !important; }

    /* Cards */
    .card { padding: 14px; }
    .card-title { font-size: 13px; }
    .card-subtitle { font-size: 11px; }

    /* AI box / Santex */
    .ai-box { padding: 14px; }
    .ai-title { font-size: 14px; }
    .ai-text { font-size: 12.5px; line-height: 1.55; }

    /* PDA tabs scroll horizontally */
    .pda-tabs {
      overflow-x: auto;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .pda-tab {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 11px;
      padding: 8px 11px;
    }

    /* PDA province cards stack 1-column */
    .pda-prov-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .pda-prov-card { padding: 14px; }

    /* Filter bar wraps */
    .fb-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .fb-badge { width: 100%; justify-content: flex-start; }
    .fb-text { font-size: 11.5px; line-height: 1.5; }

    /* Ministerial executive tabs */
    .exec-tabs {
      grid-template-columns: 1fr;
      gap: 6px;
      padding: 12px 14px 0;
    }
    .exec-tab { padding: 9px 12px; }
    .et-num { font-size: 18px; min-width: 28px; }
    .et-label { font-size: 12.5px; }
    .et-meta { font-size: 9.5px; }

    /* KPI exec stack */
    .kpe-head {
      flex-wrap: wrap;
      gap: 8px;
    }
    .kpe-num { font-size: 16px; min-width: 28px; }
    .kpe-label { font-size: 13px; }
    .kpe-cat { font-size: 9.5px; }
    .kpe-status { font-size: 9.5px; padding: 2px 6px; }
    .kpe-body {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .kpe-num-big { font-size: 36px; }
    .kpe-unit { font-size: 15px; }
    .kpe-spark-block {
      width: 100%;
      text-align: left;
    }
    .mini-spark { height: 36px; }
    .kpe-action { font-size: 11px; padding: 8px 10px; }

    /* Footer */
    .exec-footer { padding: 14px; }
    .exec-footer-row {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .ef-label { font-size: 9px; }
    .ef-val { font-size: 11.5px; }

    /* Map · keep grid but shrink */
    .map-wrap {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
    }
    .map-grid {
      gap: 4px;
      max-width: 100%;
      aspect-ratio: 5/5.5;
    }
    /* Force flexible width on mobile, ignore size variants except XL */
    .map-svg-wrap,
    .map-svg-wrap[data-size="S"],
    .map-svg-wrap[data-size="M"],
    .map-svg-wrap[data-size="L"],
    .map-svg-wrap[data-size="XL"] {
      max-width: 100%;
      order: 3;
    }
    .map-label-name { font-size: 8.5px; stroke-width: 2; }
    .map-label-val  { font-size: 9.5px; stroke-width: 2; }
    .map-label.tiny .map-label-name { font-size: 7px; }
    .map-label.tiny .map-label-val  { font-size: 8px; }
    .mc-name { font-size: 9.5px; }
    .mc-val { font-size: 12px; }
    .mc-pda { font-size: 7.5px; margin-top: 2px; }
    .map-info {
      position: static;
      margin-bottom: 10px;
      min-width: 0;
      width: 100%;
      order: 5;
    }
    .map-legend {
      position: static;
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
      order: 4;
    }
    /* Toolbar · switch from absolute overlay to normal flow above the SVG
       so it is never hidden by the fixed header on small screens */
    .map-toolbar {
      position: static;
      order: 1;
      margin-bottom: 8px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .map-tb-group { height: 30px; }
    .map-tb-btn { min-width: 30px; padding: 0 8px; font-size: 11.5px; }
    .map-tb-label { padding: 0 7px; font-size: 9px; }
    .map-tb-zoom-pct { min-width: 44px; padding: 0 7px; font-size: 10.5px; }
    .map-mode-toggle {
      position: static;
      align-self: flex-end;
      order: 2;
      margin-bottom: 10px;
    }
    .mm-btn { padding: 5px 10px; font-size: 10.5px; }

    /* Province banner */
    .prov-banner {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 14px;
    }
    .prov-banner-clear { font-size: 11px; padding: 6px 10px; }

    /* Sidebar prog/subprog touch-friendly */
    .prog-head { padding: 11px 12px; }
    .prog-label { font-size: 13px; }
    .subprog { padding: 10px 14px 10px 36px; }
    .sp-label { font-size: 12px; }

    /* Tables that don't fit: horizontal scroll */
    .scroll-x {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* SI cards */
    .si-grid { grid-template-columns: 1fr !important; }

    /* Bar rows */
    .bar-row {
      grid-template-columns: 1fr !important;
      gap: 4px;
    }
    .bar-row .br-label {
      font-size: 11px;
      white-space: normal;
    }

    /* Disable hover scale on touch (no extra space + no scale bug on tap) */
    .kpi:hover, .card:hover, .pda-prov-card:hover, .kpi-exec:hover, .map-cell:hover {
      transform: none;
    }
  }

  /* ====== PHONE (≤ 480px) ====== */
  @media (max-width: 480px) {
    .h-title { font-size: 13px; }
    .h-sub { display: none; }
    /* Hide right pills on small phone, keep them readable inside the drawer/topbar */
    .h-right { display: none; }
    .h-context { display: none; }

    .ph-title { font-size: 17px !important; }
    .kpi-value { font-size: 22px; }
    .kpe-num-big { font-size: 32px; }

    /* Hide period mode pills, keep only dropdown */
    .period-pills { display: none; }
    .period-sel { max-width: 110px; font-size: 11px; }
    .scope-sel { max-width: 150px; font-size: 11px; }

    /* Map grid even tighter */
    .map-wrap { padding: 12px 8px; }
    .map-grid { gap: 3px; }
    .map-label-name { font-size: 7px; stroke-width: 1.6; }
    .map-label-val  { font-size: 8.5px; stroke-width: 1.6; }
    .map-label.tiny { display: none; }
    .mc-name { font-size: 8.5px; }
    .mc-val { font-size: 10.5px; }
    .mc-pda { font-size: 6.5px; letter-spacing: 0.4px; }

    /* Toolbar · keep static + compact, hide labels */
    .map-toolbar { gap: 5px; margin-bottom: 6px; }
    .map-tb-label { display: none; }
    .map-tb-group { height: 28px; }
    .map-tb-btn { min-width: 28px; padding: 0 7px; font-size: 11px; }
    .map-tb-zoom-pct { min-width: 40px; padding: 0 6px; font-size: 10px; }
    .map-mode-toggle { padding: 2px; margin-bottom: 8px; }
    .mm-btn { padding: 4px 8px; font-size: 10px; }

    /* Smaller lang switcher on phone · initials only */
    .lang-btn { padding: 4px 6px; font-size: 10px; min-width: 28px; }
  }

  /* ============================================================
     REFONTE VISUELLE · SURCHARGES (note de design)
     Additives : aucune regle existante supprimee, la cascade tranche.
  ============================================================ */
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 4px; }
  .header { border-bottom: 2px solid var(--gold); }

  .pill.green  { background: var(--rag-green-l);  color: var(--rag-green); }
  .pill.yellow { background: var(--rag-yellow-l); color: var(--rag-yellow); }
  .pill.orange { background: var(--rag-orange-l); color: var(--rag-orange); }
  .pill.red    { background: var(--rag-red-l);    color: var(--rag-red); animation: none; }
  .pill.na     { background: var(--rag-na-l);     color: var(--rag-na); }

  .kpi::before, .kpi-exec::before {
    top: 0; bottom: 0; left: 0; right: auto;
    width: 3px; height: auto;
  }
  .kpi::after, .kpi-exec::after { display: none; }
  [dir="rtl"] .kpi::before, [dir="rtl"] .kpi-exec::before { left: auto; right: 0; }

  .kpi .kpi-value { color: var(--ink); font-family: var(--font); font-weight: 600; }
  .kpi.green .kpi-value, .kpi.yellow .kpi-value, .kpi.orange .kpi-value, .kpi.red .kpi-value { color: var(--ink); }
  .kpi.na .kpi-value { color: var(--rag-na); }

  .map-prov.rag-na { fill: var(--border-2); }
  .map-cell.rag-na { background: var(--rag-na-l); color: var(--rag-na); }

  .pp.on { background: var(--royal); color: #fff; }

  .card-title { font-family: var(--font-h); font-size: 13.5px; }

  /* ====== LÉTALITÉ : chiffre, courbe, variations ====== */

  /* module meteo */

  /* analyse pluviometrie */

  .sr-garde-haut { background:linear-gradient(135deg,var(--royal-d),var(--royal)); padding:20px 30px; text-align:center; }
  .sr-garde-armes { font-size:12px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-l); }
  .sr-garde-min { font-family:var(--font-h); font-size:15px; font-weight:700; color:#fff; margin-top:5px; }
  .sr-garde-org { font-size:11.5px; color:#C7D2E4; margin-top:3px; }
  .sr-garde-corps { padding:34px 30px 28px; text-align:center; }
  .sr-garde-sur { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gold-d); }
  .sr-garde-titre { font-family:var(--font-h); font-size:34px; font-weight:700; color:var(--ink); margin:8px 0 0; line-height:1.1; }
  .sr-garde-zone { font-size:15px; color:var(--body); margin-top:7px; }
  .sr-garde-periode { font-size:12.5px; color:var(--muted); margin-top:4px; font-style:italic; }
  .sr-garde-resume { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:26px; padding-top:22px; border-top:1px solid var(--border); }
  .sr-gr { display:flex; flex-direction:column; gap:3px; }
  .sr-gr-v { font-family:var(--font-h); font-size:29px; font-weight:700; color:var(--royal); line-height:1; font-variant-numeric:tabular-nums; }
  .sr-gr-l { font-size:11px; color:var(--muted); }
  .sr-garde-bas { display:flex; justify-content:space-between; gap:20px; padding:14px 30px; background:var(--surface-2); font-size:10.5px; color:var(--muted); line-height:1.6; flex-wrap:wrap; }
  .sr-garde-src strong { color:var(--body); }
  .sr-garde-maj { text-align:right; white-space:nowrap; }

  /* ====== MISE EN PAGE POUR IMPRESSION ====== */
  /* Corps de texte a 28px (21pt) : le double du plancher precedent. Le contenu
     passe en pleine largeur, les tableaux et graphiques disposant ainsi de toute
     la page plutot que d'une demi-colonne. */
  @media print {
    @page { size:A4 portrait; margin:12mm 10mm 14mm; }
    html, body { width:100% !important; max-width:100% !important; overflow:visible !important;
                 background:#fff; font-size:20px; }
    .main, .content { padding:0 !important; margin:0 !important;
                      width:100% !important; max-width:100% !important; }
    .bc-barre, .sr-epi-aide, .header, .breadcrumbs, .crumb-bar, .ph { display:none !important; }

    /* Une seule colonne : chaque bloc occupe toute la largeur */
    .grid-2 { display:grid !important; grid-template-columns:1fr 1fr !important;
              gap:9px !important; margin-bottom:9px !important; align-items:stretch; }
    .sr-cles { display:grid !important; grid-template-columns:repeat(6,1fr) !important;
               gap:8px !important; margin-bottom:10px !important; }
    .card { page-break-inside:avoid; box-shadow:none; border:1px solid var(--border);
            display:flex; flex-direction:column; padding:8px 10px; margin:0;
            max-width:100% !important; width:100% !important; box-sizing:border-box; }

    /* Page de garde */
    .sr-garde { page-break-after:always; box-shadow:none; border:none; }
    .sr-garde-haut { padding:6px 22px; }
    .sr-garde-armes { font-size:18px; }
    .sr-garde-min { font-size:23px; }
    .sr-garde-org { font-size:18px; }
    .sr-garde-corps { padding:2mm 22px 1mm; }
    .sr-garde-sur { font-size:18px; }
    .sr-garde-titre { font-size:30px; }
    .sr-garde-zone { font-size:22px; }
    .sr-garde-periode { font-size:19px; }
    .sr-garde-resume { margin-top:7px; padding-top:6px; }
    .sr-gr-v { font-size:27px; }
    .sr-gr-l { font-size:19px; }
    .sr-garde-milieu { display:grid !important; grid-template-columns:1.3fr 1fr 1fr !important; gap:16px !important; padding:0 22px 8px; align-items:start; }
    .sr-garde-milieu > * { margin-bottom:0; }
    .sr-gm-t { font-size:19px !important; }
    .sr-gm-d, .ch-edit, .sr-gm-liste li, .sr-gm-part { font-size:17px !important; line-height:1.32; }
    .sr-garde-bas { padding:6px 22px; }
    .sr-garde-src, .sr-garde-maj { font-size:17px; line-height:1.25; }

    /* Chiffres cles */
    .sr-chiffre { padding:9px 6px; }
    .sr-val { font-size:30px; }
    .sr-lib { font-size:18px; margin-top:4px; line-height:1.2; }
    .sr-sous { font-size:18px; margin-top:3px; line-height:1.25; }

    /* Cartes, tableaux */
    .card-title { font-size:21px; }
    .card-sub { font-size:19px; }
    .card-hdr { margin-bottom:6px; }
    .card-foot, .dd-test-note, .pl-note { font-size:18px; line-height:1.35; margin-top:7px; padding-top:6px; }
    table, .tbl-s { max-width:100% !important; width:100% !important; table-layout:auto !important; }
    .tbl-s td.num, .tbl-s th.num { text-align:right; white-space:nowrap !important; }
    .tbl-s td:first-child, .tbl-s th:first-child { text-align:left; }
    .tbl-dist td, .tbl-dist th { padding:8px 5px !important; }
    .tbl-dist th { font-size:16px !important; }
    /* Le tableau des districts compte cinq colonnes : il occupe toute la largeur */
    .sr-large { display:grid !important; grid-template-columns:1.45fr 1fr !important; }
    .tbl-s { width:100% !important; }
    .tbl-s tr > *:first-child { width:auto; }
    .tbl-s td, .tbl-s th { padding:6px 5px !important; font-size:18px !important; white-space:normal !important; }
    .tbl-s th { font-size:18px !important; }
    .pill { font-size:19px; padding:2px 8px; }

    /* Graphiques a l'echelle du texte */
    .sr-epi { height:118px; padding-top:21px; gap:5px; }
    .sr-epi-lab { font-size:18px; }
    .sr-epi-v { font-size:19px; top:-24px; }
    .sr-epi-leg, .chol-legende, .chol-legende span, .pl-lg { font-size:18px !important; gap:16px; }
    .chol-carte { max-height:175px; }
    .cf-etiq { font-size:22px !important; }
    .sr-rep { gap:14px; }
    .sr-rep-l { grid-template-columns:190px 1fr 140px; }
    .sr-rep-lib, .sr-rep-val, .sr-rep-pct { font-size:20px; }
    .sr-rep-barre { height:24px; }
    .pyr-entete, .pyr-lab, .pyr-n { font-size:20px; }
    .pyr-bar { height:22px; }
    .pyr-ligne { grid-template-columns:1fr 165px 1fr; gap:12px; margin-bottom:4px; }

    /* Analyses */
    .ed-bloc { margin-bottom:14px; }
    .ed-titre { font-size:22px; margin-bottom:7px; }
    .ed-zone { font-size:22px; line-height:1.5; padding:13px 15px; background:var(--surface-2); text-align:justify; }
    .ch-edit:hover { background:transparent; }
    .sr-epi-col { cursor:default; }
    a[href]::after { content:none; }
  }
  @media (max-width:700px){ .sr-garde-resume{ grid-template-columns:repeat(2,1fr); } .sr-garde-titre{ font-size:26px; } .sr-garde-bas{ flex-direction:column; } .sr-garde-maj{ text-align:left; } }

  .sr-garde-milieu { display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:22px; padding:0 30px 20px; }
  .sr-gm-t { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--royal); padding-bottom:5px; border-bottom:1px solid var(--border); margin-bottom:8px; }
  .sr-gm-liste { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .sr-gm-liste li { font-size:11px; color:var(--body); line-height:1.45; }
  .sr-gm-d { display:inline-block; font-weight:700; color:var(--royal); margin-right:6px; font-variant-numeric:tabular-nums; }
  .sr-gm-puces li { padding-left:11px; position:relative; }
  .sr-gm-puces li::before { content:""; position:absolute; left:0; top:6px; width:4px; height:4px; border-radius:50%; background:var(--gold); }
  .sr-gm-part { font-size:11px; color:var(--body); line-height:1.5; }
  .ch-edit { border-radius:3px; transition:background .12s, box-shadow .12s; }
  .ch-edit:hover { background:var(--surface-2); }
  .ch-edit:focus { outline:none; background:var(--surface); box-shadow:0 0 0 2px var(--royal-l); }
  .ch-inline { font-weight:inherit; }
  @media print { .ch-edit:hover { background:transparent; } }
  @media (max-width:900px){ .sr-garde-milieu{ grid-template-columns:1fr; gap:16px; } }

/* ---------------- extension CID ---------------- */
.cid-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.cid-chip{padding:6px 12px;border-radius:16px;border:1px solid var(--border);cursor:pointer;background:#fff;color:var(--body);font:600 12px/1 inherit;transition:background .15s,color .15s}
.cid-chip.on{background:var(--royal);color:#fff;border-color:var(--royal)}
.cid-chip.mini{padding:4px 9px;font-size:11px;border-radius:13px}
.cid-provs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.cid-btn-csv,.cid-lien{padding:6px 13px;border-radius:8px;border:1px solid var(--royal-pale);background:var(--royal-tint);color:var(--royal-d);font:600 12px/1 inherit;cursor:pointer}
.cid-btn-csv:hover,.cid-lien:hover{background:var(--royal);color:#fff}
.cid-lien{border:none;background:none;padding:4px 0;color:var(--royal)}
.cid-lien:hover{background:none;color:var(--gold-d);text-decoration:underline}
.cid-input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--border-2);border-radius:9px;font:500 13px/1.2 inherit;color:var(--ink);background:#fff}
