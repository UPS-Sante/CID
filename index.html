.cid-res-note{font-size:12.5px;color:var(--muted);padding:8px 2px}
.cid-table-defile{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.cid-table-defile table{margin:0}
.cid-sous-lib{font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
.cid-anom-liste{padding:4px 2px;line-height:1.7;color:var(--body);font-size:12.5px}
.cid-strip{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:6px 2px}
.cid-strip-item{text-align:center}
.cid-strip-val{font-size:22px;font-weight:800;color:var(--royal)}
.cid-strip-lib{font-size:11px;color:var(--muted);margin-top:2px}
.cid-bandeau-avert{background:var(--gold-tint);border:1px solid var(--gold-l);border-radius:10px;padding:11px 15px;font-size:12.5px;color:var(--gold-d);margin-bottom:14px;font-weight:600}
.cid-outils{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cid-select{padding:9px 12px;border:1px solid var(--border-2);border-radius:9px;font:600 12.5px/1.2 inherit;color:var(--ink);background:#fff;max-width:460px}
/* fil d'alertes */
.cid-alertes{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:16px 0;box-shadow:0 1px 3px rgba(27,26,22,.05)}
.cid-alertes-tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cid-alertes-titre{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}
.cid-alertes-tout{border:none;background:none;color:var(--royal);font:600 12px/1 inherit;cursor:pointer}
.cid-alertes-tout:hover{text-decoration:underline}
.cid-alertes-liste{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.cid-al{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);cursor:pointer;text-align:left;font:500 12.5px/1.4 inherit;color:var(--body)}
.cid-al:hover{border-color:var(--royal-pale);background:var(--royal-tint)}
.cid-al-txt{flex:1}
.cid-al-fleche{color:var(--muted-2)}
.cid-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.cid-dot.rouge{background:#B3372F;box-shadow:0 0 0 3px rgba(179,55,47,.15)}
.cid-dot.orange{background:#D97B29;box-shadow:0 0 0 3px rgba(217,123,41,.14)}
.cid-dot.jaune{background:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.14)}
/* registre des alertes */
.cid-al-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;margin-top:6px}
.cid-al-carte{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-2);border-radius:12px;padding:14px 16px}
.cid-al-carte.rouge{border-left-color:#B3372F}
.cid-al-carte.orange{border-left-color:#D97B29}
.cid-al-carte.jaune{border-left-color:#C9A227}
.cid-al-carte-tete{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.cid-al-dom{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cid-al-per{margin-left:auto;font-size:11px;color:var(--muted-2)}
.cid-al-titre{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:5px}
.cid-al-det{font-size:12.5px;color:var(--body);line-height:1.55;margin-bottom:8px}
/* cockpit */
.cid-kpi10{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cid-cliquable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.cid-cliquable:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(31,56,100,.12)}
.cid-srcs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.cid-src{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.92);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 10px}
.cid-src em{font-style:normal;font-weight:500;opacity:.75;margin-left:5px}
.cid-src.off{opacity:.45}
@media (max-width:760px){.cid-kpi10{grid-template-columns:1fr}.cid-al-grille{grid-template-columns:1fr}}

/* ==============================================================
   COUCHE DONNEES REELLES
============================================================== */
/*DR-DEBUT*/
/* Charge data/consolide.json (produit par la synchronisation Drive)
   et intercepte genValue : toute valeur presente dans la base reelle
   remplace la valeur de demonstration ; le reste garde le mode demo.
   La table correspondance_indicateurs.json relie les metriques du
   tableau de bord aux libelles reels, sans modification de code.   */

const DR = { actif:false, index:new Map(), metriques:{}, provinces:{}, periodes:[], genere:null };

function drSimplifier(t) {
  return String(t == null ? "" : t)
    .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]+/g, " ").trim().toLowerCase();
}

/* periode AAAA-MM decalee de n mois en arriere */
function drMoisPrecedent(periode, n) {
  const [a, m] = periode.split("-").map(Number);
  const total = a * 12 + (m - 1) - n;
  return `${Math.floor(total / 12)}-${String(total % 12 + 1).padStart(2, "0")}`;
}

/* liste des mois couverts par l'etat courant (mois, trimestre ou annee) */
function drMoisCibles(monthOffset) {
  const v = String(state.periodValue);
  if (state.periodMode === "quarter" && v.includes("-Q")) {
    const [a, q] = v.split("-Q").map(Number);
    return [1, 2, 3].map(i => `${a}-${String((q - 1) * 3 + i).padStart(2, "0")}`);
  }
  return [drMoisPrecedent(/^\d{4}-\d{2}$/.test(v) ? v : (DR.periodes[DR.periodes.length-1] || "2026-01"), monthOffset)];
}

/* valeur reelle pour (metrique, province, decalage) ; null si absente */
function valeurReelle(metric, provId, monthOffset) {
  const indicateur = DR.metriques[metric];
  if (!indicateur) return null;
  const province = provId === null ? "National" : DR.provinces[provId];
  if (!province) return null;
  const mois = drMoisCibles(monthOffset || 0);
  const valeurs = mois
    .map(p => DR.index.get(indicateur + "|" + province + "|" + p))
    .filter(x => x !== undefined);
  if (!valeurs.length) return null;
  return Math.round(valeurs.reduce((s, x) => s + x, 0) / valeurs.length * 10) / 10;
}

/* construction des tables a partir des trois fichiers publies */
function drConstruire(consolide, catalogue, correspondance, referentiel) {
  DR.index.clear(); DR.metriques = {}; DR.provinces = {};

  /* provinces du tableau de bord -> noms canoniques du referentiel */
  const canon = {};
  (referentiel.provinces || []).forEach(p => { canon[drSimplifier(p)] = p; });
  Object.entries(referentiel.variantes || {}).forEach(([k, v]) => { canon[drSimplifier(k)] = v; });
  PROVINCES.forEach(p => {
    const c = canon[drSimplifier(p.name)] || canon[drSimplifier(p.short)];
    if (c) DR.provinces[p.id] = c;
  });

  /* metriques -> libelle reel le plus frequent qui satisfait la regle */
  const libelles = {};
  consolide.enregistrements.forEach(e => {
    const cle = e.indicateur + "\u0000" + e.source;
    libelles[cle] = (libelles[cle] || 0) + 1;
  });
  Object.entries(correspondance).forEach(([metric, regle]) => {
    if (metric.startsWith("_") || !regle.contient) return;
    const mots = regle.contient.map(drSimplifier);
    let meilleur = null, poids = -1;
    Object.entries(libelles).forEach(([cle, n]) => {
      const [libelle, source] = cle.split("\u0000");
      if (regle.source && source !== regle.source) return;
      const s = drSimplifier(libelle);
      if (mots.every(m => s.includes(m)) && n > poids) { meilleur = libelle; poids = n; }
    });
    if (meilleur) DR.metriques[metric] = meilleur;
  });

  /* index (indicateur|province|periode) -> valeur */
  consolide.enregistrements.forEach(e => {
    DR.index.set(e.indicateur + "|" + e.province + "|" + e.periode, e.valeur);
  });
  DR.periodes = (catalogue.periodes || []).slice().sort();
  DR.genere = consolide.genere || null;
  DR.actif = DR.index.size > 0 && Object.keys(DR.metriques).length > 0;
  return DR.actif;
}

/* selecteur de mois aligne sur les periodes reellement disponibles */
function drActualiserPeriodes() {
  if (!DR.periodes.length) return;
  const [a, m] = DR.periodes[DR.periodes.length - 1].split("-").map(Number);
  while (a > ANNEES[0]) ANNEES.unshift(ANNEES[0] + 1);
  state.periodYear = a;
  state.periodMonth = m;
  state.periodQuarter = Math.ceil(m / 3);
  majPeriodValue();
  const lbl = document.getElementById("h-period");
  if (lbl) lbl.textContent = periodLabel();
}

/* valeur pour une periode explicite AAAA-MM, sans dependre du selecteur */
function valeurPeriodeExplicite(metric, provId, periode) {
  const indicateur = DR.metriques[metric];
  if (!indicateur) return null;
  const province = provId === null ? "National" : DR.provinces[provId];
  if (!province) return null;
  const v = DR.index.get(indicateur + "|" + province + "|" + periode);
  return v === undefined ? null : v;
}
function valeurNatPeriode(metric, periode) {
  const direct = valeurPeriodeExplicite(metric, null, periode);
  if (direct !== null) return direct;
  const vals = PROVINCES.map(p => valeurPeriodeExplicite(metric, p.id, periode)).filter(v => v != null);
  return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10 : null;
}

function t(key) {
  const dict = I18N[state.lang] || I18N.fr;
  return dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
}

function setLang(lang) {
  state.lang = lang;
  // Direction (RTL for Arabic)
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  // Update static chrome
  applyStaticTranslations();
  // Re-render dynamic content
  renderSidebar();
  renderMain();
}

function applyStaticTranslations() {
  const m = {
    "h-app-title": "app_title",
    "h-app-subtitle": "app_subtitle",
    "h-country": "app_country",
    "lbl-programs": "programs",
    "lbl-cycle-title": "cycle",
    "lbl-cycle-desc": "cycle_desc",
    "lbl-next-review": "next_review",
  };
  Object.keys(m).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = t(m[id]);
  });
  const search = document.getElementById("search-input");
  if (search) search.placeholder = t("search_indicator");
}

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const ANNEES = (() => { const a = []; for (let x = 2026; x >= 2020; x--) a.push(x); return a; })();
/* Dernier mois complet presentable : aout 2026 est un mois partiel, on ne le montre pas.
   Toute periode derivee ou selectionnee est bornee a cette limite. */
const DERNIER_MOIS = { annee: 2026, mois: 7, trim: 2 };
function bornerPeriode() {
  if (state.periodYear > DERNIER_MOIS.annee) { state.periodYear = DERNIER_MOIS.annee; }
  if (state.periodYear === DERNIER_MOIS.annee) {
    if (state.periodMonth > DERNIER_MOIS.mois) state.periodMonth = DERNIER_MOIS.mois;
    if (state.periodQuarter > DERNIER_MOIS.trim) state.periodQuarter = DERNIER_MOIS.trim;
  }
}
const MOIS_NOMS = ["Janvier","Février","Mars","Avril","Mai","Juin",
                   "Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const TRIMESTRES = [
  {v:1, l:"T1 (Jan–Mar)"}, {v:2, l:"T2 (Avr–Jun)"},
  {v:3, l:"T3 (Jul–Sep)"}, {v:4, l:"T4 (Oct–Déc)"},
];
function majPeriodValue() {
  bornerPeriode();
  state.periodValue = state.periodMode === "quarter"
    ? `${state.periodYear}-Q${state.periodQuarter}`
    : `${state.periodYear}-${String(state.periodMonth).padStart(2, "0")}`;
}

function periodLabel() {
  if (state.periodMode === "quarter") return `${TRIMESTRES[state.periodQuarter - 1].l} ${state.periodYear}`;
  return `${MOIS_NOMS[state.periodMonth - 1]} ${state.periodYear}`;
}

/* ==============================================================
   RENDER · Sidebar
============================================================== */
function renderSidebar() {
  // i18n key per program id (sub labels handled via sub.i18n_key)
  const progI18nKey = {
    min: "prog_min", vacc: "prog_vacc", dsr: "prog_dsr",
    prog: "prog_prg", dpml: "prog_log", drh: "prog_rh",
    cousp: "prog_cousp", dpsis: "prog_dpsis"
  };
  let grpCourant = null;
  const html = PROGRAMS.filter(p => !p.masque).map(p => {
    const label = progI18nKey[p.id] ? t(progI18nKey[p.id]) : p.label;
    const enTete = (p.groupe && p.groupe !== grpCourant)
      ? `<div class="sb-bloc">${(grpCourant = p.groupe)}</div>` : (p.groupe && (grpCourant = p.groupe), "");
    return enTete + `
    <div class="prog ${p.priority ? 'priority' : ''}" data-prog="${p.id}" data-c="${p.c}">
      <div class="prog-head" onclick="toggleProgram('${p.id}')">
        <div class="prog-icon">${p.icon}</div>
        <div class="prog-label">${label}</div>
        <div class="prog-count">${p.sub.length}</div>
        <div class="prog-chev"></div>
      </div>
      <div class="subprog-list">
        ${p.sub.map(s => `
          <div class="subprog ${s.attente ? 'sp-attente' : ''}" data-sub="${s.id}" onclick="selectSub('${p.id}','${s.id}')">
            <span class="sp-label">${s.i18n_key ? t(s.i18n_key) : s.label}</span>
            ${s.pda ? '<span class="sp-pda-badge">PDA</span>' : ''}
            ${s.attente ? '<span class="sp-attente-badge">à venir</span>' : ''}
          </div>
        `).join("")}
      </div>
    </div>
  `;
  }).join("");
  document.getElementById("prog-list").innerHTML = html;
}

function toggleProgram(progId) {
  document.querySelectorAll(".prog").forEach(el => {
    if (el.dataset.prog === progId) el.classList.toggle("open");
    else el.classList.remove("open");
  });
  // Un programme a sous-menu unique s'ouvre directement sur sa vue, en un seul clic
  const p = PROGRAMS.find(x => x.id === progId);
  if (p && p.sub && p.sub.length === 1) selectSub(progId, p.sub[0].id);
}

function selectSub(progId, subId) {
  state.program = progId;
  state.sub = subId;
  // Entering PDA: force scope to PDA and reset province filter to non-PDA values
  if (subId === "vacc-pda") {
    state.scope = "pda";
    state.pdaDomain = "overview";
    // If active province filter is not a PDA province, clear it
    if (state.provinceFilter && !PDA_PROVINCES.includes(state.provinceFilter)) {
      state.provinceFilter = null;
      document.getElementById("h-scope").textContent = "3 Provinces PDA";
    }
  }
  // Leaving PDA: reset scope to national
  if (subId !== "vacc-pda") {
    state.scope = "national";
  }
  document.querySelectorAll(".prog").forEach(el => {
    el.classList.toggle("active", el.dataset.prog === progId);
    el.classList.toggle("open", el.dataset.prog === progId);
  });
  document.querySelectorAll(".subprog").forEach(el => {
    el.classList.toggle("active", el.dataset.sub === subId);
  });
  renderMain();
  closeSidebarOnMobile();
}

function setScope(scope) {
  state.scope = scope;
  document.getElementById("h-scope").textContent = scope === "pda" ? "3 Provinces PDA" : "National";
  renderMain();
}

function setPdaDomain(d) {
  state.pdaDomain = d;
  renderMain();
}

function renderMain() {
  try { renderMainNoyau(); }
  catch (e) {
    console.error("Erreur de rendu :", e);
    const zone = document.getElementById("main") || document.querySelector(".main");
    if (zone) zone.innerHTML = `<div style="padding:32px;color:var(--muted);font-size:13px;">
      Une erreur d'affichage est survenue sur cette vue.
      <button class="tb-btn" onclick="location.reload()" style="margin-left:10px;">Recharger la page</button></div>`;
  }
}

/* ==============================================================
   RENDER · Main content
============================================================== */
function renderMainNoyau() {
  const view = VIEWS[state.sub] || (() => placeholderView(state.sub));
  const v = view(state);
  // If province filter is set, append province name to the breadcrumb
  if (state.provinceFilter) {
    const p = PROVINCES.find(x => x.id === state.provinceFilter);
    if (p && !v.crumbs[v.crumbs.length - 1].includes(p.name)) {
      v.crumbs[v.crumbs.length - 1] = v.crumbs[v.crumbs.length - 1] + ' · ' + p.name;
    }
  }
  document.getElementById("main").innerHTML = `<div class="fade-in">${renderTopbar(v)}${renderProvinceBanner()}${v.html}</div>`;
  // Animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar-fill[data-w]").forEach(b => {
      const w = b.dataset.w;
      b.style.width = "0%";
      setTimeout(() => { b.style.width = w + "%"; }, 30);
    });
    document.querySelectorAll(".pda-prov-bar-fill[data-w]").forEach(b => {
      const w = b.dataset.w;
      b.style.width = "0%";
      setTimeout(() => { b.style.width = w + "%"; }, 30);
    });
  });
  // Bind pan/zoom/pinch interactions to any newly-rendered SVG maps
  if (typeof setupMapInteractions === "function") setupMapInteractions();
  // Wire scroll-overflow affordance + autoscroll active tab on .pda-tabs
  if (typeof setupScrollableTabs === "function") setupScrollableTabs();
}

function renderProvinceBanner() {
  if (!state.provinceFilter) return '';
  const p = PROVINCES.find(x => x.id === state.provinceFilter);
  if (!p) return '';
  const isPda = PDA_PROVINCES.includes(p.id);
  return `
    <div class="prov-banner ${isPda ? 'pda' : ''}">
      <div class="prov-banner-icon"></div>
      <div class="prov-banner-text">
        <div class="prov-banner-tag">${isPda ? t("prov_banner_pda") : t("prov_banner_default")}</div>
        <div class="prov-banner-name">${p.name}${isPda ? " · " + t("prov_banner_pda_suffix") : ""}</div>
      </div>
      <button class="prov-banner-clear" onclick="setProvinceFilter(null)">${t("prov_banner_clear")}</button>
    </div>
  `;
}

    "Couverture & Impact": "sec_a",
    "Surveillance & Urgences": "sec_b",
    "Pilotage & Engagements": "sec_c",
  };
  const trCrumb = (c) => {
    // Try direct match first
    if (CRUMB_MAP[c]) return t(CRUMB_MAP[c]);
    // Otherwise split off any " · ProvinceName" suffix appended by renderMain
    const idx = c.lastIndexOf(" · ");
    if (idx === -1) return c;
    const base = c.substring(0, idx);
    const tail = c.substring(idx + 3);
    const key = CRUMB_MAP[base];
    const translated = key ? t(key) : base;
    return `${translated} · ${tail}`;
  };

  return `
    <div class="topbar">
      <div class="breadcrumb">
        ${v.crumbs.map((c, i) => {
          const isLast = i === v.crumbs.length - 1;
          return `<span class="${isLast ? 'crumb-current' : ''}">${trCrumb(c)}</span>${!isLast ? '<span class="sep">›</span>' : ''}`;
        }).join("")}
      </div>

      <div class="time-block">
        <span class="time-label">${t("period_label")}</span>

          ${modes.map(m => `
            <button class="pp ${state.periodMode === m.v ? 'on' : ''}" onclick="setPeriodMode('${m.v}')">${m.l}</button>
          `).join("")}
        </div>
        <select class="period-sel" onchange="setPeriodYear(this.value)">
          ${ANNEES.map(a => `<option value="${a}" ${state.periodYear === a ? 'selected' : ''}>${a}</option>`).join("")}
        </select>
        <select class="period-sel" onchange="setPeriodPart(this.value)">
          ${state.periodMode === "quarter"
            ? TRIMESTRES.filter(o => state.periodYear !== DERNIER_MOIS.annee || o.v <= DERNIER_MOIS.trim).map(o => `<option value="${o.v}" ${state.periodQuarter === o.v ? 'selected' : ''}>${o.l}</option>`).join("")
            : MOIS_NOMS.map((l, i) => ({ l, i })).filter(x => state.periodYear !== DERNIER_MOIS.annee || (x.i + 1) <= DERNIER_MOIS.mois).map(x => `<option value="${x.i + 1}" ${state.periodMonth === x.i + 1 ? 'selected' : ''}>${x.l}</option>`).join("")}
        </select>
      </div>

      <div class="tb-actions">
        <button class="tb-btn" onclick="ouvrirSeuils()" title="Définir les seuils vert / jaune / orange / rouge">⚙ Seuils</button>
        <button class="tb-btn" onclick="ouvrirExportPDF()" title="Exporter en PDF · tout ou partie du tableau de bord">⬇ PDF</button>
      </div>
      <div class="scope-block">
        <span class="time-label">${t("view_label")}</span>
        <select class="period-sel scope-sel" onchange="setProvinceFilter(this.value === '' ? null : this.value)">
          ${provinceOptions}
        </select>
      </div>

      <div class="lang-block" title="${t("language_label")}">
        <div class="lang-pills">
          ${langs.map(l => `
            <button class="lang-btn ${state.lang === l.v ? 'on' : ''}" onclick="setLang('${l.v}')" title="${l.full}">${l.l}</button>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}

let _impressionEnCours = false;
function genererPDF() {
  if (_impressionEnCours) return;
  const vues = [...document.querySelectorAll(".export-case:checked")].map(c => c.dataset.vue);
  if (!vues.length) return;
  const paysage = (document.querySelector('input[name="orientation-pdf"]:checked') || {}).value !== "portrait";
  fermerExport();
  _impressionEnCours = true;
  let orientation = document.getElementById("orientation-impression");
  if (!orientation) { orientation = document.createElement("style"); orientation.id = "orientation-impression"; document.head.appendChild(orientation); }
  orientation.textContent = `@page { size: A4 ${paysage ? "landscape" : "portrait"}; margin: 10mm; }`;
  document.body.classList.toggle("impression-paysage", paysage);
  const memoire = { sub: state.sub, minSection: state.minSection, scope: state.scope, pdaDomain: state.pdaDomain };
  let zone = document.getElementById("zone-impression");
  if (!zone) { zone = document.createElement("div"); zone.id = "zone-impression"; document.body.appendChild(zone); }
  const entete = `<div class="entete-imprimee"><span>Centre d'Intelligence des Données · MSPP · République du Tchad</span><span>${periodLabel()}</span></div>`;
  const sections = [];
  const rendreVue = (id) => {
    try { return VIEWS[id]().html; }
    catch (e) {
      console.error("Section non exportee :", id, e);
      return `<div style="padding:24px;color:var(--muted);">Section « ${id} » indisponible à l'export.</div>`;
    }
  };
  vues.forEach(id => {
    if (!VIEWS[id]) return;
    if (id === "min-overview") {
      ["A", "B", "C"].forEach(s => { state.minSection = s; sections.push(rendreVue(id)); });
    } else {
      state.sub = id;
      if (id === "vacc-pda") { state.scope = "pda"; state.pdaDomain = state.pdaDomain || "overview"; }
      sections.push(rendreVue(id));
    }
  });
  state.sub = memoire.sub; state.minSection = memoire.minSection;
  state.scope = memoire.scope; state.pdaDomain = memoire.pdaDomain;
  zone.innerHTML = sections.map(html => `<section class="page-imprimee">${entete}${html}</section>`).join("");
  _impressionEnCours = false;
  ouvrirAtelier(paysage);
}

/* ==============================================================
   ATELIER D'IMPRESSION
   Apercu page par page avant impression : ajustement automatique
   a la page, puis reglages manuels bloc par bloc (masquer,
   elargir, deplacer) et echelle globale.
============================================================== */
function ouvrirAtelier(paysage) {
  const zone = document.getElementById("zone-impression");
  if (!zone || document.querySelector(".atelier-overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "atelier-overlay";
  overlay.innerHTML = `
    <div class="atelier-barre">
      <div class="atelier-titre">Préparation du PDF · ${periodLabel()}</div>
      <div class="atelier-outils">
        <label class="atelier-echelle">Échelle
          <input type="range" min="60" max="110" value="100" oninput="reglerEchelle(this.value)">
          <span id="atelier-echelle-val">100%</span>
        </label>
        <button class="tb-btn" onclick="ajusterAuto()">Ajuster automatiquement</button>
        <button class="tb-btn" onclick="retablirBlocs()">Rétablir les blocs masqués</button>
        <button class="tb-btn" onclick="fermerAtelier()">Fermer</button>
        <button class="tb-btn tb-btn-principal" onclick="atelierImprimer()">Imprimer / Enregistrer en PDF</button>
      </div>
      <div class="atelier-note">Survolez un bloc pour le masquer (✕), l'élargir (⤢) ou le déplacer (◀ ▶). L'ajustement automatique réduit chaque section pour qu'elle tienne sur sa page.</div>
    </div>
    <div class="atelier-defile"></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector(".atelier-defile").appendChild(zone);
  document.body.classList.add("atelier-actif");
  document.body.classList.toggle("impression-paysage", paysage);
  zone.querySelectorAll(".card, .kpi, .kpi-exec").forEach(bloc => {
    if (bloc.parentElement.closest(".card, .kpi, .kpi-exec")) return;
    const outils = document.createElement("div");
    outils.className = "bloc-outils";
    outils.innerHTML = `
      <button title="Déplacer vers l'avant" onclick="deplacerBloc(this, -1)">◀</button>
      <button title="Déplacer vers l'arrière" onclick="deplacerBloc(this, 1)">▶</button>
      <button title="Pleine largeur / largeur normale" onclick="basculerLargeur(this)">⤢</button>
      <button title="Masquer ce bloc" onclick="masquerBloc(this)">✕</button>`;
    bloc.appendChild(outils);
  });
  ajusterAuto();
}
function fermerAtelier() {
  const overlay = document.querySelector(".atelier-overlay");
  const zone = document.getElementById("zone-impression");
  if (zone) {
    zone.querySelectorAll(".bloc-outils").forEach(o => o.remove());
    zone.innerHTML = "";
    document.body.appendChild(zone);
  }
  if (overlay) overlay.remove();
  document.body.classList.remove("atelier-actif", "impression-paysage");
}
function deplacerBloc(btn, sens) {
  const bloc = btn.closest(".card, .kpi, .kpi-exec");
  const voisin = sens < 0 ? bloc.previousElementSibling : bloc.nextElementSibling;
  if (!voisin) return;
  bloc.parentElement.insertBefore(sens < 0 ? bloc : voisin, sens < 0 ? voisin : bloc);
}
function basculerLargeur(btn) {
  btn.closest(".card, .kpi, .kpi-exec").classList.toggle("bloc-large");
}
function masquerBloc(btn) {
  btn.closest(".card, .kpi, .kpi-exec").classList.add("bloc-cache");
}
function retablirBlocs() {
  document.querySelectorAll("#zone-impression .bloc-cache").forEach(b => b.classList.remove("bloc-cache"));
}
function reglerEchelle(v) {
  document.querySelectorAll("#zone-impression .page-imprimee").forEach(p => { p.style.zoom = v / 100; });
  const lbl = document.getElementById("atelier-echelle-val");
  if (lbl) lbl.textContent = v + "%";
}
function ajusterAuto() {
  const paysage = document.body.classList.contains("impression-paysage");
  const hauteurPage = paysage ? 700 : 1030;    /* zone imprimable approximative en pixels */
  document.querySelectorAll("#zone-impression .page-imprimee").forEach(p => {
    p.style.zoom = 1;
    const h = p.scrollHeight;
    if (h > hauteurPage) {
      const echelle = Math.max(0.62, hauteurPage / h);
      /* on ne reduit que si la section tient alors sur sa page ; sinon elle coule sur plusieurs pages proprement */
      if (echelle >= 0.62) p.style.zoom = Math.round(echelle * 100) / 100;
    }
  });
  const lbl = document.getElementById("atelier-echelle-val");
  if (lbl) lbl.textContent = "auto";
}
function atelierImprimer() {
  if (_impressionEnCours) return;
  _impressionEnCours = true;
  const overlay = document.querySelector(".atelier-overlay");
  const zone = document.getElementById("zone-impression");
  document.body.appendChild(zone);                     /* redevient enfant direct pour la regle d'impression */
  if (overlay) overlay.style.display = "none";
  document.body.classList.add("impression-multi");
  const ancienTitre = document.title;
  document.title = `CID_${state.periodValue}`;
  const nettoyer = () => {
    document.body.classList.remove("impression-multi");
    document.title = ancienTitre;
    _impressionEnCours = false;
    window.removeEventListener("afterprint", nettoyer);
    fermerAtelier();
  };
  window.addEventListener("afterprint", nettoyer);
  window.print();
  setTimeout(nettoyer, 3000);
}

/* ==============================================================
   MAP · Size / Zoom / Pan interactive controls
============================================================== */
function currentMapViewBox() {
  if (state.mapZoomProv) {
    const vb = bboxDistricts(state.mapZoomProv);
    if (vb) return vb;
  }
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bx = parts[0], by = parts[1], bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const cx = bx + bw / 2 + state.mapPanX;
  const cy = by + bh / 2 + state.mapPanY;
  return `${(cx - w / 2).toFixed(1)} ${(cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}

function clampMapPan() {
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const maxX = (bw - w) / 2;
  const maxY = (bh - h) / 2;
  state.mapPanX = Math.max(-maxX, Math.min(maxX, state.mapPanX));
  state.mapPanY = Math.max(-maxY, Math.min(maxY, state.mapPanY));
}

function applyMapView() {
  const vb = currentMapViewBox();
  document.querySelectorAll('.map-svg').forEach(svg => svg.setAttribute('viewBox', vb));
  document.querySelectorAll('.map-svg-wrap').forEach(w => w.setAttribute('data-size', state.mapSize));
  document.querySelectorAll('.map-tb-zoom-pct').forEach(z => {
    z.textContent = Math.round(state.mapZoom * 100) + '%';
  });
  document.querySelectorAll('[data-map-size-btn]').forEach(b => {
    b.classList.toggle('on', b.dataset.mapSizeBtn === state.mapSize);
  });
  document.querySelectorAll('[data-map-zoom="out"]').forEach(b => b.disabled = state.mapZoom <= 1.001);
  document.querySelectorAll('[data-map-zoom="in"]').forEach(b => b.disabled = state.mapZoom >= 7.999);
  document.querySelectorAll('[data-map-zoom="reset"]').forEach(b => {
    b.disabled = state.mapZoom === 1 && state.mapPanX === 0 && state.mapPanY === 0;
  });
}

function setMapSize(s) {
  state.mapSize = s;
  applyMapView();
}

function mapZoomIn() {
  state.mapZoom = Math.min(state.mapZoom * 1.4, 8);
  clampMapPan();
  applyMapView();
}

function mapZoomOut() {
  state.mapZoom = Math.max(state.mapZoom / 1.4, 1);
  if (state.mapZoom <= 1.001) {
    state.mapZoom = 1;
    state.mapPanX = 0;
    state.mapPanY = 0;
  }
  clampMapPan();
  applyMapView();
}

function mapZoomReset() {
  state.mapZoom = 1;
  state.mapPanX = 0;
  state.mapPanY = 0;
  applyMapView();
}

function mapZoomTowards(svg, px, py, factor) {
  // px, py ∈ [0,1] within the svg rect
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bx = parts[0], by = parts[1], bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const cx = bx + bw / 2 + state.mapPanX;
  const cy = by + bh / 2 + state.mapPanY;
  const ptX = cx - w / 2 + px * w;
  const ptY = cy - h / 2 + py * h;
  const newZoom = Math.max(1, Math.min(8, state.mapZoom * factor));
  if (newZoom === state.mapZoom) return;
  state.mapZoom = newZoom;
  const newW = bw / state.mapZoom;
  const newH = bh / state.mapZoom;
  const newCx = ptX - (px - 0.5) * newW;
  const newCy = ptY - (py - 0.5) * newH;
  state.mapPanX = newCx - (bx + bw / 2);
  state.mapPanY = newCy - (by + bh / 2);
  clampMapPan();
  applyMapView();
}

function setupScrollableTabs() {
  // Generic horizontal-scroll affordance: posts data-overflow-left/right on the element
  // so CSS can show edge-fade hints, and auto-scrolls active items into view.
  const targets = [
    { selector: '.pda-tabs', activeSel: '.pda-tab.on' },
    { selector: '.card-body table', activeSel: null },
  ];
  targets.forEach(({ selector, activeSel }) => {
    document.querySelectorAll(selector).forEach(el => {
      const update = () => {
        const overR = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
        const overL = el.scrollLeft > 1;
        el.setAttribute('data-overflow-right', overR ? 'true' : 'false');
        el.setAttribute('data-overflow-left',  overL ? 'true' : 'false');
      };
      update();
      if (!el.__scrollBound) {
        el.__scrollBound = true;
        el.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', update, { passive: true });
      }
      // Auto-scroll active item into view (tabs only · tables don't have one)
      if (activeSel) {
        const active = el.querySelector(activeSel);
        if (active) {
          const aRect = active.getBoundingClientRect();
          const eRect = el.getBoundingClientRect();
          if (aRect.left < eRect.left || aRect.right > eRect.right) {
            const target = active.offsetLeft - (el.clientWidth - active.offsetWidth) / 2;
            el.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
          }
        }
      }
      requestAnimationFrame(update);
    });
  });
}

function setupMapInteractions() {
  document.querySelectorAll('.map-svg').forEach(svg => {
    if (svg.__interactiveBound) return;
    svg.__interactiveBound = true;

    const pointers = new Map();   // id → {x,y}
    let lastPinchDist = null;
    let dragStart = null;          // {x,y,panX,panY}
    let moved = false;
    let suppressNextClick = false;

    svg.addEventListener('pointerdown', (e) => {
      // mouse: only left button starts a pan/click; touch & pen always pass
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
      if (pointers.size === 1) {
        dragStart = { x: e.clientX, y: e.clientY, panX: state.mapPanX, panY: state.mapPanY };
        moved = false;
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        dragStart = null; // pinch overrides pan
      }
    });

    svg.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2 && lastPinchDist) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (dist > 0) {
          const factor = dist / lastPinchDist;
          const rect = svg.getBoundingClientRect();
          const mx = (pts[0].x + pts[1].x) / 2;
          const my = (pts[0].y + pts[1].y) / 2;
          mapZoomTowards(svg, (mx - rect.left) / rect.width, (my - rect.top) / rect.height, factor);
          lastPinchDist = dist;
          moved = true;
        }
        return;
      }

      if (pointers.size === 1 && dragStart) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          moved = true;
          svg.classList.add('is-panning');
        }
        if (moved) {
          const rect = svg.getBoundingClientRect();
          const parts = MAP_VIEWBOX.split(' ').map(Number);
          const bw = parts[2], bh = parts[3];
          const scaleX = (bw / state.mapZoom) / rect.width;
          const scaleY = (bh / state.mapZoom) / rect.height;
          state.mapPanX = dragStart.panX - dx * scaleX;
          state.mapPanY = dragStart.panY - dy * scaleY;
          clampMapPan();
          svg.setAttribute('viewBox', currentMapViewBox());
        }
      }
    });

    const endPointer = (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
      if (pointers.size < 2) lastPinchDist = null;
      if (pointers.size === 0) {
        svg.classList.remove('is-panning');
        if (moved) {
          suppressNextClick = true;
          // Update zoom pct + button disabled states once pan ends
          applyMapView();
        }
        dragStart = null;
      }
    };
    svg.addEventListener('pointerup', endPointer);
    svg.addEventListener('pointercancel', endPointer);
    svg.addEventListener('pointerleave', (e) => {
      if (pointers.size === 0) { dragStart = null; svg.classList.remove('is-panning'); }
    });

    // Block click that follows a pan-drag, to keep province selection unambiguous
    svg.addEventListener('click', (e) => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    // Wheel zoom (desktop). passive:false so we can preventDefault and avoid page scroll
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.85 : 1.18;
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      mapZoomTowards(svg, px, py, factor);
    }, { passive: false });
  });
}

// Mini sparkline for executive KPI
function miniSpark(data, color = "#1F3864") {
  data = (data || []).filter(v => Number.isFinite(v));
  if (data.length < 2) return '';
  const w = 140, h = 32;
  const max = Math.max(...data) * 1.08;
  const min = Math.min(...data) * 0.92;
  const range = max - min || 1;
  const xStep = w / (data.length - 1);
  const points = data.map((v, i) => {
    const x = i * xStep;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const linePts = points.join(" ");
  const areaPts = points.join(" ") + ` ${w},${h} 0,${h}`;
  const lastX = (data.length - 1) * xStep;
  const lastY = h - ((data[data.length - 1] - min) / range) * h;
  return `
    <svg class="mini-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="${areaPts}" fill="${color}" opacity="0.08"/>
      <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.8" fill="${color}" stroke="white" stroke-width="1.2"/>
    </svg>
  `;
}

// Executive KPI card
function kpiExec(opts) {
  let { n, label, category, value, unit, target, trend, trendDir, rag, source, sparkData, sparkColor, action } = opts;
  if (value == null || String(value).includes("NaN")) { value = "ND"; trend = "—"; trendDir = "flat"; rag = "na"; }
  return `
    <div class="kpi-exec rag-${rag}">
      <div class="kpe-head">
        <div class="kpe-num">${n}</div>
        <div class="kpe-title">
          <div class="kpe-label">${label}</div>
          <div class="kpe-cat">${category}</div>
        </div>
        <span class="pill ${rag} kpe-status">${ragLabel(rag)}</span>
      </div>
      <div class="kpe-body">
        <div class="kpe-value-block">
          <div class="kpe-value">
            <span class="kpe-num-big">${value}</span>
            <span class="kpe-unit">${unit}</span>
          </div>
          <div class="kpe-meta">
            <span class="kpe-target">${t("target")} : <strong>${/[%a-zA-Zé\u2264\u2265\/]/.test(String(target)) ? target : target + (unit || "")}</strong></span>
            <span class="kpe-trend ${trendDir}">${trend} <span class="kpe-trend-lbl">${t("trend_vs")}</span></span>
          </div>
        </div>
        <div class="kpe-spark-block">
          ${miniSpark(sparkData || [], sparkColor || "#1F3864")}
          <div class="kpe-spark-lbl">${t("twelve_months")}</div>
        </div>
      </div>
      ${action ? `<div class="kpe-action"><span>${action}</span></div>` : ''}
      <div class="kpe-source">${t("source")} : ${source}</div>
    </div>
  `;
}

  const moy = (k) => { const v = palu.map(p => p[k]).filter(x => x != null); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; };

        <div class="grid-2">
          ${card("Complétude du schéma", "De la première à la quatrième dose",
            `<div class="palu-funnel">
              ${[["1re", p1], ["2e", p2], ["3e", p3], ["4e", p4]].map(([lib, v]) => `
                <div class="palu-etage">

};

// ---- Carte choléra : districts touchés colorés par niveau de risque, clignotants sur les foyers actifs ----
// Sparkline de létalité : courbe en aires, seuil d'alerte OMS à 1%
function sparkLetalite(serie, w, hh) {
  w = w || 200; hh = hh || 46;
  const pts = serie.filter(p => p.cfr != null);
  if (pts.length < 2) return "";
  const maxV = Math.max(...pts.map(p => p.cfr), 2);
  const x = (i) => (i / (pts.length - 1)) * (w - 2) + 1;
  const y = (v) => hh - 3 - (v / maxV) * (hh - 8);
  const ligne = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.cfr).toFixed(1)}`).join(" ");
  const aire = `1,${hh - 3} ${ligne} ${(w - 1).toFixed(1)},${hh - 3}`;
  const ySeuil = y(1);
  const dernier = pts[pts.length - 1];
  return `<svg class="spark-let" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" role="img" aria-label="Évolution de la létalité">
    <line class="spark-seuil" x1="1" y1="${ySeuil.toFixed(1)}" x2="${w - 1}" y2="${ySeuil.toFixed(1)}"></line>
    <polygon class="spark-aire" points="${aire}"></polygon>
    <polyline class="spark-ligne" points="${ligne}"></polyline>
    <circle class="spark-pt" cx="${x(pts.length - 1).toFixed(1)}" cy="${y(dernier.cfr).toFixed(1)}" r="2.6"></circle>
  </svg>`;
}
// Pyramide des âges : standard épidémiologique pour la structure démographique des cas
function pyramideAges(pyr) {
  const maxV = Math.max(...pyr.map(p => Math.max(p.H, p.F)));
  const lignes = pyr.slice().reverse().map(p => `
    <div class="pyr-ligne">
      <div class="pyr-cote pyr-g"><div class="pyr-bar pyr-h" style="width:${(p.H / maxV * 100).toFixed(0)}%" title="${p.H} hommes"></div><span class="pyr-n">${p.H}</span></div>
      <div class="pyr-lab">${p.tranche}</div>
      <div class="pyr-cote pyr-d"><div class="pyr-bar pyr-f" style="width:${(p.F / maxV * 100).toFixed(0)}%" title="${p.F} femmes"></div><span class="pyr-n">${p.F}</span></div>
    </div>`).join("");
  return `<div class="pyr-bloc">
    <div class="pyr-entete"><span class="pyr-lg">Masculin</span><span class="pyr-lc">Tranche d'âge</span><span class="pyr-ld">Féminin</span></div>
    ${lignes}
  </div>`;
}

function renderCarteCholera() {

  const parTrace = {};
  CHOL_A.districts.forEach(d => { if (CARTE_DIST[d.nom]) parTrace[CARTE_DIST[d.nom]] = d; });
  const F = CARTE_FOCUS;
  const formes = F.districts.map(d => {
    const info = parTrace[d.nom];
    if (!info) return `<path class="cf-hors" d="${d.d}"><title>${d.nom} · aucun cas notifié</title></path>`;
    const actif = info.actif && info.recents > 0;
    return `<path class="cf-dist niv-${info.niveau}${actif ? " cf-actif" : ""}" d="${d.d}"><title>${d.nom} : ${info.cas} cas notifiés, ${info.deces} décès, létalité ${info.cfr}%${actif ? ", " + info.recents + " cas sur 2 semaines" : ", foyer éteint"}</title></path>`;
  }).join("");
  // Halos d'alerte sur les foyers en transmission active
  const centres = { "Ndjamena-Nord": [470, 452], "Ndjamena-Centre": [487, 470], "Ndjamena-Est": [505, 462], "Karal": [455, 250] };
  const halos = F.districts.filter(d => {
    const i = parTrace[d.nom]; return i && i.actif && i.recents > 0 && centres[d.nom];
  }).map(d => {
    const [cx, cy] = centres[d.nom]; const i = parTrace[d.nom];
    return `<g class="cf-halo"><circle class="cf-onde" cx="${cx}" cy="${cy}" r="16"></circle><circle class="cf-onde cf-onde2" cx="${cx}" cy="${cy}" r="16"></circle><circle class="cf-coeur" cx="${cx}" cy="${cy}" r="5"></circle><text class="cf-etiq" x="${cx + 14}" y="${cy + 4}">${d.nom.replace("Ndjamena-", "N'Dj. ")} · ${i.recents} cas</text></g>`;
  }).join("");
  return `
    <div class="chol-carte-wrap">
      <svg class="chol-carte" viewBox="0 0 ${F.w} ${F.h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Carte de la zone épidémique">

}

// Analyse de l'association entre pluviométrie et incidence
function renderAnalysePluie() {
  if (!PLUIE_A) return "";
  const A = PLUIE_A;
  const nb = (x) => String(x).replace(".", ",");

  // Verdict
  const verdict = `<div class="pl-verdict">
    <div class="pl-verdict-t">Aucune association démontrable en l'état</div>
    <div class="pl-verdict-c">Sur les ${A.n_semaines} semaines où pluviométrie et cas se recouvrent, aucune corrélation n'atteint le seuil de signification. Les deux provinces suivent d'ailleurs des dynamiques opposées, ce qui interdit de les regrouper.</div>
  </div>`;

  // Corrélations par province
  const provRows = A.provinces.map(p => `<tr>
      <td><strong>${p.nom}</strong></td>
      <td class="num">${p.rho >= 0 ? "+" : ""}${nb(p.rho)}</td>
      <td class="num">${nb(p.p.toFixed(3))}</td>
      <td><span class="pill ${p.p < 0.05 ? "green" : "na"}">${p.p < 0.05 ? "significatif" : "non significatif"}</span></td>
    </tr>`).join("");

  // Séries superposées pluie / cas
  const series = A.series.map(s => {
    const maxP = Math.max(...s.pluie, 1), maxC = Math.max(...s.cas, 1);
    const cols = s.sems.map((sem, i) => `
      <div class="pl-col" title="S${sem} : ${nb(s.pluie[i])} mm, ${s.cas[i]} cas">
        <div class="pl-paire">
          <div class="pl-b pl-pluie" style="height:${Math.max(2, s.pluie[i] / maxP * 100)}%"></div>
          <div class="pl-b pl-cas" style="height:${Math.max(2, s.cas[i] / maxC * 100)}%"></div>
        </div>
        <span class="pl-sem">S${sem}</span>
      </div>`).join("");
    return `<div class="pl-serie">
      <div class="pl-serie-t">${s.province}</div>
      <div class="pl-graph">${cols}</div>
    </div>`;
  }).join("");

  // Test de falsification : classement des provinces
  const cl = A.classement;
  const maxMM = Math.max(...cl.map(c => c.mm));
  const barres = cl.map((c, i) => `<div class="pl-rang ${c.touchee ? "pl-touchee" : ""}">
      <span class="pl-rang-n">${i + 1}</span>
      <span class="pl-rang-nom">${c.nom}</span>
      <div class="pl-rang-barre"><div class="pl-rang-fill" style="width:${(c.mm / maxMM * 100).toFixed(0)}%"></div></div>
      <span class="pl-rang-mm">${Math.round(c.mm)}</span>
      ${c.touchee ? '<span class="pl-rang-tag">épidémie</span>' : ""}
    </div>`).join("");

  return `
    ${verdict}
    <div class="pl-cols">
      <div>
        <div class="dd-sous-titre">Corrélation entre cumul hebdomadaire et cas notifiés</div>
        <table class="tbl-s"><tr><th>Province</th><th class="num">Coefficient</th><th class="num">p</th><th>Conclusion</th></tr>${provRows}</table>
        <div class="pl-note">Coefficient de Spearman sur ${A.n_semaines} semaines complètes. Avec un effectif aussi réduit, il faudrait un coefficient d'au moins ${nb(A.r_min_detectable.n7)} pour conclure : aucun ne l'atteint. À N'Djamena, la hausse conjointe s'explique surtout par la progression propre de l'épidémie, les cas suivant le temps avec un coefficient de 0,91.</div>
      </div>
      <div>
        <div class="dd-sous-titre">Pluie et cas, semaine par semaine</div>
        ${series}
        <div class="pl-legende"><span class="pl-lg"><span class="pl-pt pl-pluie"></span>Cumul de pluie</span><span class="pl-lg"><span class="pl-pt pl-cas"></span>Cas notifiés</span></div>
      </div>
    </div>
    <div class="dd-sous-titre" style="margin-top:18px;">Épreuve de falsification : les provinces les plus arrosées sont-elles les plus touchées ?</div>
    <div class="pl-classement">${barres}</div>
    <div class="pl-note">Cumul de juin et juillet 2026 sur les ${cl.length} provinces. Les deux provinces en épidémie occupent les rangs ${A.falsification.rangs.join(" et ")}, au milieu du classement, tandis que les cinq provinces les plus arrosées ne rapportent aucun cas (test de Mann-Whitney, p = ${nb(A.falsification.p)}). La pluviométrie ne distingue donc pas les territoires atteints : d'autres déterminants, accès à l'eau potable, assainissement, densité urbaine, expliquent mieux la localisation des foyers.</div>
  `;
}

// ---- Barre de contrôle temporelle : jour, semaine épidémiologique, mois ----
function cholPeriodeCourante() {
  if (!CHOL_P) return null;
  const typ = state.cholTypePeriode || "semaine";
  const cles = CHOL_P.cles[typ];
  const cle = state.cholPeriode && cles.includes(state.cholPeriode) ? state.cholPeriode : cles[cles.length - 1];

}
function setCholPeriode(cle) { state.cholPeriode = cle; renderMain(); }
function decalerCholPeriode(pas) {
  const p = cholPeriodeCourante(); if (!p) return;
  const i = p.cles.indexOf(p.cle) + pas;
  if (i >= 0 && i < p.cles.length) { state.cholPeriode = p.cles[i]; renderMain(); }
}
function libellePeriode(typ, cle) {
  if (typ === "jour") { const [a, m, j] = cle.split("-"); return `${j}/${m}/${a}`; }
  if (typ === "semaine") { const [a, s] = cle.split("-S"); return `Semaine épidémiologique ${parseInt(s, 10)}, ${a}`; }
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const [a, m] = cle.split("-"); return `${MOIS[parseInt(m, 10) - 1]} ${a}`;
}
function barreControleChol() {

function analyseSituation(p) {
  const P = p.bloc.periode, C = p.bloc.cumul;
  const lib = libellePeriode(p.typ, p.cle).toLowerCase();
  const cfr = C.letalite;
  const tendance = P.cas === 0 ? "Aucun cas notifié sur la période."
    : `${P.cas} cas ${P.cas > 1 ? "ont été notifiés" : "a été notifié"} sur ${lib}, dont ${P.deces} décès.`;
  const dist = C.districts.length ? C.districts.map(d => `${d.nom} (${d.cas} cas, ${d.deces} décès)`).join(", ") : "aucun district";
  const seuil = cfr > 1 ? `Le taux de létalité cumulé s'établit à ${String(cfr).replace(".", ",")}%, au-dessus du seuil acceptable de 1% retenu par les normes internationales.`
    : `Le taux de létalité cumulé, à ${String(cfr).replace(".", ",")}%, demeure sous le seuil de 1%.`;
  const desh = C.desh.moderee + C.desh.severe;
  const partDesh = C.cas ? Math.round(desh / C.cas * 100) : 0;
  return `${tendance} Le cumul atteint ${C.cas} cas et ${C.deces} décès depuis le début de l'épisode, répartis sur ${C.districts.length} districts sanitaires : ${dist}. ${seuil} Près de ${partDesh}% des patients se présentent avec une déshydratation modérée ou sévère, ce qui souligne le besoin d'une détection précoce et d'une prise en charge rapide.`;
}
function analyseRisque(p) {
  const C = p.bloc.cumul;
  const parCfr = C.districts.filter(d => d.cas >= 5).map(d => ({ ...d, cfr: d.cas ? d.deces / d.cas * 100 : 0 })).sort((a, b) => b.cfr - a.cfr);
  const pire = parCfr[0];
  const villages = C.villages;
  return `Le suivi porte sur ${villages} villages ou quartiers ayant notifié au moins un cas. ${pire ? `Le district de ${pire.nom} enregistre la létalité la plus élevée parmi les districts à effectif suffisant, à ${pire.cfr.toFixed(1).replace(".", ",")}%, ce qui appelle une revue des délais de prise en charge et de la disponibilité des solutés.` : ""} La structure démographique des cas, avec un âge médian de ${C.age_median} ans et un sexe ratio femmes sur hommes de ${String(C.ratio_fh).replace(".", ",")}, oriente la communication vers les ménages et les établissements scolaires.`;
}

  La sévérité de la déshydratation à l'admission commande la létalité, selon un gradient marqué : ${A.tests[0].groupes.map(g => `${g.niveau.toLowerCase()} ${nb(g.cfr)}%`).join(", ")}. Le caractère gradué de cette relation renforce l'hypothèse d'un lien direct avec le délai de recours aux soins.

        <div class="dd-txt"><strong>L'épidémie a changé de territoire.</strong> Le foyer de Karal, qui portait ${eteints.length ? eteints[0].cas : ""} cas, est éteint depuis la semaine ${eteints.length ? eteints[0].der : ""}. La transmission se poursuit désormais à N'Djamena, où ${actifs.reduce((s, d) => s + d.recents, 0)} cas sont survenus sur les deux dernières semaines.</div>
      </div>
      <div class="dd-constat dd-c2">
        <div class="dd-num">02</div>
        <div class="dd-txt"><strong>La surmortalité de N'Djamena ne s'explique pas par la gravité des cas.</strong> Hadjer Lamis reçoit une part de cas sévères plus forte (${A.mix[0].severe}% contre ${A.mix[1].severe}%) et enregistre pourtant moins de décès. À gravité égale, le risque de décès reste ${A.modele[2].OR} fois plus élevé à N'Djamena (${pFmt(A.modele[2].p)}).</div>
      </div>
      <div class="dd-constat dd-c3">
        <div class="dd-num">03</div>
        <div class="dd-txt"><strong>Deux signes cliniques concentrent le risque.</strong> La déshydratation sévère multiplie par ${A.modele[0].OR} le risque de décès et la fièvre par ${A.modele[1].OR}. Ces deux critères, relevés à l'admission, identifient les patients à surveiller en priorité.</div>
      </div>
    </div>`;

  // --- Courbes par district (migration) ---
  const maxC = Math.max(...A.districts.map(d => Math.max(...d.courbe)));
  const courbesHtml = A.districts.filter(d => d.cas > 1).map(d => {
    const barres = d.courbe.map((v, i) => {
      const h = maxC ? Math.round(v / maxC * 100) : 0;
      return `<div class="mig-col" title="S${M.sems[i]} : ${v} cas"><div class="mig-bar niv-${d.niveau}" style="height:${h}%"></div></div>`;
    }).join("");
    return `<div class="mig-ligne">
      <div class="mig-nom">${nomPr(d.nom)}<span class="mig-etat ${d.actif ? 'actif' : 'eteint'}">${d.actif ? 'transmission active' : 'éteint'}</span></div>
      <div class="mig-graph">${barres}</div>
      <div class="mig-tot">${d.cas}</div>
    </div>`;
  }).join("");
  const axeSem = M.sems.map(s => `<span>S${s}</span>`).join("");

  // --- Tests statistiques ---
  const grad = A.tests[0];
  const gradRows = grad.groupes.map(g => {
    const r = g.cfr >= 10 ? "red" : g.cfr >= 3 ? "orange" : "green";
    return `<tr><td>${g.niveau}</td><td class="num">${g.n}</td><td class="num">${g.deces}</td><td class="num"><span class="pill ${r}">${String(g.cfr).replace(".", ",")}%</span></td></tr>`;
  }).join("");
  const autresTests = A.tests.filter(t => t.type === "binaire").map(t => {
    const fort = t.p < 0.05;
    return `<tr class="${fort ? '' : 'test-ns'}">
      <td><strong>${t.nom}</strong></td>
      <td class="num">${String(t.cfr1).replace(".", ",")}%<span class="tst-n">n=${t.n1}</span></td>
      <td class="num">${String(t.cfr0).replace(".", ",")}%<span class="tst-n">n=${t.n0}</span></td>
      <td class="num">${t.OR >= 1 ? String(t.OR).replace(".", ",") : "1/" + (1 / t.OR).toFixed(1).replace(".", ",")}</td>
      <td class="num">${pFmt(t.p)} <span class="tst-sig">${sig(t.p)}</span></td>
    </tr>`;
  }).join("");

  // --- Stratification ---
  const stratRows = A.strat.map(s => `<tr>
      <td>${s.niveau}</td>
      <td class="num">${s.hl.cfr == null ? "—" : s.hl.deces + "/" + s.hl.n + " (" + String(s.hl.cfr).replace(".", ",") + "%)"}</td>
      <td class="num">${s.nd.cfr == null ? "—" : s.nd.deces + "/" + s.nd.n + " (" + String(s.nd.cfr).replace(".", ",") + "%)"}</td>
    </tr>`).join("");

  // --- Modèle ---
  const modRows = A.modele.map(m => `<tr>
      <td>${m.var}</td>
      <td class="num"><strong>${String(m.OR).replace(".", ",")}</strong></td>
      <td class="num">${String(m.ic[0]).replace(".", ",")} – ${String(m.ic[1]).replace(".", ",")}</td>
      <td class="num">${pFmt(m.p)} <span class="tst-sig">${sig(m.p)}</span></td>
    </tr>`).join("");

  // --- Localités à risque ---
  const locRows = A.localites.slice(0, 8).map(l => `<tr>
      <td><strong>${l.nom}</strong><span class="loc-dist">${nomPr(l.dist)}</span></td>
      <td class="num">${l.cas}</td>
      <td class="num">${l.recents || "—"}</td>
      <td class="num">${String(l.cfr_lisse).replace(".", ",")}%</td>
      <td><span class="chol-badge niv-${l.niveau}">${l.score}</span></td>
    </tr>`).join("");

  // --- Profil ---
  const maxP = Math.max(...A.profil.map(p => p.cas));
  const profilHtml = A.profil.map(p => `<div class="demo-row"><span class="demo-lab">${p.tranche}</span><div class="demo-barre"><div class="demo-fill" style="width:${Math.round(p.cas / maxP * 100)}%"></div></div><span class="demo-val">${p.cas}</span></div>`).join("");
  const symptHtml = A.symptomes.map(s => `<div class="demo-row"><span class="demo-lab">${s.nom}</span><div class="demo-barre"><div class="demo-fill sympt-fill" style="width:${s.pct}%"></div></div><span class="demo-val">${String(s.pct).replace(".", ",")}%</span></div>`).join("");

  return {
    crumbs: ["Surveillance · Choléra", "Analyse approfondie"],
    html: `
      <div class="ph ph-exec">
        <div class="ph-tag">◆ Analyse épidémiologique · aide à la décision</div>
        <div class="ph-title">Ce que les données disent de la riposte</div>
        <div class="ph-sub">${M.n} cas analysés, ${M.deces} décès, ${M.localites} localités. ${M.zone}, semaines ${M.sems[0]} à ${M.sem_max}. Analyse sur liste linéaire individuelle.</div>
      </div>
      ${constats}

      <div class="grid-2">
        ${card("Où se joue la riposte aujourd'hui", "Districts touchés, colorés par niveau de risque", renderCarteCholera(),
          "Les zones clignotantes signalent une transmission active sur les deux dernières semaines. Score composite : activité récente, excès de létalité, part de cas sévères, volume.")}
        ${card("Déplacement du foyer épidémique", "Cas par semaine et par district",
          `<div class="mig-bloc">${courbesHtml}<div class="mig-axe">${axeSem}</div></div>`,
          "Le foyer initial de Karal s'est éteint après la semaine 30. Un second foyer, indépendant, s'est ouvert à N'Djamena à partir de la semaine 28.")}
      </div>

      <div class="grid-2">
        ${card("La déshydratation commande la létalité", "Gradient dose-réponse",
          `<table class="tbl-s"><tr><th>Degré de déshydratation</th><th class="num">Cas</th><th class="num">Décès</th><th class="num">Taux de létalité</th></tr>${gradRows}</table>
           <div class="dd-test-note">Test de tendance : ${grad.detail.replace("r=", "coefficient r = ").replace("p=", ", ").replace(".", ",")}. La relation est graduée, ce qui renforce l'hypothèse d'un lien causal plutôt que fortuit.</div>`, "")}
        ${card("Facteurs testés sur le risque de décès", "Comparaison des létalités et rapport de cotes",
          `<table class="tbl-s"><tr><th>Facteur</th><th class="num">Présent</th><th class="num">Absent</th><th class="num">OR</th><th class="num">Signification</th></tr>${autresTests}</table>
           <div class="dd-test-note">Tests exacts de Fisher. Les lignes grisées ne montrent pas d'association décelable. L'astérisque marque le seuil de signification, sans préjuger de l'ampleur clinique.</div>`, "")}
      </div>

      <div class="grid-2">
        ${card("La gravité des cas n'explique pas l'écart entre territoires", "Létalité stratifiée sur la sévérité",
          `<table class="tbl-s"><tr><th>Déshydratation</th><th class="num">Hadjer Lamis</th><th class="num">N'Djamena</th></tr>${stratRows}</table>
           <div class="dd-encart">
             <div class="dd-encart-t">Lecture décisionnelle</div>
             Dans chaque strate de gravité, la létalité est plus forte à N'Djamena. Trois décès y sont survenus parmi des cas seulement modérément déshydratés, situation évitable par une réhydratation conduite à temps. L'écart oriente vers la qualité de la prise en charge plutôt que vers le profil des malades.
           </div>`, "")}
        ${card("Modèle multivarié du risque de décès", "Régression logistique, " + M.n_analyse + " cas et " + M.deces + " décès",
          `<table class="tbl-s"><tr><th>Variable</th><th class="num">OR ajusté</th><th class="num">IC 95%</th><th class="num">p</th></tr>${modRows}</table>
           <div class="dd-test-note">Capacité de discrimination validée hors échantillon : aire sous la courbe ROC = ${String(A.auc).replace(".", ",")} (IC 95% ${String(A.auc_ic[0]).replace(".", ",")} – ${String(A.auc_ic[1]).replace(".", ",")}), validation croisée en cinq blocs. Avec ${M.deces} décès, le modèle reste limité à trois variables et ses intervalles sont larges : il hiérarchise les facteurs, il ne prédit pas un destin individuel.</div>`, "")}
      </div>

      <div class="grid-2">
        ${card("Localités à surveiller en priorité", "Score composite de risque, 2 dernières semaines",
          `<table class="tbl-s"><tr><th>Localité</th><th class="num">Cas notifiés</th><th class="num">2 dern. sem.</th><th class="num">Létalité lissée</th><th>Score</th></tr>${locRows}</table>
           <div class="dd-test-note">La létalité est lissée par une pondération bayésienne pour éviter qu'une localité à un seul cas et un décès n'affiche 100%. Le score combine activité récente, excès de létalité, sévérité et volume.</div>`, "")}
        ${card("Profil des malades", "Répartition par âge et fréquence des signes",
          `<div class="dd-sous-titre">Âge des cas</div><div class="demo-liste">${profilHtml}</div>
           <div class="dd-sous-titre" style="margin-top:16px;">Signes cliniques relevés</div><div class="demo-liste">${symptHtml}</div>`,
          "Les moins de quinze ans forment la majorité des cas, ce qui oriente la communication et la prise en charge vers les familles et les écoles.")}
      </div>

      ${card("Pluviométrie et incidence : l'association testée", "Analyse sur données satellitaires ERA5, " + (PLUIE_A ? PLUIE_A.periode : ""),
        renderAnalysePluie(), "Source : réanalyse ERA5, cumuls journaliers agrégés par semaine épidémiologique. Une association temporelle ne démontrerait pas la causalité, et son absence ici ne l'exclut pas non plus : elle indique que les données disponibles ne permettent pas de trancher.")}

      ${card("Portée et limites de cette analyse", "Ce que les données permettent d'affirmer, et ce qu'elles ne permettent pas",
        `<div class="dd-limites">
          <div class="dd-lim">
            <div class="dd-lim-t">Ce qui est établi</div>
            La sévérité de la déshydratation et la fièvre à l'admission sont associées au décès, avec une relation graduée pour la première. L'écart de létalité entre N'Djamena et Hadjer Lamis persiste après ajustement sur ces deux facteurs. Le foyer de Karal est éteint, celui de N'Djamena reste actif.
          </div>
          <div class="dd-lim">
            <div class="dd-lim-t">Ce qui ne peut pas être conclu</div>
            La base recense uniquement des malades, sans groupe de comparaison issu de la population. Elle ne permet donc pas d'identifier les facteurs de risque d'attraper la maladie, notamment le rôle des sources d'eau ou l'effet protecteur du vaccin. Ces questions demanderaient une enquête cas-témoins.
          </div>
          <div class="dd-lim">
            <div class="dd-lim-t">Précautions de lecture</div>
            Avec ${M.deces} décès, les intervalles de confiance sont larges et les associations mesurées sur de petits effectifs restent fragiles. Le statut vaccinal n'est renseigné que pour une minorité de cas, la source d'eau pour un tiers, ce qui interdit toute conclusion sur ces variables.
          </div>
        </div>`, "")}
    `
  };
};

  }

  const ab = PEV.national.abandon.specifique, comp = PEV.national.qualite.completude, prom = PEV.national.qualite.promptitude;

  }
  const mCouv = (a) => modeMensuel ? (PEVP.national.couv[a] || {})[per3] ?? null : null;
  if (PEVP && state.periodMode === "quarter" && state.periodYear === 2026 && state.periodQuarter <= 2) {

      const sd = mois.reduce((t, m) => t + (D[m] || 0), 0);
      return Math.round(sd / (cibleMens * 3) * 1000) / 10;
    };
  } else { window.__qCouv = null; }

  const deltaTxt = (a) => (a && a.v2025 != null) ? ((a.v2026 - a.v2025 >= 0 ? "+" : "") + Math.round((a.v2026 - a.v2025) * 10) / 10 + " pts") : "";
  const deltaDir = (a) => (a && a.v2025 != null) ? (a.v2026 - a.v2025 > 0.2 ? "up" : a.v2026 - a.v2025 < -0.2 ? "down" : "flat") : "flat";

    const d = c.v2025 != null ? Math.round((c.v2026 - c.v2025) * 10) / 10 : null;

  return {
    crumbs: ["Vaccination · PEV", "Vue d'ensemble"],
    html: `
      <div class="ph">
        <div class="ph-tag">Programme Élargi de Vaccination · DLMVSE</div>
        <div class="ph-title">Vaccination · Vue d'ensemble</div>
        <div class="ph-sub">Couvertures des quinze antigènes de routine sur le relevé mensuel. ${PEV.meta.periode}.</div>
      </div>
      <div class="content">
        <div class="kpi-grid">
          ${kpi("Penta 3" + (modeMensuel ? (state.periodMode==="quarter" ? " · T"+state.periodQuarter+" (somme des doses)" : " · " + MOIS_NOMS[state.periodMonth-1]) : ""), modeMensuel ? mCouvQ("Penta3") : (p3 ? p3.v2026 : null), "%", modeMensuel ? "Cible 90% · doses du mois / cible mensuelle" : "Cible 90% · calendrier complet", modeMensuel ? "" : deltaTxt(p3), modeMensuel ? "flat" : deltaDir(p3), rag90(modeMensuel ? mCouvQ("Penta3") : (p3 ? p3.v2026 : null)))}
          ${kpi("Rougeole (VAR1)" + (modeMensuel ? (state.periodMode==="quarter" ? " · T"+state.periodQuarter+" (somme des doses)" : " · " + MOIS_NOMS[state.periodMonth-1]) : ""), modeMensuel ? mCouvQ("VAR1") : (var1 ? var1.v2026 : null), "%", "Cible 90%", modeMensuel ? "" : deltaTxt(var1), modeMensuel ? "flat" : deltaDir(var1), rag90(modeMensuel ? mCouvQ("VAR1") : (var1 ? var1.v2026 : null)))}
          ${kpi("Rotavirus (Rota3)", rota3 ? rota3.v2026 : null, "%", "Antigène récent, en montée", deltaTxt(rota3), deltaDir(rota3), rag90(rota3 ? rota3.v2026 : null))}
          ${kpi("Abandon Penta1-3", ab ? ab.v2026 : null, "%", "Seuil ≤ 10%", deltaTxt(ab), deltaDir(ab) === "up" ? "down" : "up", ab && ab.v2026 <= 10 ? "green" : "red", true)}
        </div>
        <div class="kpi-grid">

          ${kpi("Provinces sous la cible", scP3.prov, "", "sur " + scP3.provTot + " · Penta3", "", "flat", scP3.prov === 0 ? "green" : scP3.prov <= 4 ? "yellow" : "red", true)}
          ${kpi("Districts sous la cible", scP3.dist, "", "sur " + scP3.distTot + " · Penta3", "", "flat", "orange", true)}

            "Source : RIM PEV. Plusieurs couvertures administratives dépassent 100%, signe de cibles démographiques à réviser ; lecture en repérage d'écarts.")}
          ${card("Où le calendrier complet décroche", scP3.prov + " provinces sous la cible sur Penta3",

             <div class="mini-liens"><button class="lien-btn" onclick="selectSub('vacc','vacc-couv')">Voir la carte par antigène →</button>
             <button class="lien-btn" onclick="selectSub('sao','sao-league')">Classement immunisation →</button></div>`,
            "")}
        </div>
      </div>
    `
  };
};

    let score;

      score = genValue("pda-" + d.id, focusedProv);
    } else {
      let sum = 0;
      PDA_PROVINCES.forEach(pId => { sum += genValue("pda-" + d.id, pId); });
      score = Math.round(sum / PDA_PROVINCES.length);
    }
    return { ...d, score };

function renderPdaDomain(domId) {
  const dom = PDA_DOMAINS.find(d => d.id === domId);
  const indicators = PDA_IND[domId] || [];
  const focusedProv = state.provinceFilter && PDA_PROVINCES.includes(state.provinceFilter) ? state.provinceFilter : null;

  // Generate value per indicator × province (always PDA_PROVINCES only)
  const valByProvince = {};
  PDA_PROVINCES.forEach(pId => {
    valByProvince[pId] = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, pId)
    }));
  });

  // PDA-only aggregation: 1 focused province or 3 PDA provinces (never 23 extrapolation)
  let indAverages;
  if (focusedProv) {
    indAverages = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, focusedProv)
    }));
  } else {
    indAverages = indicators.map(ind => {
      let sum = 0;
      PDA_PROVINCES.forEach(pId => { sum += genValue("pda-" + ind.id, pId); });
      return { ...ind, val: Math.round(sum / PDA_PROVINCES.length) };
    });
  }

  const domAvg = Math.round(indAverages.reduce((a,i) => a+i.val, 0) / indAverages.length);

  const meetTarget = indAverages.filter(i => i.obj ? (i.dir === "gte" ? i.val >= i.obj : i.val <= i.obj) : false).length;
  const meetRatio = meetTarget / indicators.length;
  const meetRag = meetRatio >= 0.7 ? "green" : meetRatio >= 0.5 ? "yellow" : meetRatio >= 0.3 ? "orange" : "red";

  const scopeLabel = focusedProv
    ? `Focus ${PROVINCES.find(p => p.id === focusedProv).name}`
    : `Moyenne 16 provinces pilotes PDA`;

  return `
    <div class="kpi-grid">
      ${kpi(`Score ${domId}${focusedProv ? ' · ' + PROVINCES.find(p=>p.id===focusedProv).short : ''}`, domAvg, "%", "Cible : 80%", "", "flat", rag(domAvg, 80))}
      ${kpi("Indicateurs suivis", String(indicators.length), "", "Tous mis à jour", "", "flat", "green")}
      ${kpi("Provinces couvertes", focusedProv ? "1" : "16", "/16 PDA", "Pilote · Vague 1", "", "flat", "yellow")}
      ${kpi("Indicateurs ≥ cible", String(meetTarget) + "/" + indicators.length, "", "Performance T1", "", "flat", meetRag)}
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div class="card-hdr">
        <div>
          <div class="card-title">${dom.icon} Domaine ${dom.code} · ${dom.label}</div>
          <div class="card-sub">Performance par indicateur · ${scopeLabel}</div>
        </div>
      </div>
      <div class="card-body">
        ${renderBars(indAverages.map(ind => ({
          label: ind.l.substring(0,30),
          val: ind.val,
          target: ind.obj,
          rag: ind.obj ? rag(ind.val, ind.obj, ind.dir === "lte") : "yellow",
          showVal: ind.val + "%",
          max: 100
        })))}
      </div>
      <div class="card-foot">Cible : variable selon indicateur · Source : DHIS2 / Rapports DSP / SIGL · 16 provinces PDA uniquement</div>
    </div>

    <div class="g-2-1">
      ${card(`Comparaison 16 provinces PDA · ${domId}`, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} mise en évidence` : "Score domaine par province", `
        <table class="dt">
          <thead><tr><th>Indicateur</th>${PDA_PROVINCES.map(p => {
            const isFocus = focusedProv === p;
            return `<th style="text-align:right;${isFocus?'background:var(--gold-tint);color:var(--gold-d);':''}">${p}${isFocus?' (focus)':''}</th>`;
          }).join("")}<th style="text-align:right">Moy.</th></tr></thead>
          <tbody>
            ${indicators.map(ind => {
              const vals = PDA_PROVINCES.map(pId => valByProvince[pId].find(i => i.id === ind.id).val);
              const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
              return `<tr>
                <td class="l">${ind.l}</td>
                ${vals.map((v, idx) => {
                  const pId = PDA_PROVINCES[idx];
                  const isFocus = focusedProv === pId;
                  const r = ind.obj ? rag(v, ind.obj, ind.dir === "lte") : "yellow";
                  return `<td class="num" style="${isFocus?'background:var(--gold-tint);':''}"><span class="pill ${r}" style="min-width:42px;text-align:center;">${v == null ? "ND" : v + "%"}</span></td>`;
                }).join("")}
                <td class="num"><strong>${Number.isFinite(avg) ? avg + "%" : "ND"}</strong></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `, "")}

      ${card("Cartographie " + domId, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} sélectionnée` : "16 provinces pilotes PDA", renderMap("pda-" + domId, { pdaFocus: true }), "")}
    </div>

    ${aiBox(
      `Analyse du domaine ${domId} · ${dom.label}`,
      domainNarrative(domId, domAvg, indAverages),
      "Source : DHIS2 + DSP · Triangulation J+5 · 16 provinces PDA · Période : " + periodLabel()
    )}
  `;
}

function domainNarrative(domId, avg, inds) {
  const narratives = {
    D1: `La <strong>gouvernance financière du PDA</strong> atteint ${avg}% sur la période. Les revues semestrielles et trimestrielles sont en bonne voie, mais les <strong>pièces justificatives validées</strong> restent un goulet d'étranglement (impact sur tranches T2). Recommandation : <strong>renforcer la cellule de gestion financière au niveau DLMVSE</strong>.`,
    D2: `Les <strong>offres de services PEV</strong> progressent (${avg}%). La <strong>couverture Penta 3</strong> reste sous-optimale en zone sahélienne. Les <strong>stratégies avancées mobiles</strong> ont prouvé leur efficacité. Recommandation : <strong>passer de 16 à 32 équipes mobiles dès T2</strong> sur les 16 provinces.`,
    D3: `La <strong>surveillance épidémiologique</strong> est globalement fonctionnelle (${avg}%). Le suivi PFA reste perfectible. <strong>Notification méningite à temps</strong> à risque sur Tibesti. Action : <strong>renforcer le COUSP provincial</strong>.`,
    D4: `Les <strong>causeries éducatives</strong> sont sous-réalisées (${avg}%). Le levier communautaire reste le maillon faible. Recommandation : <strong>intégrer la communication PEV dans le plan annuel des ASC</strong>.`,
    D5: `La <strong>chaîne du froid et la logistique</strong> reste un point d'attention majeur (${avg}%). Ruptures d'antigènes persistantes au Lac. <strong>43% des pannes liées aux équipements à gaz</strong>. Recommandation : <strong>accélérer la transition solaire</strong> (PRSS-II / Banque Mondiale).`,
    D6: `La <strong>gestion des données</strong> est correcte (${avg}%). La complétude DHIS2 dépasse 90%. Le <strong>DQS et LQAS</strong> doivent être systématisés au niveau district. Recommandation : <strong>programmer 1 DQS semestriel par district PDA</strong>.`,
    D7: `Le <strong>renforcement des capacités</strong> atteint ${avg}%. Les agents formés DHIS2 et vaccination sont en progrès. Recommandation : <strong>maintenir le rythme de supervisions formatives</strong> et intégrer les ASC dans le cursus.`,
  };
  return narratives[domId] || `Score moyen du domaine : ${avg}%. Analyse détaillée à venir.`;
}
