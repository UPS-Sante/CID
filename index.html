        <div class="ph-sub">Aucun relevé mensuel pour ${periodLabel()}. Série DSR disponible de ${moisFr(mmin)} à ${moisFr(mmax)}.</div>
      </div>
      <div class="content">
        <div class="kpi-grid">
          ${carte("Couverture CPN 1", "Cible : 95%")}${carte("Accouchements assistés", "Cible : 70%")}${carte("Utilisation du partogramme", "Qualité intrapartum")}${carte("GATPA", "Prévention HPP")}
        </div>
        ${card("Période hors couverture des données", periodLabel() + " · relevé non disponible",
          `<div style="padding:4px 2px;line-height:1.7;color:var(--body);">La série mensuelle DSR provient du dépôt Drive (export DHIS2 national), couverte de ${moisFr(mmin)} à ${moisFr(mmax)}. Aucune valeur n'est reconduite : les périodes sans relevé restent en ND.</div>`,
          "Source : " + DSRN.meta.source)}
      </div>` };
  }
  const prev = (() => { const [a, mo] = per.split("-").map(Number); return mo > 1 ? `${a}-${String(mo - 1).padStart(2, "0")}` : `${a - 1}-12`; })();
  const n1 = String(Number(per.slice(0, 4)) - 1) + per.slice(4);
  const delta = (k) => {
    const v = lit(k, per), w = lit(k, prev);
    if (v == null || w == null) return ["", "flat"];
    const d = Math.round((v - w) * 10) / 10;
    return [(d > 0 ? "+" : "") + d + " pts vs " + moisFr(prev).split(" ")[0], d > 0.5 ? "up" : d < -0.5 ? "down" : "flat"];
  };
  const K = (titre, k, cible, inverse) => {
    const v = lit(k, per);
    const [dTxt, dDir] = delta(k);
    const r = v == null ? "na" : inverse ? (v <= cible ? "green" : v <= cible * 1.5 ? "yellow" : "red")
      : (v >= cible ? "green" : v >= cible * 0.85 ? "yellow" : v >= cible * 0.6 ? "orange" : "red");
    return kpi(titre, v == null ? null : Math.round(v * 10) / 10, v == null ? "" : "%", "Cible : " + cible + "%", dTxt, dDir, r);
  };
  const serieDe = (k) => {
    const s = DSRN.indicateurs[k].serie;
    return Object.keys(s).filter(p => p >= mmin && p <= mmax).sort().map(p => ({ p, v: s[p] }));
  };
  const lignes = (ks) => ks.map(([k, lab, cible]) => {
    const v = lit(k, per), vN1 = lit(k, n1);
    const evo = (v != null && vN1 != null) ? (Math.round((v - vN1) * 10) / 10) : null;
    return `<tr><td class="l">${lab}</td>
      <td class="num">${v == null ? "ND" : (Math.round(v * 10) / 10) + (DSRN.indicateurs[k].unite === "%" ? "%" : "")}</td>
      <td class="num">${vN1 == null ? "ND" : Math.round(vN1 * 10) / 10}</td>
      <td class="num">${evo == null ? "—" : (evo > 0 ? "+" : "") + evo + " pts"}</td>
      <td>${v == null ? '<span class="pill na">ND</span>' : v >= cible ? '<span class="pill green">atteint</span>' : '<span class="pill orange">sous cible</span>'}</td></tr>`;
  }).join("");
  const barres = serieDe("cpn1").map(x => ({ label: MOIS_NOMS[Number(x.p.slice(5)) - 1].slice(0, 4), val: x.v == null ? null : Math.round(x.v), target: 95, rag: x.v == null ? "na" : x.v >= 95 ? "green" : x.v >= 80 ? "yellow" : "orange" }));
  const anomaliesPer = (DSRN.anomalies || []).filter(a => a.periode === per);
  const noteAnom = anomaliesPer.length ? card("Signalements qualité · " + periodLabel(),
      anomaliesPer.length + " valeur(s) hors plage attendue, affichée(s) sans correction",
      `<div style="padding:4px 2px;line-height:1.7;color:var(--body);">` + anomaliesPer.map(a =>
        `<div>· <strong>${DSRN.indicateurs[a.indicateur].libelle}</strong> : ${a.valeur}${DSRN.indicateurs[a.indicateur].unite === "%" ? "%" : ""} · ${a.type === "superieur_100" ? "valeur supérieure à 100%, dénominateur à vérifier avec la DSR" : "incohérence de cascade CPN1→CPN4, définition d'indicateur à vérifier"}</div>`).join("") + `</div>`,
      "Mode strict : les anomalies sont signalées à la source, jamais masquées ni corrigées.") : "";
  return { crumbs, html: enTete + `
      <div class="ph-sub">Relevé mensuel national · ${periodLabel()} · série non cumulée, ${moisFr(mmin)} à ${moisFr(mmax)}.</div>
    </div>
    <div class="content">
      <div class="kpi-grid">
        ${K("Couverture CPN 1", "cpn1", 95)}
        ${K("Accouchements assistés", "acc_qualifie", 70)}
        ${K("Utilisation du partogramme", "partogramme", 80)}
        ${K("GATPA", "gatpa", 90)}
      </div>
      <div class="kpi-grid">
        ${K("CPoN (2e contact)", "cpon", 60)}
        ${K("Prévalence contraceptive", "prev_contra", 30)}
        ${K("Césarienne", "cesarienne", 5)}
        ${K("Faible poids de naissance", "faible_poids", 10, true)}
      </div>
      <div class="g-2-1">
        ${card("CPN 1 · évolution mensuelle 2026", "Relevé mensuel national, non cumulé · cible 95%", renderBars(barres), "Source : " + DSRN.meta.source)}
        ${card("Indicateurs traceurs · " + periodLabel(), "Comparaison au même mois de 2025", `
          <table class="dt"><thead><tr><th>Indicateur</th><th style="text-align:right">${per.slice(0, 4)}</th><th style="text-align:right">${n1.slice(0, 4)}</th><th style="text-align:right">Évolution</th><th>Écart cible</th></tr></thead><tbody>
          ${lignes([["cpn1", "CPN 1", 95], ["acc_qualifie", "Accouchements assistés", 70], ["partogramme", "Partogramme", 80], ["gatpa", "GATPA", 90], ["cpon", "CPoN 2e contact", 60], ["prev_contra", "Prévalence contraceptive", 30]])}
          </tbody></table>`, n1 < "2025-01" || n1 > "2025-06" ? "Comparaison N-1 disponible de janvier à juin 2025 uniquement." : "")}
      </div>
      ${noteAnom}
    </div>` };
};

function carteDomaine(dom, crumbs, tag, titre) {
  const et=`<div class="ph"><div class="ph-tag">${tag}</div><div class="ph-title">${titre}</div>`;
  if(!PROGM||!PROGM.domaines[dom]) return {crumbs,html:et+`<div class="ph-sub">Données en cours de chargement.</div></div>`};
  const D=PROGM.domaines[dom];
  const selKey="__ind_"+dom;
  if(!window[selKey]||!D.indicateurs.includes(window[selKey])) window[selKey]=D.indicateurs[0];
  const ind=window[selKey];
  const per=`${state.periodYear}-${String(state.periodMonth).padStart(2,"0")}`;
  const mf=(p)=>{const[a,mo]=p.split("-").map(Number);return MOIS_NOMS[mo-1]+" "+a;};
  const hors=state.periodMode!=="month"||per<D.mois_min||per>D.mois_max;
  const val=(c)=>hors?null:((D.provinces[c]||{})[ind]?.[per]??null);
  const fcfa=D.unite==="fcfa";
  const maxV=fcfa?Math.max(1,...Object.values(D.provinces).map(p=>Math.abs(p[ind]?.[per]??0))):100;
  const col=(v)=>v==null?"#CBC7BE":fcfa?(v<0?"#B3372F":"#1F3864"):v>=90?"#2E7D32":v>=80?"#C9A227":v>=60?"#D97B29":"#B3372F";
  const selI=D.indicateurs.map(a=>`<button onclick="window['${selKey}']='${a.replace(/'/g,"\\'")}';renderMain()" style="padding:5px 11px;border-radius:16px;border:1px solid var(--line);cursor:pointer;background:${a===ind?'#1F3864':'#fff'};color:${a===ind?'#fff':'var(--body)'};font:600 12px/1 inherit;">${a}</button>`).join(" ");
  const paths=Object.keys(PROVINCE_PATHS).map(c=>{const v=val(c);const nm=(PROVINCES.find(p=>p.id===c)||{}).name||c;
    return `<path d="${PROVINCE_PATHS[c].d}" fill="${col(v)}" stroke="#F1EFEA" stroke-width="1.4" style="cursor:pointer" onclick="window.__provSel='${c}';renderMain()"><title>${nm} · ${v==null?"ND":fcfa?v.toLocaleString("fr-FR")+" FCFA":v+"%"}</title></path>`;}).join("");
  let pan="";
  const sel=window.__provSel;
  if(sel){
    const nm=(PROVINCES.find(p=>p.id===sel)||{}).name||sel;
    const serie=(D.provinces[sel]||{})[ind]||{};
    const MA=["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07"];
    const barres=MA.map(m=>{const v=serie[m];const h2=v==null?4:fcfa?Math.max(6,Math.min(120,Math.abs(v)/maxV*120)):Math.min(120,v*1.1);
      return `<div style="text-align:center;flex:1"><div style="height:130px;display:flex;align-items:flex-end;justify-content:center"><div style="width:70%;height:${h2}px;background:${v==null?"#CBC7BE":col(v)};border-radius:3px 3px 0 0"></div></div><div style="font-size:11px;margin-top:4px">${MOIS_NOMS[Number(m.slice(5))-1].slice(0,3)}</div><div style="font-size:11px;font-weight:700">${v==null?"ND":Math.round(v)}</div></div>`;}).join("");
    pan=card(nm+" · "+ind,"Série mensuelle 2026 · "+(D.libelles[ind]||""),
      `<div style="display:flex;gap:4px;padding:6px 2px">${barres}</div>`,
      "Source : "+PROGM.meta.source+". ND affiché pour toute valeur absente, aucune interpolation.");
  }
  return {crumbs,html:et+`<div class="ph-sub">${hors?`Aucun relevé pour ${periodLabel()}. Série disponible de ${mf(D.mois_min)} à ${mf(D.mois_max)} : la carte s'affiche en ND.`:`${ind} · ${periodLabel()} · cliquer une province pour le détail.`}</div></div>
  <div class="content">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${selI}</div>
    <div class="g-2-1">
      ${card("Carte des provinces · "+periodLabel(),fcfa?"Bleu positif · rouge négatif · gris ND":"Vert ≥90 · jaune ≥80 · orange ≥60 · rouge <60 · gris ND",
        `<svg viewBox="${MAP_VIEWBOX}" style="width:100%;max-height:560px">${paths}</svg>`,"")}
      ${pan||card("Détail province","Sélection","<div style='padding:10px 2px;color:var(--body)'>Cliquer une province sur la carte.</div>","")}
    </div>
  </div>`};
}

function kpi(label, val, unit, target, trend, dir, ragClass, inverse = false) {
  if (val == null || String(val).includes("NaN")) { val = "ND"; trend = "—"; dir = "flat"; ragClass = "na"; }
  const ndTitre = val === "ND" ? ' title="Donnée non disponible pour la période sélectionnée"' : '';
  const trendCls = dir === "up" ? "up" : dir === "down" ? "down" : "flat";
  return `
    <div class="kpi ${ragClass}"${ndTitre}>
      <div class="kpi-head">
        <div class="kpi-label">${label}</div>
      </div>
      <div class="kpi-val-row">
        <div class="kpi-value">${val}</div>
        <div class="kpi-unit">${unit}</div>
      </div>
      <div class="kpi-meta">
        <div class="kpi-target">${target}</div>
        <div class="kpi-trend ${trendCls} ${inverse ? 'inverse' : ''}">${trend}</div>
      </div>
    </div>
  `;
}

  `;
}

function renderBars(bars) {
  return `<div class="bar-list">
    ${bars.map(b => {
      const max = b.max || 100;
      const manque = !Number.isFinite(b.val);
      const pct = manque ? 0 : Math.min(100, (b.val / max) * 100);
      const targetPct = b.target ? Math.min(100, (b.target / max) * 100) : null;
      const ragCls = b.rag || "navy";
      return `
        <div class="bar-row">
          <div class="bar-label">${b.label}</div>
          <div class="bar-track">
            <div class="bar-fill ${ragCls}" data-w="${pct}" style="width:0%;"></div>
            ${targetPct ? `<div class="bar-target" style="left:${targetPct}%;"></div>` : ''}
          </div>
          <div class="bar-val ${ragCls}">${manque ? "ND" : (b.showVal || b.val + '%')}</div>
        </div>
      `;
    }).join("")}
  </div>`;
}

function renderLineChart(series, opts = {}) {
  const w = 480, h = 200, p = { t:18, r:16, b:28, l:34 };
  series = series.map(s => ({ ...s, pts: s.data.map((v, i) => ({ v, i })).filter(p => Number.isFinite(p.v)) }));
  const allData = series.flatMap(s => s.pts.map(p => p.v));
  if (!allData.length) return '<div style="padding:24px;color:#94A3B8;text-align:center;">ND</div>';
  const min = Math.min(...allData);
  const max = Math.max(...allData);
  const range = max - min || 1;
  const padding = range * 0.1;
  const yMin = Math.max(0, min - padding);
  const yMax = max + padding;
  const yRange = yMax - yMin;
  const innerW = w - p.l - p.r;
  const innerH = h - p.t - p.b;
  const xStep = innerW / (series[0].data.length - 1);

  const months = opts.labels || ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  const lines = series.map((s, idx) => {
    const path = s.pts.map((pt, k) => {
      const x = p.l + pt.i * xStep;
      const y = p.t + innerH - ((pt.v - yMin) / yRange) * innerH;
      return `${k === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(" ");

    // Area fill (only for solid lines)
    const areaPath = (s.style !== 'dashed' && s.pts.length) ? path + ` L ${p.l + s.pts[s.pts.length-1].i * xStep} ${p.t + innerH} L ${p.l + s.pts[0].i * xStep} ${p.t + innerH} Z` : '';

    const dots = s.style === 'dashed' ? '' : s.pts.map((pt) => {
      const x = p.l + pt.i * xStep;
      const y = p.t + innerH - ((pt.v - yMin) / yRange) * innerH;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${s.color}" stroke="white" stroke-width="1"/>`;
    }).join("");
    return {
      path, areaPath, dots,
      name: s.name, color: s.color,
      style: s.style || 'solid',
      opacity: s.opacity || 1
    };
  });

  const yTicks = 4;
  const grid = [];
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (yRange * i / yTicks);
    const y = p.t + innerH - (innerH * i / yTicks);
    grid.push(`<line x1="${p.l}" y1="${y.toFixed(1)}" x2="${w-p.r}" y2="${y.toFixed(1)}" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2 3"/>`);
    grid.push(`<text x="${p.l-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#A09A93" text-anchor="end" font-family="JetBrains Mono">${Math.round(v)}</text>`);
  }

  const xLabels = months.map((m, i) => {
    if (i % 2 !== 0 && i !== months.length - 1) return '';
    const x = p.l + i * xStep;
    return `<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" fill="#A09A93" text-anchor="middle">${m}</text>`;
  }).join("");

  // Areas (rendered first, behind lines)
  const areas = lines.filter(l => l.style !== 'dashed').map((l, idx) =>
    `<path d="${l.areaPath}" fill="${l.color}" opacity="${l.style === 'dashed' ? 0.04 : 0.08}"/>`
  ).join("");

  return `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${grid.join("")}
      ${xLabels}
      ${areas}
      ${lines.map(l => `
        <path d="${l.path}"
          stroke="${l.color}"
          stroke-width="${l.style === 'dashed' ? 1.5 : 2.2}"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="${l.opacity}"
          ${l.style === 'dashed' ? 'stroke-dasharray="4 3"' : ''}
        />
      `).join("")}
      ${lines.map(l => l.dots).join("")}
    </svg>
    <div class="chart-legend">
      ${lines.map(l => `
        <div class="cl-item">
          <span class="cl-mark" style="background:${l.color}; ${l.style === 'dashed' ? 'border:1px dashed '+l.color+'; background:transparent; height:0;' : ''}; opacity:${l.opacity}"></span>${l.name}
        </div>
      `).join("")}
    </div>
    <div class="chart-values-wrap">
      <button class="chart-values-toggle" onclick="this.parentElement.classList.toggle('cache')">Afficher / masquer les valeurs</button>
      <table class="chart-values">
        <tr><th></th>${months.map(m => `<td><strong>${m}</strong></td>`).join("")}</tr>
        ${series.map(s => `<tr><th>${s.name}</th>${s.data.map(v => `<td>${v == null || !Number.isFinite(v) ? "—" : v}</td>`).join("")}</tr>`).join("")}
      </table>
    </div>
  `;
}

// Helper to build YoY chart series (current year solid + N-1 dashed)
function yoySeriesData(metric, scope = "national") {
  const annee = state.periodYear;
  const serieAnnee = (a) => Array.from({ length: 12 }, (_, i) => {
    const periode = `${a}-${String(i + 1).padStart(2, "0")}`;
    if (state.provinceFilter) return valeurPeriodeExplicite(metric, state.provinceFilter, periode);
    if (scope === "pda") {
      const vals = PDA_PROVINCES.map(p => valeurPeriodeExplicite(metric, p, periode)).filter(v => v != null);
      return vals.length ? Math.round(vals.reduce((x, y) => x + y, 0) / vals.length * 10) / 10 : null;
    }
    return valeurNatPeriode(metric, periode);
  });
  const series = [{ name: `Année ${annee}`, data: serieAnnee(annee), color: "#1F3864", style: "solid", opacity: 1 }];
  [[annee - 1, "#A09A93"], [annee - 2, "#CEC8BA"]].forEach(([a, c]) => {
    const d = serieAnnee(a);
    if (d.some(v => v != null)) series.push({ name: `Année ${a}`, data: d, color: c, style: "dashed", opacity: 0.9 });
  });
  return series;
}

function renderMap(metric, opts = {}) {
  const inverse = opts.inverse || false;
  const isVolume = opts.isVolume || metric === "zd-volume";
  const pdaFocus = opts.pdaFocus || (state.sub === "vacc-pda");
  const valMap = provincesValueMap(metric);

  function getRag(val) {
    if (val == null || Number.isNaN(val)) return "na";
    const abs = SEUILS.par_metrique && SEUILS.par_metrique[metric];
    if (abs) return (opts.inverse
      ? (val <= abs.vert ? "green" : val <= abs.jaune ? "yellow" : val <= abs.orange ? "orange" : "red")
      : (val >= abs.vert ? "green" : val >= abs.jaune ? "yellow" : val >= abs.orange ? "orange" : "red"));
    if (isVolume) {
      if (val <= 2500) return "green";
      if (val <= 4500) return "yellow";
      if (val <= 6500) return "orange";
      return "red";
    }
    if (inverse || metric === "rupture" || metric === "abandon" || metric === "perim") {
      if (val <= 30) return "green";
      if (val <= 50) return "yellow";
      if (val <= 70) return "orange";
      return "red";
    }
    if (val >= 80) return "green";
    if (val >= 60) return "yellow";
    if (val >= 40) return "orange";
    return "red";
  }

  function dispVal(v) {
    if (v == null || Number.isNaN(v)) return "ND";
    if (isVolume) return fmt(v);
    return v + "%";

    "NDJ": "NDJ",

    "LOE": "Log-E",
    "LAC": "Lac",

    "LOO": { dx: 0, dy: 0 },

      return `<path class="map-prov rag-${rag} map-district" d="${d.d}"><title>${titre}</title></path>`;

    const dLabels = ds.map(d =>
      `<g class="map-label district"><text class="map-label-name" x="${d.cx}" y="${d.cy}">${d.name}</text></g>`).join("");
    const contour = geoProv ? `<path d="${geoProv.d}" fill="none" stroke="var(--royal)" stroke-width="1.2" opacity="0.9"/>` : "";
    return `
      <div class="map-wrap">
        <div class="map-zoom-bar">
          <button class="tb-btn" onclick="clearMapZoomProv()">← Toutes les provinces</button>

        <svg class="map-svg" viewBox="${currentMapViewBox()}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Districts de ${prov ? prov.name : ""}">

          ${contour}

        </svg>
        <div class="map-district-note">Les tracés proviennent des limites sanitaires officielles (niveau district). Les indicateurs par district s'afficheront dès que l'extraction descendra à ce niveau ; ils figurent aujourd'hui en gris (donnée à venir).</div>
      </div>`;
  }

  // Build SVG paths and labels for each province
  const paths = [];
  const labels = [];
  PROVINCES.forEach(p => {
    const geo = PROVINCE_PATHS[p.id];
    if (!geo) return;
    const val = valMap[p.id];
    const r = getRag(val);
    const isPda = PDA_PROVINCES.includes(p.id);
    const isSelected = state.provinceFilter === p.id;

    let cls = "map-prov";
    let inlineStyle = "";
    let darkText = false;

    if (state.mapMode === "zones") {
      const zone = ZONES[PROV_ZONE[p.id]];
      inlineStyle = ` style="fill:${zone.color}"`;
      darkText = zone.textDark;
    } else {
      cls += ` rag-${r}`;
      darkText = (r === "yellow");
    }
    if (pdaFocus && !isPda) cls += " dim";
    if (pdaFocus && isPda) cls += " pda-active";
    if (isSelected) cls += " selected";

    const titleTxt = `${p.name} · ${dispVal(val)} · ${ZONES[PROV_ZONE[p.id]].name}${isPda ? ' · PDA' : ''}`;

    paths.push(`<path class="${cls}"${inlineStyle} d="${geo.d}"
      onclick="showProvInfo('${p.id}', '${metric}', ${isVolume}); setProvinceFilter('${p.id}')"><title>${titleTxt}</title></path>`);

    // Label group
    const nudge = LABEL_NUDGE[p.id] || { dx: 0, dy: 0 };
    const cx = geo.cx + nudge.dx;
    const cy = geo.cy + nudge.dy;
    const isTiny = TINY_PROV.has(p.id);
    const lblName = isTiny && TINY_LABEL[p.id] ? TINY_LABEL[p.id] : p.short;
    const dim = (pdaFocus && !isPda) ? ' opacity="0.45"' : '';
    const labelCls = "map-label" + (isTiny ? " tiny" : "");
    const txtCls = "map-label-name" + (darkText ? " dark" : "");
    const valCls = "map-label-val" + (darkText ? " dark" : "");
    // PDA marker · small dot offset to the upper-right of the label
    const pdaR = isTiny ? 2.6 : 3.4;
    const pdaDx = isTiny ? 12 : 16;
    const pdaDy = isTiny ? 6 : 8;
    const pdaDot = isPda ? `<circle class="map-pda-marker" cx="${cx + pdaDx}" cy="${cy - pdaDy}" r="${pdaR}"/>` : "";

    labels.push(`<g class="${labelCls}"${dim}>
      <text class="${txtCls}" x="${cx}" y="${cy - 5}">${lblName}</text>
      <text class="${valCls}" x="${cx}" y="${cy + 7}">${dispVal(val)}</text>
      ${pdaDot}
    </g>`);
  });

  const filtreProv = state.provinceFilter;
  const perimetre = pdaFocus ? PDA_PROVINCES : PROVINCES.map(p => p.id);
  const renseignees = perimetre.filter(id => valMap[id] != null);
  const natDirect = valeurReelle(metric, null, 0);
  const natVal = natDirect != null ? natDirect
    : (renseignees.length ? Math.round(renseignees.reduce((s, id) => s + valMap[id], 0) / renseignees.length * 10) / 10 : null);
  const natPrev = valeurReelle(metric, null, 1);
  const natTendance = (natVal != null && natPrev != null)
    ? ((natVal - natPrev >= 0 ? "+" : "") + (Math.round((natVal - natPrev) * 10) / 10) + " pts") : "—";
  const tri = renseignees.slice().sort((a, b) => valMap[a] - valMap[b]);
  const nomDe = id => (PROVINCES.find(p => p.id === id) || {}).name || id;
  const extremes = tri.length
    ? { basse: tri[0], haute: tri[tri.length - 1] } : null;
  const infoProv = filtreProv ? PROVINCES.find(p => p.id === filtreProv) : null;
  const infoVal = filtreProv ? valMap[filtreProv] : null;
  const infoRag = filtreProv ? getRag(infoVal) : getRag(natVal);
  const infoZone = filtreProv ? ZONES[PROV_ZONE[filtreProv]] : null;

  // Couche districts au niveau national (structure prete, donnee a venir : ND)
  const grainDistrictNat = (state.mapGrain === "district") && !state.mapZoomProv;
  const coucheDistrictsNat = grainDistrictNat
    ? DISTRICTS.map(d => {
        const prov = PROVINCES.find(x => x.id === d.prov);
        const vp = valeurPEVdist(metric, d.name);
        const val = (vp === undefined ? null : vp);
        const rag = getRag(val);
        const titre = val == null ? (d.name + (prov ? " · " + prov.name : "") + " · donnée à venir") : (d.name + (prov ? " · " + prov.name : "") + " : " + val + "%");
        return `<path class="map-prov rag-${rag} map-district" d="${d.d}" onclick="setMapZoomProv('${d.prov}')"><title>${titre}</title></path>`;
      }).join("")
    : "";

  // Selecteur de granularite : provinces ou districts
  const grain = state.mapGrain || "province";
  const grainToggle = `
    <div class="map-mode-toggle map-grain-toggle">
      <button class="mm-btn ${grain === 'province' ? 'on' : ''}" onclick="setMapGrain('province')" title="Découpage par province (23)">Provinces</button>
      <button class="mm-btn ${grain === 'district' ? 'on' : ''}" onclick="setMapGrain('district')" title="Découpage par district sanitaire (161)">Districts</button>
    </div>
  `;

  // Toggle
  const modeToggle = `
    <div class="map-mode-toggle">
      <button class="mm-btn ${state.mapMode === 'performance' ? 'on' : ''}" onclick="setMapMode('performance')" title="Couleurs par performance (RAG)">
        Performance
      </button>
      <button class="mm-btn ${state.mapMode === 'zones' ? 'on' : ''}" onclick="setMapMode('zones')" title="Couleurs par zone agroclimatique">
        Zones
      </button>
    </div>
  `;

  // Legend depends on mode
  let legendHtml;
  if (grainDistrictNat) {
    legendHtml = `
      <div class="map-legend-title">Découpage sanitaire</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--border-2)"></span>161 districts · donnée à venir</div>
      <div class="map-legend-note">Cliquer un district ouvre sa province. Les indicateurs par district s'afficheront dès qu'une source sera branchée.</div>`;
  } else if (state.mapMode === "zones") {
    legendHtml = `
      <div class="map-legend-title">Zones agroclimatiques</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SAH.color}"></span>Saharienne (${ZONES.SAH.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SHL.color}"></span>Sahélienne (${ZONES.SHL.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SDN.color}"></span>Soudanienne (${ZONES.SDN.count})</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA</div>' : ''}
    `;
  } else {
    legendHtml = `
      <div class="map-legend-title">Performance</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-green)"></span>Bon</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-yellow)"></span>À surveiller</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-orange)"></span>Attention</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-red)"></span>Critique</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA</div>' : ''}
    `;
  }

  return `
    <div class="map-wrap">
      ${grainToggle}
      ${modeToggle}
      <div class="map-toolbar">
        <div class="map-tb-group" role="group" aria-label="Taille de la carte">
          <span class="map-tb-label">Taille</span>
          <button class="map-tb-btn ${state.mapSize === 'S' ? 'on' : ''}" data-map-size-btn="S" onclick="setMapSize('S')" title="Compacte">S</button>
          <button class="map-tb-btn ${state.mapSize === 'M' ? 'on' : ''}" data-map-size-btn="M" onclick="setMapSize('M')" title="Standard">M</button>
          <button class="map-tb-btn ${state.mapSize === 'L' ? 'on' : ''}" data-map-size-btn="L" onclick="setMapSize('L')" title="Étendue">L</button>
          <button class="map-tb-btn ${state.mapSize === 'XL' ? 'on' : ''}" data-map-size-btn="XL" onclick="setMapSize('XL')" title="Plein cadre">XL</button>
        </div>
        <div class="map-tb-group" role="group" aria-label="Zoom de la carte">
          <button class="map-tb-btn" data-map-zoom="out" onclick="mapZoomOut()" title="Dézoomer (molette ou pincement)">−</button>
          <span class="map-tb-zoom-pct" aria-live="polite">${Math.round(state.mapZoom * 100)}%</span>
          <button class="map-tb-btn" data-map-zoom="in" onclick="mapZoomIn()" title="Zoomer">+</button>
          <button class="map-tb-btn" data-map-zoom="reset" onclick="mapZoomReset()" title="Réinitialiser zoom et recadrage">⟲</button>
        </div>
      </div>
      <div class="map-svg-wrap" data-size="${state.mapSize}">
        <svg class="map-svg" viewBox="${currentMapViewBox()}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Carte du Tchad">
          <g class="map-prov-layer">${grainDistrictNat ? coucheDistrictsNat : paths.join("")}</g>
          <g class="map-label-layer">${grainDistrictNat ? "" : labels.join("")}</g>
        </svg>
      </div>
      <div class="map-legend">${legendHtml}</div>
      <div class="map-info" id="map-info">
        ${filtreProv ? `
        <div class="map-info-tag">${PDA_PROVINCES.includes(filtreProv) ? "Province PDA" : "Province"}</div>
        <div class="map-info-name">${infoProv.name}${PDA_PROVINCES.includes(filtreProv) ? '<span class="map-info-pda">PDA</span>' : ''}</div>
        <div class="map-info-row"><span>Zone</span><span class="map-info-val" style="color:${infoZone.textDark ? '#5A3F1A' : infoZone.color};font-weight:700;">${infoZone.name}</span></div>
        <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${dispVal(infoVal)}</span></div>
        <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${infoRag}">${ragLabel(infoRag)}</span></span></div>
        <div class="map-info-row"><span>Tendance vs mois précédent</span><span class="map-info-val">${(() => { const pv = genValue(metric, filtreProv, 1); return (infoVal != null && pv != null) ? ((infoVal - pv >= 0 ? "+" : "") + (Math.round((infoVal - pv) * 10) / 10) + " pts") : "—"; })()}</span></div>
        ${districtsDe(filtreProv).length ? `<button class="tb-btn map-info-districts" onclick="setMapZoomProv('${filtreProv}')">Explorer les ${districtsDe(filtreProv).length} districts →</button>` : ""}
        ` : `
        <div class="map-info-tag">${pdaFocus ? "Agrégat PDA" : "Vue nationale"}</div>
        <div class="map-info-name">${pdaFocus ? "Provinces PDA" : "National · 23 provinces"}</div>
        <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${dispVal(natVal)}</span></div>
        <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${infoRag}">${ragLabel(infoRag)}</span></span></div>
        <div class="map-info-row"><span>Provinces ayant rapporté</span><span class="map-info-val">${renseignees.length} / ${perimetre.length}</span></div>
        ${extremes ? `
        <div class="map-info-row"><span>Valeur la plus élevée</span><span class="map-info-val">${nomDe(extremes.haute)} · ${dispVal(valMap[extremes.haute])}</span></div>
        <div class="map-info-row"><span>Valeur la plus faible</span><span class="map-info-val">${nomDe(extremes.basse)} · ${dispVal(valMap[extremes.basse])}</span></div>` : ""}
        <div class="map-info-row"><span>Tendance vs mois précédent</span><span class="map-info-val">${natTendance}</span></div>
        <div class="map-info-note">Cliquez une province sur la carte pour sa fiche détaillée.</div>
        `}
      </div>
    </div>
  `;
}

function showProvInfo(provId, metric, isVolume) {
  const p = PROVINCES.find(x => x.id === provId);
  if (!p) return;
  const val = genValue(metric, provId);
  const isPda = PDA_PROVINCES.includes(provId);
  const inverse = metric === "rupture" || metric === "abandon" || metric === "perim" || isVolume;
  let r;
  if (val == null) {
    r = "na";
  } else if (isVolume) {
    r = val <= 2500 ? "green" : val <= 4500 ? "yellow" : val <= 6500 ? "orange" : "red";
  } else if (inverse) {
    r = val <= 30 ? "green" : val <= 50 ? "yellow" : val <= 70 ? "orange" : "red";
  } else {
    r = val >= 80 ? "green" : val >= 60 ? "yellow" : val >= 40 ? "orange" : "red";
  }
  const prev = genValue(metric, provId, 1);
  const trend = (val != null && prev != null) ? Math.round((val - prev) * 10) / 10 : null;
  const display = val == null ? "ND" : (isVolume ? fmt(val) : val + "%");

  const info = document.getElementById("map-info");
  if (info) {
    info.innerHTML = `
      <div class="map-info-tag">${isPda ? "Province PDA" : "Province"}</div>
      <div class="map-info-name">${p.name}${isPda ? '<span class="map-info-pda">PDA</span>' : ''}</div>
      <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${display}</span></div>
      <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${r}">${ragLabel(r)}</span></span></div>
      <div class="map-info-row"><span>Tendance vs mois précédent</span><span class="map-info-val">${trend == null ? "—" : (trend >= 0 ? "+" : "") + trend + " pts"}</span></div>
    `;
  }
}

/* ==============================================================
   EXTENSION CID : DPSIS, surveillance MEV, DSR provincial,
   logistique DGPML, repertoire FOSA, explorateur et alertes.
   Mode strict : ND pour toute valeur absente, aucune valeur
   corrigee ni reconduite, anomalies signalees a la source.
============================================================== */

/* ---- correspondance identifiants carte, noms canoniques ---- */
const PROV_CANON = {
  TIB:"Tibesti", BRK:"Borkou", EOU:"Ennedi Ouest", EES:"Ennedi Est",
  KAN:"Kanem", BAR:"Barh El Gazal", BAT:"Batha", WAD:"Wadi Fira",
  LAC:"Lac", HDL:"Hadjer Lamis", GUE:"Guera", OUA:"Ouaddai",
  NDJ:"N'Djamena", CBG:"Chari Baguirmi", SAL:"Salamat", SIL:"Sila",
  MKO:"Mayo Kebbi Ouest", MKE:"Mayo Kebbi Est", TAN:"Tandjile",
  MAN:"Mandoul", MCH:"Moyen Chari", LOO:"Logone Occidental", LOE:"Logone Oriental"
};
const CANON_PROV = {};
Object.keys(PROV_CANON).forEach(k => { CANON_PROV[PROV_CANON[k]] = k; });

function cidProvNom(id) { const p = PROVINCES.find(x => x.id === id); return p ? p.name : id; }

/* ---- temps ---- */
const CID_MOIS_C = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
function cidMois(p) { if (!p) return "ND"; const [a, m] = p.split("-").map(Number); return MOIS_NOMS[m - 1] + " " + a; }
function cidMoisC(p) { if (!p) return "ND"; const [a, m] = p.split("-").map(Number); return CID_MOIS_C[m - 1] + " " + String(a).slice(2); }
function cidPerCourante() { return `${state.periodYear}-${String(state.periodMonth).padStart(2, "0")}`; }
function cidPrec(p) { const [a, m] = p.split("-").map(Number); return m > 1 ? `${a}-${String(m - 1).padStart(2, "0")}` : `${a - 1}-12`; }
function cidDerniere(serie, plafond) {
  if (!serie) return { p: null, v: null };
  const cles = Object.keys(serie).filter(p => serie[p] != null && (!plafond || p <= plafond)).sort();
  if (!cles.length) return { p: null, v: null };
  const p = cles[cles.length - 1];
  return { p, v: serie[p] };
}
function cidSerieN(serie, fin, n) {
  const out = [];
  let p = fin;
  for (let i = 0; i < (n || 12); i++) { out.unshift(serie && serie[p] != null ? serie[p] : null); p = cidPrec(p); }
  return out;
}
function cidAnnee(serie, annee) {
  const d = [];
  for (let m = 1; m <= 12; m++) { const p = `${annee}-${String(m).padStart(2, "0")}`; d.push(serie && serie[p] != null ? serie[p] : null); }
  return d;
}
function cidFmtNb(v) { return v == null ? "ND" : Number(v).toLocaleString("fr-FR"); }

/* ---- choroplethe generique (valeurs indexees par identifiant province) ---- */
function cidCarte(valeurs, opts) {
  opts = opts || {};
  const couleur = opts.couleur || (v => v == null ? "#CBC7BE" : v >= 90 ? "#2E7D32" : v >= 80 ? "#C9A227" : v >= 60 ? "#D97B29" : "#B3372F");
  const format = opts.format || (v => v == null ? "ND" : v + "%");
  const clic = opts.clic || "";
  const paths = Object.keys(PROVINCE_PATHS).map(c => {
    const v = valeurs[c] === undefined ? null : valeurs[c];
    const action = clic ? ` style="cursor:pointer" onclick="${clic}('${c}')"` : "";
    return `<path d="${PROVINCE_PATHS[c].d}" fill="${couleur(v)}" stroke="#F1EFEA" stroke-width="1.4"${action}><title>${cidProvNom(c)} · ${format(v)}</title></path>`;
  }).join("");
  return `<svg viewBox="${MAP_VIEWBOX}" style="width:100%;max-height:560px">${paths}</svg>`;
}
function cidEchelleVolume(valeurs) {
  const vs = Object.values(valeurs).filter(v => v != null && v > 0);
  const max = vs.length ? Math.max(...vs) : 1;
  return v => v == null ? "#CBC7BE" : v < 0 ? "#B3372F" : v === 0 ? "#E6E2D8" :
    ["#DBE3F0", "#AFC0DB", "#7E97BF", "#4E6FA0", "#1F3864"][Math.min(4, Math.floor((v / max) * 4.999))];
}

/* ---- chips de selection ---- */
function cidChips(items, cle, actif) {
  return `<div class="cid-chips">` + items.map(it =>
    `<button class="cid-chip ${it.v === actif ? "on" : ""}" onclick="window['${cle}']=${JSON.stringify(String(it.v)).replace(/"/g, "&quot;")};renderMain()">${it.l}</button>`
  ).join("") + `</div>`;
}

/* ---- export CSV ---- */
function cidExportCSV(nom, entetes, lignes) {
  const esc = c => { c = c == null ? "" : String(c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
  const contenu = [entetes.map(esc).join(";")].concat(lignes.map(l => l.map(esc).join(";"))).join("\n");
  const blob = new Blob(["\uFEFF" + contenu], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
window.__cidCSV = {};
function cidBoutonCSV(id, nom) {
  return `<button class="cid-btn-csv" onclick="(function(){const d=window.__cidCSV['${id}'];if(d)cidExportCSV('${nom}',d.entetes,d.lignes);})()">Exporter CSV</button>`;
}

/* ==============================================================
   CATALOGUE TRANSVERSAL DES INDICATEURS
   Chaque entree expose une serie mensuelle par province (identifiant
   carte) ou nationale (null). Construit sur les seuls jeux charges.
============================================================== */
function cidCatalogue() {
  const cat = [];
  if (DSRP) {
    Object.keys(DSRP.indicateurs).forEach(code => {
      const d = DSRP.indicateurs[code];
      cat.push({
        id: "dsr:" + code, dom: "Santé reproductive · DSR", libelle: d.libelle, unite: d.unite,
        src: "DHIS2 provincial DSR", natDispo: false,
        serie: id => {
          if (id == null) return null;
          const pv = DSRP.provinces[PROV_CANON[id]];
          return pv ? (pv[code] || null) : null;
        }
      });
    });
  }
  if (DSRN) {
    Object.keys(DSRN.indicateurs).forEach(code => {
      const d = DSRN.indicateurs[code];
      cat.push({
        id: "dsrn:" + code, dom: "Santé reproductive · national", libelle: d.libelle + " (national)", unite: d.unite,
        src: "DHIS2 national DSR", natDispo: true,
        serie: id => id == null ? d.serie : null
      });
    });
  }
  if (DPSISQ) {
    [["rma_global", "comp", "Complétude RMA globale"], ["rma_global", "promp", "Promptitude RMA globale"],
     ["rma_cs", "comp", "Complétude RMA centres de santé"], ["rma_hdhp", "comp", "Complétude RMA hôpitaux HD et HP"],
     ["ids", "comp", "Complétude surveillance IDS"]].forEach(([sys, ch, lib]) => {
      cat.push({
        id: "dpsis:" + sys + ":" + ch, dom: "Système d'information · DPSIS", libelle: lib, unite: "%",
        src: "Relevé DPSIS", natDispo: true,
        serie: id => {
          const cible = id == null ? "National" : PROV_CANON[id];
          const out = {};
          Object.keys(DPSISQ.valeurs).forEach(per => {
            const u = DPSISQ.valeurs[per][cible];
            if (u && u[sys] && u[sys][ch] != null) out[per] = u[sys][ch];
          });
          return out;
        }
      });
    });
  }
  if (SURV) {
    SURV.maladies.forEach(m => {
      cat.push({
        id: "surv:" + m.code, dom: "Surveillance des maladies · IDS",
        libelle: m.libelle + (m.incidence === "incidence" ? " · taux d'incidence" : " · taux d'attaque"), unite: "/100 000",
        src: "DHIS2 surveillance intégrée", natDispo: true,
        serie: id => {
          const cible = id == null ? "National" : PROV_CANON[id];
          const out = {};
          Object.keys(SURV.valeurs).forEach(per => {
            const u = SURV.valeurs[per][cible];
            const x = u && u[m.code];
            if (x && (x.att != null || x.inc != null)) out[per] = x.att != null ? x.att : x.inc;
          });
          return out;
        }
      });
    });
  }
  if (DPML) {
    DPML.produits.forEach(pr => {
      cat.push({
        id: "dpml:" + pr.code, dom: "Logistique · DGPML", libelle: "Stock fin de mois · " + pr.libelle, unite: "unités",
        src: "DHIS2 DGPML", natDispo: true,
        serie: id => {
          const cible = id == null ? "National" : PROV_CANON[id];
          return (DPML.stocks[pr.code] || {})[cible] || null;
        }
      });
    });
  }
  if (PEVP && PEVP.meta && PEVP.meta.antigenes) {
    PEVP.meta.antigenes.forEach(ag => {
      cat.push({
        id: "pev:" + ag, dom: "Vaccination · PEV", libelle: "Couverture mensuelle " + ag, unite: "%",
        src: PEVP.meta.source, natDispo: true,
        serie: id => {
          if (id == null) return (PEVP.national.couv || {})[ag] || null;
          const pv = PEVP.provinces[id];
          const s = pv && pv.couv ? pv.couv[ag] : null;
          return s && Object.keys(s).length ? s : null;
        }
      });
    });
  }
  return cat;
}

/* ==============================================================
   MOTEUR D'ALERTES
   Regles calculees sur les seules valeurs presentes, chaque alerte
   porte sa periode de reference et un lien vers la vue de detail.
============================================================== */
function cidAlertes() {
  const A = [];
  const pousse = (niv, dom, txt, det, prog, sub, periode) => A.push({ niv, dom, txt, det, prog, sub, periode });

  /* vaccination : provinces sous la cible Penta3, cumul RIM */
  if (typeof pevDispo === "function" && pevDispo()) {
    const sc = pevSousCible("Penta3", PEV.meta.cible_couverture);
    if (sc && sc.prov > 0) {
      const bas = pevProvCV("Penta3")[0];
      pousse(sc.prov >= 8 ? "rouge" : "orange", "Vaccination",
        sc.prov + " provinces sous la cible Penta3",
        "Cible " + PEV.meta.cible_couverture + "% en cumul" + (bas ? ", plancher à " + bas.val + "% (" + bas.nom.charAt(0) + bas.nom.slice(1).toLowerCase() + ")" : "") + ".",
        "vacc", "vacc-couv", PEV.meta.mois_max);
    }
  }
  /* cholera : letalite au dessus du seuil OMS */
  if (CHOL_P && CHOL_P.global) {
    const g = CHOL_P.global;
    if (g.letalite != null && g.letalite > 1) {
      pousse("rouge", "Choléra", "Létalité à " + g.letalite + "%, seuil de 1% dépassé",
        g.cas + " cas et " + g.deces + " décès cumulés, foyers Hadjer Lamis et N'Djamena.",
        "cousp", "cousp-sitrep", (CHOL_P.meta && CHOL_P.meta.fin) || null);
    }
  }
  /* DSR national : niveau et decrochage mensuel */
  if (DSRN) {
    const cp = cidDerniere(DSRN.indicateurs.cpn1.serie, DSRN.meta.mois_max);
    if (cp.v != null && cp.v < 80)
      pousse("orange", "Santé maternelle", "Couverture CPN1 à " + Math.round(cp.v) + "%", "Relevé national de " + cidMois(cp.p) + ", cible 95%.", "dsr", "dsr-overview", cp.p);
    let chutes = 0, exemple = null;
    Object.keys(DSRN.indicateurs).forEach(k => {
      const ind = DSRN.indicateurs[k];
      if (ind.unite !== "%") return;
      const d = cidDerniere(ind.serie, DSRN.meta.mois_max);
      const prec = d.p ? ind.serie[cidPrec(d.p)] : null;
      if (d.v != null && prec != null && prec - d.v >= 15) { chutes++; if (!exemple) exemple = ind.libelle; }
    });
    if (chutes >= 3)
      pousse("orange", "Santé maternelle", chutes + " indicateurs DSR en repli de 15 points ou plus sur un mois",
        "Dont " + exemple + ". Un décrochage simultané oriente vers un défaut de rapportage à vérifier avec la DSR.", "dsr", "dsr-overview", DSRN.meta.mois_max);
  }
  /* DSR provincial : mortalite maternelle hospitaliere elevee */
  if (DSRP) {
    const eleves = [];
    Object.keys(PROV_CANON).forEach(id => {
      const s = (DSRP.provinces[PROV_CANON[id]] || {}).mort_mat_hosp;
      const d = cidDerniere(s, DSRP.meta.mois_max);
      if (d.v != null && d.v >= 700) eleves.push({ id, v: Math.round(d.v), p: d.p });
    });
    if (eleves.length) {
      eleves.sort((a, b) => b.v - a.v);
      pousse(eleves[0].v >= 1500 ? "rouge" : "orange", "Santé maternelle",
        eleves.length + " province" + (eleves.length > 1 ? "s" : "") + " au dessus de 700 décès maternels pour 100 000 en milieu hospitalier",
        "Maximum " + cidFmtNb(eleves[0].v) + " (" + cidProvNom(eleves[0].id) + ", " + cidMois(eleves[0].p) + ").",
        "dsr", "dsr-mat", eleves[0].p);
    }
  }
  /* DPSIS : completude et promptitude nationales */
  if (DPSISQ) {
    const derP = DPSISQ.meta.derniere_periode_couverte;
    const nat = (DPSISQ.valeurs[derP] || {})["National"] || {};
    const comp = nat.rma_global ? nat.rma_global.comp : null;
    const promp = nat.rma_global ? nat.rma_global.promp : null;
    if (comp != null && comp < 90)
      pousse("orange", "Rapportage", "Complétude RMA nationale à " + Math.round(comp) + "%", "Relevé de " + cidMois(derP) + ", cible 95%.", "dpsis", "dpsis-comp", derP);
    if (promp != null && promp < 80)
      pousse("orange", "Rapportage", "Promptitude RMA nationale à " + Math.round(promp) + "%", "Relevé de " + cidMois(derP) + ", cible 90%.", "dpsis", "dpsis-comp", derP);
    const faibles = Object.keys(PROV_CANON).filter(id => {
      const u = (DPSISQ.valeurs[derP] || {})[PROV_CANON[id]];
      return u && u.rma_global && u.rma_global.comp != null && u.rma_global.comp < 80;
    });
    if (faibles.length)
      pousse("jaune", "Rapportage", faibles.length + " province" + (faibles.length > 1 ? "s" : "") + " sous 80% de complétude RMA",
        faibles.map(cidProvNom).slice(0, 4).join(", ") + (faibles.length > 4 ? "…" : "") + " · " + cidMois(derP) + ".", "dpsis", "dpsis-comp", derP);
  }
  /* surveillance MEV : letalite non nulle sur maladies a potentiel epidemique */
  if (SURV) {
    const derS = SURV.meta.derniere_periode_partielle ? cidPrec(SURV.meta.derniere_periode_couverte) : SURV.meta.derniere_periode_couverte;
    ["tnn", "diphterie", "meningite", "rougeole"].forEach(code => {
      const m = SURV.maladies.find(x => x.code === code);
      if (!m) return;
      const nat = ((SURV.valeurs[derS] || {})["National"] || {})[code];
      if (nat && nat.let != null && nat.let > 0)
        pousse("orange", "Surveillance", "Létalité " + m.libelle + " à " + nat.let + "%", "Relevé national de " + cidMois(derS) + ".", "vacc", "vacc-surv", derS);
    });
  }
  /* logistique : indicateur de rupture eteint et stocks negatifs */
  if (DPML) {
    if (DPML.meta.ruptures_mois_max && DPML.meta.ruptures_mois_max < DPML.meta.stocks_mois_max)
      pousse("jaune", "Logistique", "Indicateur de rupture par FOSA sans relevé en 2026",
        "Dernier relevé " + cidMois(DPML.meta.ruptures_mois_max) + ". La saisie DHIS2 est à réactiver avec la DGPML.", "dpml", "dpml-rupt", DPML.meta.ruptures_mois_max);
    if (DPML.anomalies && DPML.anomalies.length)
      pousse("jaune", "Logistique", DPML.anomalies.length + " stocks de fin de mois négatifs en 2026",
        "Valeurs affichées telles que transmises, correction attendue à la source.", "dpsis", "dpsis-qual", DPML.meta.stocks_mois_max);
    const amox = (DPML.stocks.trac_amox_ad || {})["National"];
    const d = cidDerniere(amox, DPML.meta.stocks_mois_max);
    const prec = d.p ? amox[cidPrec(d.p)] : null;
    if (d.v != null && prec != null && prec > 0 && (prec - d.v) / prec >= 0.2)
      pousse("orange", "Logistique", "Stock national d'amoxicilline adulte en repli de " + Math.round((prec - d.v) / prec * 100) + "% sur un mois",
        cidFmtNb(d.v) + " unités en " + cidMois(d.p) + " contre " + cidFmtNb(prec) + " le mois précédent.", "dpml", "dpml-dispo", d.p);
  }
  const poids = { rouge: 0, orange: 1, jaune: 2 };
  A.sort((a, b) => poids[a.niv] - poids[b.niv]);
  return A;
}

/* ---- pastille et fil d'alertes ---- */
function cidPastille(niv) { return `<span class="cid-dot ${niv}"></span>`; }
function cidFilAlertes(max) {
  const A = cidAlertes();
  if (!A.length) return "";
  const items = A.slice(0, max || 4).map(a =>
    `<button class="cid-al" onclick="selectSub('${a.prog}','${a.sub}')">${cidPastille(a.niv)}<span class="cid-al-txt"><strong>${a.dom}</strong> · ${a.txt}</span><span class="cid-al-fleche">→</span></button>`
  ).join("");
  return `<div class="cid-alertes">
    <div class="cid-alertes-tete">
      <span class="cid-alertes-titre">◆ Alertes actives</span>
      <button class="cid-alertes-tout" onclick="selectSub('explor','explor-alert')">${A.length} au total · tout voir →</button>
    </div>
    <div class="cid-alertes-liste">${items}</div>
  </div>`;
}

VIEWS["dpsis-comp"] = () => {
  const crumbs = ["Système d'Information", "Complétude & promptitude"];
  const et = `<div class="ph"><div class="ph-tag">Rapportage de routine · DPSIS</div><div class="ph-title">Complétude et promptitude du rapportage</div>`;
  if (!DPSISQ) return { crumbs, html: et + `<div class="ph-sub">Données DPSIS en cours de chargement.</div></div>` };
  const derP = DPSISQ.meta.derniere_periode_couverte;
  let per = cidPerCourante();
  const hors = state.periodMode !== "month" || per < "2026-01" || per > derP;
  const perAff = hors ? derP : per;
  const nat = (DPSISQ.valeurs[perAff] || {})["National"] || {};
  const lireN = (sys, ch) => nat[sys] && nat[sys][ch] != null ? nat[sys][ch] : null;
  const volNat = (DPSISQ.volumes[perAff] || {})["National"] || null;
  const sommeVol = (cle) => {
    if (volNat && volNat[cle] != null) return volNat[cle];
    let s = 0, vu = false;
    Object.keys(PROV_CANON).forEach(id => {
      const u = (DPSISQ.volumes[perAff] || {})[PROV_CANON[id]];
      if (u && u[cle] != null) { s += u[cle]; vu = true; }
    });
    return vu ? s : null;
  };
  const csA = sommeVol("cs_attendus"), csS = sommeVol("cs_saisis"), hA = sommeVol("hdhp_attendus"), hS = sommeVol("hdhp_saisis");

  const serieNat = (ch, annee) => {
    const s = {};
    Object.keys(DPSISQ.valeurs).forEach(p => {
      const u = DPSISQ.valeurs[p]["National"];
      if (u && u.rma_global && u.rma_global[ch] != null) s[p] = u.rma_global[ch];
    });
    return cidAnnee(s, annee);
  };

  const valProv = {};
  Object.keys(PROV_CANON).forEach(id => {
    const u = (DPSISQ.valeurs[perAff] || {})[PROV_CANON[id]];
    valProv[id] = u && u.rma_global && u.rma_global.comp != null ? Math.round(u.rma_global.comp) : null;
  });
  const pires = Object.keys(valProv).filter(id => valProv[id] != null).sort((a, b) => valProv[a] - valProv[b]).slice(0, 8);

  const lgnSys = [["rma_cs", "Centres de santé"], ["rma_hdhp", "Hôpitaux HD et HP"], ["rma_hn", "Hôpitaux nationaux"], ["ids", "Surveillance IDS"], ["vih", "Sites VIH"]].map(([sys, lib]) => {
    const c = lireN(sys, "comp"), p = lireN(sys, "promp");
    const sysDef = DPSISQ.systemes.find(s => s.code === sys) || {};
    const sous = Object.keys(PROV_CANON).filter(id => {
      const u = (DPSISQ.valeurs[perAff] || {})[PROV_CANON[id]];
      return u && u[sys] && u[sys].comp != null && u[sys].comp < 95;
    }).length;
    return `<tr><td class="l">${lib}<div class="cid-sous-lib">${sysDef.perimetre || ""}</div></td>
      <td class="num">${c == null ? "ND" : Math.round(c) + "%"}</td>
      <td class="num">${p == null ? "ND" : Math.round(p) + "%"}</td>
      <td class="num">${sous} / 23</td>
      <td>${c == null ? '<span class="pill na">ND</span>' : `<span class="pill ${pevRag(c, 95)}">${ragLabel(pevRag(c, 95))}</span>`}</td></tr>`;
  }).join("");

  const anomP = (DPSISQ.anomalies || []).filter(a => a.periode === perAff);
  const cs = DPSISQ.carte_sanitaire || {};
  const sommeCS = cle => Object.values(cs).reduce((s, x) => s + (x[cle] || 0), 0);

  return { crumbs, html: et + `<div class="ph-sub">${hors ? `Aucun relevé pour ${periodLabel()} : affichage du dernier mois couvert, ${cidMois(derP)}.` : `Relevé de ${cidMois(perAff)} · série disponible de janvier 2020 à ${cidMois(derP)}.`}</div></div>
    <div class="content">
      <div class="kpi-grid">
        ${kpi("Complétude RMA globale", lireN("rma_global", "comp") == null ? null : Math.round(lireN("rma_global", "comp")), "%", "Cible : 95% · " + cidMois(perAff), "", "flat", pevRag(lireN("rma_global", "comp"), 95))}
        ${kpi("Promptitude RMA globale", lireN("rma_global", "promp") == null ? null : Math.round(lireN("rma_global", "promp")), "%", "Cible : 90% · " + cidMois(perAff), "", "flat", pevRag(lireN("rma_global", "promp"), 90))}
        ${kpi("Rapports CS saisis", csS == null ? null : cidFmtNb(csS), "", csA == null ? "Attendus ND" : "sur " + cidFmtNb(csA) + " attendus", "", "flat", csS != null && csA ? pevRag(csS / csA * 100, 95) : "na")}
        ${kpi("Rapports HD et HP saisis", hS == null ? null : cidFmtNb(hS), "", hA == null ? "Attendus ND" : "sur " + cidFmtNb(hA) + " attendus", "", "flat", hS != null && hA ? pevRag(hS / hA * 100, 95) : "na")}
      </div>
      <div class="g-2-1">
        ${card("Complétude RMA · 2026 contre 2025", "Série nationale mensuelle, cible 95%", renderLineChart([
          { name: "2026", data: serieNat("comp", 2026), color: "#1F3864", style: "solid" },
          { name: "2025", data: serieNat("comp", 2025), color: "#A09A93", style: "dash" },
        ]), "Source : " + DPSISQ.meta.source)}
        ${card("Promptitude RMA · 2026 contre 2025", "Série nationale mensuelle, cible 90%", renderLineChart([
          { name: "2026", data: serieNat("promp", 2026), color: "#856722", style: "solid" },
          { name: "2025", data: serieNat("promp", 2025), color: "#A09A93", style: "dash" },
        ]), "")}
      </div>
      <div class="g-2-1">
        ${card("Complétude RMA par province · " + cidMois(perAff), "Vert ≥ 95 · jaune ≥ 90 · orange ≥ 80 · rouge en deçà · gris ND",
          cidCarte(valProv, { couleur: v => v == null ? "#CBC7BE" : v >= 95 ? "#2E7D32" : v >= 90 ? "#C9A227" : v >= 80 ? "#D97B29" : "#B3372F" }), "")}
        ${card("Provinces à renforcer", "Huit complétudes les plus basses · " + cidMois(perAff), renderBars(pires.map(id => ({
          label: cidProvNom(id), val: valProv[id], target: 95, rag: pevRag(valProv[id], 95), showVal: valProv[id] + "%"
        }))), "")}
      </div>
      ${card("Rapportage par périmètre · " + cidMois(perAff), "Complétude, promptitude et provinces sous la cible de 95%", `
        <table class="dt"><thead><tr><th>Périmètre</th><th style="text-align:right">Complétude</th><th style="text-align:right">Promptitude</th><th style="text-align:right">Provinces &lt; 95%</th><th>État</th></tr></thead>
        <tbody>${lgnSys}</tbody></table>`,
        "Le taux national provient de la ligne TCHAD du relevé DPSIS. La promptitude des sites VIH n'est pas suivie dans la source.")}
      ${anomP.length ? card("Signalements qualité · " + cidMois(perAff), anomP.length + " valeur(s) hors bornes, affichée(s) sans correction",
        `<div class="cid-anom-liste">` + anomP.slice(0, 8).map(a => `<div>· <strong>${a.unite}</strong> · ${a.systeme} : ${a.valeur}, ${a.detail}</div>`).join("") + (anomP.length > 8 ? `<div>… et ${anomP.length - 8} autres, visibles dans la vue Qualité des données.</div>` : "") + `</div>`,
        "Mode strict : les anomalies sont signalées à la source, jamais masquées ni corrigées.") : ""}
      ${card("Carte sanitaire de référence", "Dénominateurs du relevé DPSIS", `
        <div class="cid-strip">
          <div class="cid-strip-item"><div class="cid-strip-val">${cidFmtNb(sommeCS("districts"))}</div><div class="cid-strip-lib">districts</div></div>
          <div class="cid-strip-item"><div class="cid-strip-val">${cidFmtNb(sommeCS("hopitaux_district"))}</div><div class="cid-strip-lib">hôpitaux de district</div></div>
          <div class="cid-strip-item"><div class="cid-strip-val">${cidFmtNb(sommeCS("hopitaux_provinciaux"))}</div><div class="cid-strip-lib">hôpitaux provinciaux</div></div>
          <div class="cid-strip-item"><div class="cid-strip-val">${cidFmtNb(sommeCS("hopitaux_nationaux"))}</div><div class="cid-strip-lib">hôpitaux nationaux</div></div>
          <div class="cid-strip-item"><div class="cid-strip-val">${cidFmtNb(sommeCS("centres_sante_pev"))}</div><div class="cid-strip-lib">centres de santé PEV</div></div>
          <button class="cid-btn-csv" onclick="selectSub('dpsis','dpsis-carte')">Ouvrir le répertoire →</button>
        </div>`, "")}
    </div>` };
};

    <div class="content">
      ${cidChips(MEV.map(([v, l]) => ({ v, l })), "__survMal", mal)}
      <div class="kpi-grid">
        ${kpi(malDef.libelle + " · taux d'attaque", dAtt.v, "/100k", "national · " + (dAtt.p ? cidMois(dAtt.p) : "ND"), "", "flat", dAtt.v == null ? "na" : dAtt.v === 0 ? "green" : "orange")}
        ${kpi("Létalité", dLet.v, "%", dLet.p ? "national · " + cidMois(dLet.p) : "non calculée dans la source", "", "flat", dLet.v == null ? "na" : dLet.v === 0 ? "green" : "red", true)}
        ${kpi("Provinces avec cas", touchees, "/ 22", cidMois(perAff), "", "flat", touchees === 0 ? "green" : touchees <= 4 ? "yellow" : "orange")}
        ${kpi("Pic sur douze mois", pic, "/100k", "taux d'attaque national", "", "flat", "na")}
      </div>
      <div class="g-2-1">
        ${card("Taux d'attaque par province · " + cidMois(perAff), "Teinte selon l'intensité relative du mois · gris ND",
          cidCarte(valProv, {
            couleur: v => v == null ? "#CBC7BE" : v === 0 ? "#E6F0E7" : v < maxProv * 0.34 ? "#E8C9A0" : v < maxProv * 0.67 ? "#D97B29" : "#B3372F",

        ${card("Série nationale · taux d'attaque et létalité", malDef.libelle + " · douze derniers mois", renderLineChart([
          { name: "Taux d'attaque", data: cidSerieN(sAtt, perAff, 12), color: "#8C4038", style: "solid" },
          { name: "Létalité %", data: cidSerieN(sLet, perAff, 12), color: "#1F3864", style: "dash" },

        ${kpi("Part des moins de 19 ans", dJ.v, "%", "parmi les nouvelles acceptantes · " + (dJ.p ? cidMois(dJ.p) : "ND"), "", "flat", dJ.v == null ? "na" : "green")}

    <div class="content"><div class="attente-carte">
      <div class="attente-ic">◷</div>
      <div class="attente-corps">
        <div class="attente-titre">Cette vue attend sa source de données</div>
        <div class="attente-txt">Les relevés DSR déposés dans le Drive couvrent la santé maternelle, la planification familiale et les stocks SR, sans volet communautaire. La vue s'alimentera dès qu'un extrait du rapportage communautaire sera déposé.</div>
      </div>
    </div></div>`
});

/* ==============================================================
   DSR : stocks des produits de sante reproductive
============================================================== */
VIEWS["dsr-stock"] = () => {
  const crumbs = ["Santé Reproductive", "Stocks produits SR"];
  const et = `<div class="ph"><div class="ph-tag">Stocks SR · DSR</div><div class="ph-title">Stocks des produits de santé reproductive</div>`;
  if (!DSRP) return { crumbs, html: et + `<div class="ph-sub">Données DSR provinciales en cours de chargement.</div></div>` };
  const PRODS = [["stock_implant", "Implants (Implanon)"], ["stock_noristerat", "Injectables (Noristerat)"], ["stock_oxytocine", "Oxytocine injectable"]];
  if (!window.__dsrProd || !PRODS.some(([c]) => c === window.__dsrProd)) window.__dsrProd = "stock_oxytocine";
  const prod = window.__dsrProd;
  const lib = PRODS.find(([c]) => c === prod)[1];

  const valProv = {};
  let derPProv = null;
  const natSerie = {};
  Object.keys(PROV_CANON).forEach(id => {
    const s = (DSRP.provinces[PROV_CANON[id]] || {})[prod] || {};
    Object.keys(s).forEach(p => { if (s[p] != null) natSerie[p] = (natSerie[p] || 0) + s[p]; });
    const d = cidDerniere(s, DSRP.meta.mois_max);
    valProv[id] = d.v;
    if (d.p && (!derPProv || d.p > derPProv)) derPProv = d.p;
  });
  const dNat = cidDerniere(natSerie, DSRP.meta.mois_max);
  const prec = dNat.p ? natSerie[cidPrec(dNat.p)] : null;
  const delta = dNat.v != null && prec ? Math.round((dNat.v - prec) / prec * 100) : null;
  const aZero = Object.keys(valProv).filter(id => valProv[id] === 0);

  return { crumbs, html: et + `<div class="ph-sub">Stocks de fin de mois relevés par province dans DHIS2, sans consommation moyenne mensuelle disponible : le niveau se lit en tendance, pas en mois de stock.</div></div>
    <div class="content">
      ${cidChips(PRODS.map(([v, l]) => ({ v, l })), "__dsrProd", prod)}
      <div class="kpi-grid">
        ${kpi("Stock cumulé des provinces", dNat.v == null ? null : cidFmtNb(dNat.v), "unités", lib + " · " + (dNat.p ? cidMois(dNat.p) : "ND"), delta == null ? "" : (delta >= 0 ? "+" : "") + delta + "% vs mois précédent", delta == null ? "flat" : delta >= 0 ? "up" : "down", dNat.v == null ? "na" : "green")}
        ${kpi("Provinces renseignées", Object.values(valProv).filter(v => v != null).length, "/ 23", dNat.p ? cidMois(dNat.p) : "", "", "flat", "green")}
        ${kpi("Provinces à stock nul", aZero.length, "", aZero.length ? aZero.map(cidProvNom).slice(0, 3).join(", ") + (aZero.length > 3 ? "…" : "") : "aucune", "", "flat", aZero.length ? "orange" : "green")}
        ${kpi("Série disponible", cidMois(DSRP.meta.mois_min) + " · " + cidMois(DSRP.meta.mois_max), "", "avec référence 2025", "", "flat", "na")}
      </div>
      <div class="g-2-1">
        ${card("Stock par province · " + (derPProv ? cidMois(derPProv) : "ND"), "Teinte bleue selon le volume · gris ND",
          cidCarte(valProv, { couleur: cidEchelleVolume(valProv), format: v => v == null ? "ND" : cidFmtNb(v) + " unités" }), "Source : " + DSRP.meta.source)}
        ${card("Somme des provinces · 2026 contre 2025", lib, renderLineChart([
          { name: "2026", data: cidAnnee(natSerie, 2026), color: "#1F3864", style: "solid" },
          { name: "2025", data: cidAnnee(natSerie, 2025), color: "#A09A93", style: "dash" },
        ]), "Somme des stocks provinciaux déclarés, sensible aux provinces manquantes du mois.")}
      </div>
    </div>` };
};

/* ==============================================================
   PNT : en attente de source
============================================================== */
VIEWS["prog-tb"] = () => ({
  crumbs: ["Programmes verticaux", "PNLT · Tuberculose"],
  html: `
    <div class="ph"><div class="ph-tag">En attente de source</div><div class="ph-title">Tuberculose · détection et traitement</div>
    <div class="ph-sub">Notification, succès thérapeutique et co-infection TB et VIH.</div></div>
    <div class="content"><div class="attente-carte">

      <div class="attente-corps">

        <div class="attente-txt">Aucun export du PNT ne figure encore dans le dépôt Drive. La vue s'alimentera dès le dépôt du premier relevé trimestriel du programme.</div>
      </div>

});

/* ==============================================================
   EXPLORATEUR : comparateur de provinces avec zoom mensuel
============================================================== */
VIEWS["explor-comp"] = () => {
  const crumbs = ["Explorateur & alertes", "Comparateur de provinces"];
  const cat = cidCat();
  const et = `<div class="ph"><div class="ph-tag">Explorateur · CID</div><div class="ph-title">Comparateur de provinces</div>`;
  if (!cat.length) return { crumbs, html: et + `<div class="ph-sub">Catalogue en cours de chargement.</div></div>` };
  if (!window.__cmpInd || !cat.some(c => c.id === window.__cmpInd)) window.__cmpInd = cat.some(c => c.id === "dsr:cpn1") ? "dsr:cpn1" : cat[0].id;
  const ind = cat.find(c => c.id === window.__cmpInd);
  if (!window.__cmpProvs) window.__cmpProvs = ["NDJ", "LOO", "OUA"];
  const provs = window.__cmpProvs;
  const annee = window.__cmpAn || "2026";
  const zoom = window.__cmpMois || null;

  const groupes = {};
  cat.forEach(c => { (groupes[c.dom] = groupes[c.dom] || []).push(c); });
  const options = Object.keys(groupes).map(g =>
    `<optgroup label="${g}">` + groupes[g].map(c => `<option value="${c.id}" ${c.id === ind.id ? "selected" : ""}>${c.libelle}</option>`).join("") + `</optgroup>`
  ).join("");

  const provChips = PROVINCES.map(p =>
    `<button class="cid-chip mini ${provs.includes(p.id) ? "on" : ""}" onclick="(function(){const a=window.__cmpProvs;const i=a.indexOf('${p.id}');if(i>=0)a.splice(i,1);else{if(a.length>=4)a.shift();a.push('${p.id}');}renderMain();})()">${p.short}</button>`
  ).join("");

  const PALETTE = ["#1F3864", "#B4913C", "#8C4A5E", "#2E6B3F"];
  const series = provs.map((id, i) => ({
    name: cidProvNom(id), color: PALETTE[i % 4], style: "solid",
    data: cidAnnee(ind.serie(id) || {}, Number(annee))
  }));
  if (ind.natDispo) {
    const nat = ind.serie(null);
    if (nat) series.push({ name: "National", color: "#75706B", style: "dash", data: cidAnnee(nat, Number(annee)) });
  }
  const aDonnees = series.some(s => s.data.some(v => v != null));

  const lignesTable = provs.map(id => {
    const s = ind.serie(id) || {};
    return `<tr><td class="l">${cidProvNom(id)}</td>` + Array.from({ length: 12 }, (_, m) => {
      const p = `${annee}-${String(m + 1).padStart(2, "0")}`;
      return `<td class="num">${s[p] == null ? "ND" : cidFmtNb(Math.round(s[p] * 10) / 10)}</td>`;
    }).join("") + `</tr>`;
  }).join("");

  window.__cidCSV["comparateur"] = {
    entetes: ["indicateur", "province", "periode", "valeur"],
    lignes: provs.flatMap(id => {
      const s = ind.serie(id) || {};
      return Object.keys(s).sort().map(p => [ind.libelle, cidProvNom(id), p, s[p]]);
    })
  };

  let zoomHTML = "";
  if (zoom) {
    const p = `${annee}-${zoom}`;
    const toutes = PROVINCES.map(pr => ({ id: pr.id, v: (ind.serie(pr.id) || {})[p] != null ? (ind.serie(pr.id) || {})[p] : null }))
      .filter(x => x.v != null).sort((a, b) => b.v - a.v);
    zoomHTML = card("Zoom · " + cidMois(p), toutes.length + " provinces renseignées, classement décroissant · " + ind.libelle, toutes.length ? `
      <div class="cid-table-defile"><table class="dt"><thead><tr><th>Rang</th><th>Province</th><th style="text-align:right">${ind.unite}</th></tr></thead>
      <tbody>${toutes.map((x, i) => `<tr><td>${i + 1}</td><td class="l">${cidProvNom(x.id)}</td><td class="num">${cidFmtNb(Math.round(x.v * 10) / 10)}</td></tr>`).join("")}</tbody></table></div>`
      : '<div class="cid-res-note">Aucune province renseignée pour ce mois.</div>', "");
  }

  return { crumbs, html: et + `<div class="ph-sub">Jusqu'à quatre provinces superposées sur une série mensuelle, avec la référence nationale quand la source la porte. Le zoom mensuel classe les 23 provinces sur le mois choisi.</div></div>
    <div class="content">
      <div class="cid-outils">
        <select class="cid-select" onchange="window.__cmpInd=this.value;window.__cmpMois=null;renderMain()">${options}</select>
        ${cidChips([{ v: "2026", l: "2026" }, { v: "2025", l: "2025" }], "__cmpAn", annee)}
      </div>
      <div class="cid-provs">${provChips}</div>
      ${card(ind.libelle + " · " + annee, "Source : " + ind.src + " · unité : " + ind.unite,
        aDonnees ? renderLineChart(series) : '<div class="cid-res-note">Aucune valeur pour cette année sur les provinces choisies. La couverture varie selon la source.</div>', "")}
      ${cidChips([{ v: "", l: "sans zoom" }].concat(Array.from({ length: 12 }, (_, m) => ({ v: String(m + 1).padStart(2, "0"), l: CID_MOIS_C[m] }))), "__cmpMois", zoom || "")}
      ${zoomHTML}
      ${card("Valeurs mensuelles · " + annee, "ND pour toute valeur absente de la source", `
        <div class="cid-table-defile"><table class="dt"><thead><tr><th>Province</th>${CID_MOIS_C.map(m => `<th style="text-align:right">${m}</th>`).join("")}</tr></thead>
        <tbody>${lignesTable}</tbody></table></div>
        <div style="margin-top:10px">${cidBoutonCSV("comparateur", "comparateur_cid.csv")}</div>`, "")}
    </div>` };
};

/* ==============================================================
   EXPLORATEUR : registre des alertes
============================================================== */
VIEWS["explor-alert"] = () => {
  const crumbs = ["Explorateur & alertes", "Alertes actives"];
  const A = cidAlertes();
  const filtre = window.__alFiltre || "toutes";
  const doms = ["toutes"].concat(Array.from(new Set(A.map(a => a.dom))));
  const visibles = filtre === "toutes" ? A : A.filter(a => a.dom === filtre);
  const compte = { rouge: A.filter(a => a.niv === "rouge").length, orange: A.filter(a => a.niv === "orange").length, jaune: A.filter(a => a.niv === "jaune").length };
  window.__cidCSV["alertes"] = { entetes: ["niveau", "domaine", "alerte", "detail", "periode"], lignes: A.map(a => [a.niv, a.dom, a.txt, a.det, a.periode || ""]) };

  const items = visibles.map(a => `
    <div class="cid-al-carte ${a.niv}">
      <div class="cid-al-carte-tete">${cidPastille(a.niv)}<span class="cid-al-dom">${a.dom}</span><span class="cid-al-per">${a.periode ? cidMoisC(String(a.periode).slice(0, 7)) : ""}</span></div>
      <div class="cid-al-titre">${a.txt}</div>
      <div class="cid-al-det">${a.det}</div>
      <button class="cid-lien" onclick="selectSub('${a.prog}','${a.sub}')">ouvrir la vue de détail →</button>
    </div>`).join("");

  return { crumbs, html: `
    <div class="ph"><div class="ph-tag">Alertes · CID</div><div class="ph-title">Registre des alertes actives</div>
    <div class="ph-sub">Chaque alerte est recalculée à l'ouverture du tableau de bord depuis les valeurs présentes dans les sources, avec sa règle, sa période de référence et sa vue de détail. Aucune alerte n'est saisie à la main.</div></div>
    <div class="content">
      <div class="kpi-grid">
        ${kpi("Alertes rouges", compte.rouge, "", "seuil critique franchi", "", "flat", compte.rouge ? "red" : "green")}
        ${kpi("Alertes orange", compte.orange, "", "écart marqué à la cible", "", "flat", compte.orange ? "orange" : "green")}
        ${kpi("Signaux jaunes", compte.jaune, "", "qualité ou continuité des données", "", "flat", compte.jaune ? "yellow" : "green")}
        ${kpi("Règles évaluées", 12, "", "sur les sources chargées", "", "flat", "na")}
      </div>
      ${cidChips(doms.map(d => ({ v: d, l: d })), "__alFiltre", filtre)}
      <div class="cid-al-grille">${items || '<div class="cid-res-note">Aucune alerte sur ce filtre.</div>'}</div>
      <div style="margin-top:12px">${cidBoutonCSV("alertes", "alertes_cid.csv")}</div>
    </div>` };
};

/* ==============================================================
   EXPLORATEUR : recherche transversale et export
============================================================== */
VIEWS["explor-rech"] = () => {
  const crumbs = ["Explorateur & alertes", "Recherche & export"];
  const q = (window.__rechQ || "").trim();
  const cat = cidCat();
  let indicateurs = [], fosa = [];
  if (q.length >= 2) {
    const qn = q.toLowerCase();
    indicateurs = cat.filter(c => (c.libelle + " " + c.dom + " " + c.src).toLowerCase().includes(qn)).slice(0, 40);
    if (FOSAR) {
      Object.keys(FOSAR.provinces).forEach(prov => {
        const ds = FOSAR.provinces[prov].districts;
        Object.keys(ds).forEach(dist => ds[dist].forEach(f => {
          if (f.toLowerCase().includes(qn) || dist.toLowerCase().includes(qn)) fosa.push([prov, dist, f]);
        }));
      });
    }
  }
  window.__cidCSV["recherche"] = { entetes: ["type", "domaine_ou_province", "libelle", "complement"], lignes:
    indicateurs.map(c => ["indicateur", c.dom, c.libelle, c.src]).concat(fosa.map(f => ["fosa", f[0], f[2], f[1]])) };

  const lignesInd = indicateurs.map(c => `<tr><td class="l">${c.libelle}</td><td>${c.dom}</td><td>${c.unite}</td>
    <td><button class="cid-lien" onclick="window.__cmpInd='${c.id}';selectSub('explor','explor-comp')">comparer →</button></td></tr>`).join("");
  const lignesFosa = fosa.slice(0, 60).map(f => `<tr><td>${f[0]}</td><td>${f[1]}</td><td class="l">${f[2]}</td></tr>`).join("");

  return { crumbs, html: `
    <div class="ph"><div class="ph-tag">Recherche · CID</div><div class="ph-title">Recherche transversale</div>
    <div class="ph-sub">Une seule recherche couvre le catalogue des indicateurs branchés et le répertoire des ${FOSAR ? cidFmtNb(FOSAR.meta.n_fosa) : ""} formations sanitaires, avec export CSV des résultats.</div></div>
    <div class="content">
      <div class="cid-recherche large">
        <input id="cid-rech-q" class="cid-input" type="text" placeholder="Indicateur, maladie, produit, FOSA, district…" value="${q.replace(/"/g, "&quot;")}"
          onkeydown="if(event.key==='Enter'){window.__rechQ=this.value;renderMain();}">
        <button class="cid-btn-csv" onclick="window.__rechQ=document.getElementById('cid-rech-q').value;renderMain()">Rechercher</button>
      </div>
      ${q.length < 2 ? '<div class="cid-res-note">Saisir au moins deux caractères. Exemples : rougeole, oxytocine, complétude, Karal.</div>' : `
        ${card("Indicateurs · " + indicateurs.length + " résultat" + (indicateurs.length > 1 ? "s" : ""), "Chaque résultat s'ouvre dans le comparateur de provinces", indicateurs.length ? `
          <table class="dt"><thead><tr><th>Indicateur</th><th>Domaine</th><th>Unité</th><th></th></tr></thead><tbody>${lignesInd}</tbody></table>` : '<div class="cid-res-note">Aucun indicateur ne répond à cette recherche.</div>', "")}
        ${card("Formations sanitaires · " + cidFmtNb(fosa.length) + " résultat" + (fosa.length > 1 ? "s" : ""), fosa.length > 60 ? "60 affichés, export complet disponible" : "", fosa.length ? `
          <div class="cid-table-defile"><table class="dt"><thead><tr><th>Province</th><th>District</th><th>Formation sanitaire</th></tr></thead><tbody>${lignesFosa}</tbody></table></div>` : '<div class="cid-res-note">Aucune formation sanitaire ne répond à cette recherche.</div>', "")}
        <div>${cidBoutonCSV("recherche", "recherche_cid.csv")}</div>`}
    </div>` };
};

</script>
</body>
