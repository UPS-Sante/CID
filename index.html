/* ==============================================================
   MAP — Size / Zoom / Pan interactive controls
============================================================== */
function currentMapViewBox() {
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bx = parts[0], by = parts[1], bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const cx = bx + bw / 2 + state.mapPanX;
  const cy = by + bh / 2 + state.mapPanY;
  return `${(cx - w / 2).toFixed(1)} ${(cy - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`;
}

function clampMapPan() {
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const maxX = (bw - w) / 2;
  const maxY = (bh - h) / 2;
  state.mapPanX = Math.max(-maxX, Math.min(maxX, state.mapPanX));
  state.mapPanY = Math.max(-maxY, Math.min(maxY, state.mapPanY));
}

function applyMapView() {
  const vb = currentMapViewBox();
  document.querySelectorAll('.map-svg').forEach(svg => svg.setAttribute('viewBox', vb));
  document.querySelectorAll('.map-svg-wrap').forEach(w => w.setAttribute('data-size', state.mapSize));
  document.querySelectorAll('.map-tb-zoom-pct').forEach(z => {
    z.textContent = Math.round(state.mapZoom * 100) + '%';
  });
  document.querySelectorAll('[data-map-size-btn]').forEach(b => {
    b.classList.toggle('on', b.dataset.mapSizeBtn === state.mapSize);
  });
  document.querySelectorAll('[data-map-zoom="out"]').forEach(b => b.disabled = state.mapZoom <= 1.001);
  document.querySelectorAll('[data-map-zoom="in"]').forEach(b => b.disabled = state.mapZoom >= 7.999);
  document.querySelectorAll('[data-map-zoom="reset"]').forEach(b => {
    b.disabled = state.mapZoom === 1 && state.mapPanX === 0 && state.mapPanY === 0;
  });
}

function setMapSize(s) {
  state.mapSize = s;
  applyMapView();
}

function mapZoomIn() {
  state.mapZoom = Math.min(state.mapZoom * 1.4, 8);
  clampMapPan();
  applyMapView();
}

function mapZoomOut() {
  state.mapZoom = Math.max(state.mapZoom / 1.4, 1);
  if (state.mapZoom <= 1.001) {
    state.mapZoom = 1;
    state.mapPanX = 0;
    state.mapPanY = 0;
  }
  clampMapPan();
  applyMapView();
}

function mapZoomReset() {
  state.mapZoom = 1;
  state.mapPanX = 0;
  state.mapPanY = 0;
  applyMapView();
}

function mapZoomTowards(svg, px, py, factor) {
  // px, py ∈ [0,1] within the svg rect
  const parts = MAP_VIEWBOX.split(' ').map(Number);
  const bx = parts[0], by = parts[1], bw = parts[2], bh = parts[3];
  const w = bw / state.mapZoom;
  const h = bh / state.mapZoom;
  const cx = bx + bw / 2 + state.mapPanX;
  const cy = by + bh / 2 + state.mapPanY;
  const ptX = cx - w / 2 + px * w;
  const ptY = cy - h / 2 + py * h;
  const newZoom = Math.max(1, Math.min(8, state.mapZoom * factor));
  if (newZoom === state.mapZoom) return;
  state.mapZoom = newZoom;
  const newW = bw / state.mapZoom;
  const newH = bh / state.mapZoom;
  const newCx = ptX - (px - 0.5) * newW;
  const newCy = ptY - (py - 0.5) * newH;
  state.mapPanX = newCx - (bx + bw / 2);
  state.mapPanY = newCy - (by + bh / 2);
  clampMapPan();
  applyMapView();
}

function setupScrollableTabs() {
  // Generic horizontal-scroll affordance: posts data-overflow-left/right on the element
  // so CSS can show edge-fade hints, and auto-scrolls active items into view.
  const targets = [
    { selector: '.pda-tabs', activeSel: '.pda-tab.on' },
    { selector: '.card-body table', activeSel: null },
  ];
  targets.forEach(({ selector, activeSel }) => {
    document.querySelectorAll(selector).forEach(el => {
      const update = () => {
        const overR = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
        const overL = el.scrollLeft > 1;
        el.setAttribute('data-overflow-right', overR ? 'true' : 'false');
        el.setAttribute('data-overflow-left',  overL ? 'true' : 'false');
      };
      update();
      if (!el.__scrollBound) {
        el.__scrollBound = true;
        el.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', update, { passive: true });
      }
      // Auto-scroll active item into view (tabs only — tables don't have one)
      if (activeSel) {
        const active = el.querySelector(activeSel);
        if (active) {
          const aRect = active.getBoundingClientRect();
          const eRect = el.getBoundingClientRect();
          if (aRect.left < eRect.left || aRect.right > eRect.right) {
            const target = active.offsetLeft - (el.clientWidth - active.offsetWidth) / 2;
            el.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
          }
        }
      }
      requestAnimationFrame(update);
    });
  });
}

function setupMapInteractions() {
  document.querySelectorAll('.map-svg').forEach(svg => {
    if (svg.__interactiveBound) return;
    svg.__interactiveBound = true;

    const pointers = new Map();   // id → {x,y}
    let lastPinchDist = null;
    let dragStart = null;          // {x,y,panX,panY}
    let moved = false;
    let suppressNextClick = false;

    svg.addEventListener('pointerdown', (e) => {
      // mouse: only left button starts a pan/click; touch & pen always pass
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
      if (pointers.size === 1) {
        dragStart = { x: e.clientX, y: e.clientY, panX: state.mapPanX, panY: state.mapPanY };
        moved = false;
      } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        dragStart = null; // pinch overrides pan
      }
    });

    svg.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2 && lastPinchDist) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (dist > 0) {
          const factor = dist / lastPinchDist;
          const rect = svg.getBoundingClientRect();
          const mx = (pts[0].x + pts[1].x) / 2;
          const my = (pts[0].y + pts[1].y) / 2;
          mapZoomTowards(svg, (mx - rect.left) / rect.width, (my - rect.top) / rect.height, factor);
          lastPinchDist = dist;
          moved = true;
        }
        return;
      }

      if (pointers.size === 1 && dragStart) {
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
          moved = true;
          svg.classList.add('is-panning');
        }
        if (moved) {
          const rect = svg.getBoundingClientRect();
          const parts = MAP_VIEWBOX.split(' ').map(Number);
          const bw = parts[2], bh = parts[3];
          const scaleX = (bw / state.mapZoom) / rect.width;
          const scaleY = (bh / state.mapZoom) / rect.height;
          state.mapPanX = dragStart.panX - dx * scaleX;
          state.mapPanY = dragStart.panY - dy * scaleY;
          clampMapPan();
          svg.setAttribute('viewBox', currentMapViewBox());
        }
      }
    });

    const endPointer = (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
      if (pointers.size < 2) lastPinchDist = null;
      if (pointers.size === 0) {
        svg.classList.remove('is-panning');
        if (moved) {
          suppressNextClick = true;
          // Update zoom pct + button disabled states once pan ends
          applyMapView();
        }
        dragStart = null;
      }
    };
    svg.addEventListener('pointerup', endPointer);
    svg.addEventListener('pointercancel', endPointer);
    svg.addEventListener('pointerleave', (e) => {
      if (pointers.size === 0) { dragStart = null; svg.classList.remove('is-panning'); }
    });

    // Block click that follows a pan-drag, to keep province selection unambiguous
    svg.addEventListener('click', (e) => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    // Wheel zoom (desktop). passive:false so we can preventDefault and avoid page scroll
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.85 : 1.18;
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width;
      const py = (e.clientY - rect.top) / rect.height;
      mapZoomTowards(svg, px, py, factor);
    }, { passive: false });
  });
}

// Mini sparkline for executive KPI
function miniSpark(data, color = "#1E40AF") {
  data = (data || []).filter(v => Number.isFinite(v));
  if (data.length < 2) return '';
  const w = 140, h = 32;
  const max = Math.max(...data) * 1.08;
  const min = Math.min(...data) * 0.92;
  const range = max - min || 1;
  const xStep = w / (data.length - 1);
  const points = data.map((v, i) => {
    const x = i * xStep;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const linePts = points.join(" ");
  const areaPts = points.join(" ") + ` ${w},${h} 0,${h}`;
  const lastX = (data.length - 1) * xStep;
  const lastY = h - ((data[data.length - 1] - min) / range) * h;
  return `
    <svg class="mini-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="${areaPts}" fill="${color}" opacity="0.08"/>
      <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.8" fill="${color}" stroke="white" stroke-width="1.2"/>
    </svg>
  `;
}

// Executive KPI card
function kpiExec(opts) {
  let { n, label, category, value, unit, target, trend, trendDir, rag, source, sparkData, sparkColor, action } = opts;
  if (value == null || String(value).includes("NaN")) { value = "ND"; trend = "—"; trendDir = "flat"; rag = "na"; }
  return `
    <div class="kpi-exec rag-${rag}">
      <div class="kpe-head">
        <div class="kpe-num">${n}</div>
        <div class="kpe-title">
          <div class="kpe-label">${label}</div>
          <div class="kpe-cat">${category}</div>
        </div>
        <span class="pill ${rag} kpe-status">${ragLabel(rag)}</span>
      </div>
      <div class="kpe-body">
        <div class="kpe-value-block">
          <div class="kpe-value">
            <span class="kpe-num-big">${value}</span>
            <span class="kpe-unit">${unit}</span>
          </div>
          <div class="kpe-meta">
            <span class="kpe-target">${t("target")} : <strong>${target}${unit || ""}</strong></span>
            <span class="kpe-trend ${trendDir}">${trend} <span class="kpe-trend-lbl">${t("trend_vs")}</span></span>
          </div>
        </div>
        <div class="kpe-spark-block">
          ${miniSpark(sparkData || [], sparkColor || "#1E40AF")}
          <div class="kpe-spark-lbl">${t("twelve_months")}</div>
        </div>
      </div>
      ${action ? `<div class="kpe-action"><span>${action}</span></div>` : ''}
      <div class="kpe-source">${t("source")} : ${source}</div>
    </div>
  `;
}

function renderPdaDomain(domId) {
  const dom = PDA_DOMAINS.find(d => d.id === domId);
  const indicators = PDA_IND[domId] || [];
  const focusedProv = state.provinceFilter && PDA_PROVINCES.includes(state.provinceFilter) ? state.provinceFilter : null;

  // Generate value per indicator × province (always PDA_PROVINCES only)
  const valByProvince = {};
  PDA_PROVINCES.forEach(pId => {
    valByProvince[pId] = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, pId)
    }));
  });

  // PDA-only aggregation: 1 focused province or 3 PDA provinces (never 23 extrapolation)
  let indAverages;
  if (focusedProv) {
    indAverages = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, focusedProv)
    }));
  } else {
    indAverages = indicators.map(ind => {
      let sum = 0;
      PDA_PROVINCES.forEach(pId => { sum += genValue("pda-" + ind.id, pId); });
      return { ...ind, val: Math.round(sum / PDA_PROVINCES.length) };
    });
  }

  const domAvg = Math.round(indAverages.reduce((a,i) => a+i.val, 0) / indAverages.length);

  const meetTarget = indAverages.filter(i => i.obj ? (i.dir === "gte" ? i.val >= i.obj : i.val <= i.obj) : false).length;
  const meetRatio = meetTarget / indicators.length;
  const meetRag = meetRatio >= 0.7 ? "green" : meetRatio >= 0.5 ? "yellow" : meetRatio >= 0.3 ? "orange" : "red";

  const scopeLabel = focusedProv
    ? `Focus ${PROVINCES.find(p => p.id === focusedProv).name}`
    : `Moyenne 13 provinces pilotes PDA`;

  return `
    <div class="kpi-grid">
      ${kpi(`Score ${domId}${focusedProv ? ' · ' + PROVINCES.find(p=>p.id===focusedProv).short : ''}`, domAvg, "%", "Cible : 80%", "", "flat", rag(domAvg, 80))}
      ${kpi("Indicateurs suivis", String(indicators.length), "", "Tous mis à jour", "", "flat", "green")}
      ${kpi("Provinces couvertes", focusedProv ? "1" : "13", "/13 PDA", "Pilote · Vague 1", "", "flat", "yellow")}
      ${kpi("Indicateurs ≥ cible", String(meetTarget) + "/" + indicators.length, "", "Performance T1", "", "flat", meetRag)}
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div class="card-hdr">
        <div>
          <div class="card-title">${dom.icon} Domaine ${dom.code} — ${dom.label}</div>
          <div class="card-sub">Performance par indicateur · ${scopeLabel}</div>
        </div>
      </div>
      <div class="card-body">
        ${renderBars(indAverages.map(ind => ({
          label: ind.l.substring(0,30),
          val: ind.val,
          target: ind.obj,
          rag: ind.obj ? rag(ind.val, ind.obj, ind.dir === "lte") : "yellow",
          showVal: ind.val + "%",
          max: 100
        })))}
      </div>
      <div class="card-foot">Cible : variable selon indicateur · Source : DHIS2 / Rapports DSP / SIGL · 13 provinces PDA uniquement</div>
    </div>

    <div class="g-2-1">
      ${card(`Comparaison 13 provinces PDA — ${domId}`, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} mise en évidence` : "Score domaine par province", `
        <table class="dt">
          <thead><tr><th>Indicateur</th>${PDA_PROVINCES.map(p => {
            const isFocus = focusedProv === p;
            return `<th style="text-align:right;${isFocus?'background:var(--gold-tint);color:var(--gold-d);':''}">${p}${isFocus?' (focus)':''}</th>`;
          }).join("")}<th style="text-align:right">Moy.</th></tr></thead>
          <tbody>
            ${indicators.map(ind => {
              const vals = PDA_PROVINCES.map(pId => valByProvince[pId].find(i => i.id === ind.id).val);
              const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
              return `<tr>
                <td class="l">${ind.l}</td>
                ${vals.map((v, idx) => {
                  const pId = PDA_PROVINCES[idx];
                  const isFocus = focusedProv === pId;
                  const r = ind.obj ? rag(v, ind.obj, ind.dir === "lte") : "yellow";
                  return `<td class="num" style="${isFocus?'background:var(--gold-tint);':''}"><span class="pill ${r}" style="min-width:42px;text-align:center;">${v == null ? "ND" : v + "%"}</span></td>`;
                }).join("")}
                <td class="num"><strong>${Number.isFinite(avg) ? avg + "%" : "ND"}</strong></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `, "")}

      ${card("Cartographie " + domId, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} sélectionnée` : "13 provinces pilotes PDA", renderMap("pda-" + domId, { pdaFocus: true }), "")}
    </div>

    ${aiBox(
      `Analyse du domaine ${domId} — ${dom.label}`,
      domainNarrative(domId, domAvg, indAverages),
      "Source : DHIS2 + DSP · Triangulation J+5 · 13 provinces PDA · Période : " + periodLabel()
    )}
  `;
}

function domainNarrative(domId, avg, inds) {
  const narratives = {
    D1: `La <strong>gouvernance financière du PDA</strong> atteint ${avg}% sur la période. Les revues semestrielles et trimestrielles sont en bonne voie, mais les <strong>pièces justificatives validées</strong> restent un goulet d'étranglement (impact sur tranches T2). Recommandation : <strong>renforcer la cellule de gestion financière au niveau DLMVSE</strong>.`,
    D2: `Les <strong>offres de services PEV</strong> progressent (${avg}%). La <strong>couverture Penta 3</strong> reste sous-optimale en zone sahélienne. Les <strong>stratégies avancées mobiles</strong> ont prouvé leur efficacité. Recommandation : <strong>passer de 16 à 32 équipes mobiles dès T2</strong> sur les 13 provinces.`,
    D3: `La <strong>surveillance épidémiologique</strong> est globalement fonctionnelle (${avg}%). Le suivi PFA reste perfectible. <strong>Notification méningite à temps</strong> à risque sur Tibesti. Action : <strong>renforcer le COUSP provincial</strong>.`,
    D4: `Les <strong>causeries éducatives</strong> sont sous-réalisées (${avg}%). Le levier communautaire reste le maillon faible. Recommandation : <strong>intégrer la communication PEV dans le plan annuel des ASC</strong>.`,
    D5: `La <strong>chaîne du froid et la logistique</strong> reste un point d'attention majeur (${avg}%). Ruptures d'antigènes persistantes au Lac. <strong>43% des pannes liées aux équipements à gaz</strong>. Recommandation : <strong>accélérer la transition solaire</strong> (PRSS-II / Banque Mondiale).`,
    D6: `La <strong>gestion des données</strong> est correcte (${avg}%). La complétude DHIS2 dépasse 90%. Le <strong>DQS et LQAS</strong> doivent être systématisés au niveau district. Recommandation : <strong>programmer 1 DQS semestriel par district PDA</strong>.`,
    D7: `Le <strong>renforcement des capacités</strong> atteint ${avg}%. Les agents formés DHIS2 et vaccination sont en progrès. Recommandation : <strong>maintenir le rythme de supervisions formatives</strong> et intégrer les ASC dans le cursus.`,
  };
  return narratives[domId] || `Score moyen du domaine : ${avg}%. Analyse détaillée à venir.`;
}

function kpi(label, val, unit, target, trend, dir, ragClass, inverse = false) {
  if (val == null || String(val).includes("NaN")) { val = "ND"; trend = "—"; dir = "flat"; ragClass = "na"; }
  const ndTitre = val === "ND" ? ' title="Donnée non disponible pour la période sélectionnée"' : '';
  const trendCls = dir === "up" ? "up" : dir === "down" ? "down" : "flat";
  return `
    <div class="kpi ${ragClass}"${ndTitre}>
      <div class="kpi-head">
        <div class="kpi-label">${label}</div>
      </div>
      <div class="kpi-val-row">
        <div class="kpi-value">${val}</div>
        <div class="kpi-unit">${unit}</div>
      </div>
      <div class="kpi-meta">
        <div class="kpi-target">${target}</div>
        <div class="kpi-trend ${trendCls} ${inverse ? 'inverse' : ''}">${trend}</div>
      </div>
    </div>
  `;
}

function card(title, subtitle, body, footer) {
  return `
    <div class="card">
      <div class="card-hdr">
        <div>
          <div class="card-title">${title}</div>
          <div class="card-sub">${subtitle || ''}</div>
        </div>
      </div>
      <div class="card-body">${body}</div>
      ${footer ? `<div class="card-foot">${footer}</div>` : ''}
    </div>
  `;
}

function renderBars(bars) {
  return `<div class="bar-list">
    ${bars.map(b => {
      const max = b.max || 100;
      const manque = !Number.isFinite(b.val);
      const pct = manque ? 0 : Math.min(100, (b.val / max) * 100);
      const targetPct = b.target ? Math.min(100, (b.target / max) * 100) : null;
      const ragCls = b.rag || "navy";
      return `
        <div class="bar-row">
          <div class="bar-label">${b.label}</div>
          <div class="bar-track">
            <div class="bar-fill ${ragCls}" data-w="${pct}" style="width:0%;"></div>
            ${targetPct ? `<div class="bar-target" style="left:${targetPct}%;"></div>` : ''}
          </div>
          <div class="bar-val ${ragCls}">${manque ? "ND" : (b.showVal || b.val + '%')}</div>
        </div>
      `;
    }).join("")}
  </div>`;
}

function renderLineChart(series, opts = {}) {
  const w = 480, h = 200, p = { t:18, r:16, b:28, l:34 };
  series = series.map(s => ({ ...s, pts: s.data.map((v, i) => ({ v, i })).filter(p => Number.isFinite(p.v)) }));
  const allData = series.flatMap(s => s.pts.map(p => p.v));
  if (!allData.length) return '<div style="padding:24px;color:#94A3B8;text-align:center;">ND</div>';
  const min = Math.min(...allData);
  const max = Math.max(...allData);
  const range = max - min || 1;
  const padding = range * 0.1;
  const yMin = Math.max(0, min - padding);
  const yMax = max + padding;
  const yRange = yMax - yMin;
  const innerW = w - p.l - p.r;
  const innerH = h - p.t - p.b;
  const xStep = innerW / (series[0].data.length - 1);

  const months = opts.labels || ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  const lines = series.map((s, idx) => {
    const path = s.pts.map((pt, k) => {
      const x = p.l + pt.i * xStep;
      const y = p.t + innerH - ((pt.v - yMin) / yRange) * innerH;
      return `${k === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(" ");

    // Area fill (only for solid lines)
    const areaPath = (s.style !== 'dashed' && s.pts.length) ? path + ` L ${p.l + s.pts[s.pts.length-1].i * xStep} ${p.t + innerH} L ${p.l + s.pts[0].i * xStep} ${p.t + innerH} Z` : '';

    const dots = s.style === 'dashed' ? '' : s.pts.map((pt) => {
      const x = p.l + pt.i * xStep;
      const y = p.t + innerH - ((pt.v - yMin) / yRange) * innerH;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${s.color}" stroke="white" stroke-width="1"/>`;
    }).join("");
    return {
      path, areaPath, dots,
      name: s.name, color: s.color,
      style: s.style || 'solid',
      opacity: s.opacity || 1
    };
  });

  const yTicks = 4;
  const grid = [];
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (yRange * i / yTicks);
    const y = p.t + innerH - (innerH * i / yTicks);
    grid.push(`<line x1="${p.l}" y1="${y.toFixed(1)}" x2="${w-p.r}" y2="${y.toFixed(1)}" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2 3"/>`);
    grid.push(`<text x="${p.l-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono">${Math.round(v)}</text>`);
  }

  const xLabels = months.map((m, i) => {
    if (i % 2 !== 0 && i !== months.length - 1) return '';
    const x = p.l + i * xStep;
    return `<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" fill="#94A3B8" text-anchor="middle">${m}</text>`;
  }).join("");

  // Areas (rendered first, behind lines)
  const areas = lines.filter(l => l.style !== 'dashed').map((l, idx) =>
    `<path d="${l.areaPath}" fill="${l.color}" opacity="${l.style === 'dashed' ? 0.04 : 0.08}"/>`
  ).join("");

  return `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${grid.join("")}
      ${xLabels}
      ${areas}
      ${lines.map(l => `
        <path d="${l.path}"
          stroke="${l.color}"
          stroke-width="${l.style === 'dashed' ? 1.5 : 2.2}"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="${l.opacity}"
          ${l.style === 'dashed' ? 'stroke-dasharray="4 3"' : ''}
        />
      `).join("")}
      ${lines.map(l => l.dots).join("")}
    </svg>
    <div class="chart-legend">
      ${lines.map(l => `
        <div class="cl-item">
          <span class="cl-mark" style="background:${l.color}; ${l.style === 'dashed' ? 'border:1px dashed '+l.color+'; background:transparent; height:0;' : ''}; opacity:${l.opacity}"></span>${l.name}
        </div>
      `).join("")}
    </div>
    <div class="chart-values-wrap">
      <button class="chart-values-toggle" onclick="this.parentElement.classList.toggle('cache')">Afficher / masquer les valeurs</button>
      <table class="chart-values">
        <tr><th></th>${months.map(m => `<td><strong>${m}</strong></td>`).join("")}</tr>
        ${series.map(s => `<tr><th>${s.name}</th>${s.data.map(v => `<td>${v == null || !Number.isFinite(v) ? "—" : v}</td>`).join("")}</tr>`).join("")}
      </table>
    </div>
  `;
}

// Helper to build YoY chart series (current year solid + N-1 dashed)
function yoySeriesData(metric, scope = "national") {
  const annee = state.periodYear;
  const serieAnnee = (a) => Array.from({ length: 12 }, (_, i) => {
    const periode = `${a}-${String(i + 1).padStart(2, "0")}`;
    if (state.provinceFilter) return valeurPeriodeExplicite(metric, state.provinceFilter, periode);
    if (scope === "pda") {
      const vals = PDA_PROVINCES.map(p => valeurPeriodeExplicite(metric, p, periode)).filter(v => v != null);
      return vals.length ? Math.round(vals.reduce((x, y) => x + y, 0) / vals.length * 10) / 10 : null;
    }
    return valeurNatPeriode(metric, periode);
  });
  const series = [{ name: `Année ${annee}`, data: serieAnnee(annee), color: "#1E40AF", style: "solid", opacity: 1 }];
  [[annee - 1, "#94A3B8"], [annee - 2, "#CBD5E1"]].forEach(([a, c]) => {
    const d = serieAnnee(a);
    if (d.some(v => v != null)) series.push({ name: `Année ${a}`, data: d, color: c, style: "dashed", opacity: 0.9 });
  });
  return series;
}

function renderMap(metric, opts = {}) {
  const inverse = opts.inverse || false;
  const isVolume = opts.isVolume || metric === "zd-volume";
  const pdaFocus = opts.pdaFocus || (state.sub === "vacc-pda");
  const valMap = provincesValueMap(metric);

  function getRag(val) {
    if (val == null || Number.isNaN(val)) return "na";
    const abs = SEUILS.par_metrique && SEUILS.par_metrique[metric];
    if (abs) return (opts.inverse
      ? (val <= abs.vert ? "green" : val <= abs.jaune ? "yellow" : val <= abs.orange ? "orange" : "red")
      : (val >= abs.vert ? "green" : val >= abs.jaune ? "yellow" : val >= abs.orange ? "orange" : "red"));
    if (isVolume) {
      if (val <= 2500) return "green";
      if (val <= 4500) return "yellow";
      if (val <= 6500) return "orange";
      return "red";
    }
    if (inverse || metric === "rupture" || metric === "abandon" || metric === "perim") {
      if (val <= 30) return "green";
      if (val <= 50) return "yellow";
      if (val <= 70) return "orange";
      return "red";
    }
    if (val >= 80) return "green";
    if (val >= 60) return "yellow";
    if (val >= 40) return "orange";
    return "red";
  }

  function dispVal(v) {
    if (isVolume) return fmt(v);
    return v + "%";
  }

  // Tiny provinces — labels shrink to avoid overflow
  const TINY_PROV = new Set(["NDJ", "LAC", "MKO", "MKE", "LOO", "LOE", "HDL"]);
  // Ultra-short labels for tiny provinces (override p.short to fit inside polygon)
  const TINY_LABEL = {
    "NDJ": "NDJ",
    "HDL": "Hadjer-L.",
    "MKO": "MK-O",
    "MKE": "MK-E",
    "LOO": "Log-O",
    "LOE": "Log-E",
    "LAC": "Lac",
  };
  // Provinces where the geographic centroid sits poorly (lake, holes, irregular shape)
  // Fine-tuned label offsets in SVG coords (dx, dy)
  const LABEL_NUDGE = {
    "LAC": { dx: 4, dy: -2 },
    "NDJ": { dx: 0, dy: 4 },
    "HDL": { dx: 8, dy: 0 },
    "MKO": { dx: -2, dy: 0 },
    "MKE": { dx: 0, dy: 0 },
    "LOO": { dx: 0, dy: 0 },
    "LOE": { dx: 0, dy: 2 },
  };

  // Build SVG paths and labels for each province
  const paths = [];
  const labels = [];
  PROVINCES.forEach(p => {
    const geo = PROVINCE_PATHS[p.id];
    if (!geo) return;
    const val = valMap[p.id];
    const r = getRag(val);
    const isPda = PDA_PROVINCES.includes(p.id);
    const isSelected = state.provinceFilter === p.id;

    let cls = "map-prov";
    let inlineStyle = "";
    let darkText = false;

    if (state.mapMode === "zones") {
      const zone = ZONES[PROV_ZONE[p.id]];
      inlineStyle = ` style="fill:${zone.color}"`;
      darkText = zone.textDark;
    } else {
      cls += ` rag-${r}`;
      darkText = (r === "yellow");
    }
    if (pdaFocus && !isPda) cls += " dim";
    if (pdaFocus && isPda) cls += " pda-active";
    if (isSelected) cls += " selected";

    const titleTxt = `${p.name} — ${dispVal(val)} · ${ZONES[PROV_ZONE[p.id]].name}${isPda ? ' · PDA' : ''}`;

    paths.push(`<path class="${cls}"${inlineStyle} d="${geo.d}"
      onclick="showProvInfo('${p.id}', '${metric}', ${isVolume}); setProvinceFilter('${p.id}')"><title>${titleTxt}</title></path>`);

    // Label group
    const nudge = LABEL_NUDGE[p.id] || { dx: 0, dy: 0 };
    const cx = geo.cx + nudge.dx;
    const cy = geo.cy + nudge.dy;
    const isTiny = TINY_PROV.has(p.id);
    const lblName = isTiny && TINY_LABEL[p.id] ? TINY_LABEL[p.id] : p.short;
    const dim = (pdaFocus && !isPda) ? ' opacity="0.45"' : '';
    const labelCls = "map-label" + (isTiny ? " tiny" : "");
    const txtCls = "map-label-name" + (darkText ? " dark" : "");
    const valCls = "map-label-val" + (darkText ? " dark" : "");
    // PDA marker — small dot offset to the upper-right of the label
    const pdaR = isTiny ? 2.6 : 3.4;
    const pdaDx = isTiny ? 12 : 16;
    const pdaDy = isTiny ? 6 : 8;
    const pdaDot = isPda ? `<circle class="map-pda-marker" cx="${cx + pdaDx}" cy="${cy - pdaDy}" r="${pdaR}"/>` : "";

    labels.push(`<g class="${labelCls}"${dim}>
      <text class="${txtCls}" x="${cx}" y="${cy - 5}">${lblName}</text>
      <text class="${valCls}" x="${cx}" y="${cy + 7}">${dispVal(val)}</text>
      ${pdaDot}
    </g>`);
  });

  const defaultProv = state.provinceFilter || (pdaFocus ? "LAC" : "NDJ");
  const infoProv = PROVINCES.find(p => p.id === defaultProv);
  const infoVal = valMap[defaultProv];
  const infoRag = getRag(infoVal);
  const infoZone = ZONES[PROV_ZONE[defaultProv]];

  // Toggle
  const modeToggle = `
    <div class="map-mode-toggle">
      <button class="mm-btn ${state.mapMode === 'performance' ? 'on' : ''}" onclick="setMapMode('performance')" title="Couleurs par performance (RAG)">
        Performance
      </button>
      <button class="mm-btn ${state.mapMode === 'zones' ? 'on' : ''}" onclick="setMapMode('zones')" title="Couleurs par zone agroclimatique">
        Zones
      </button>
    </div>
  `;

  // Legend depends on mode
  let legendHtml;
  if (state.mapMode === "zones") {
    legendHtml = `
      <div class="map-legend-title">Zones agroclimatiques</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SAH.color}"></span>Saharienne (${ZONES.SAH.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SHL.color}"></span>Sahélienne (${ZONES.SHL.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SDN.color}"></span>Soudanienne (${ZONES.SDN.count})</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA</div>' : ''}
    `;
  } else {
    legendHtml = `
      <div class="map-legend-title">Performance</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-green)"></span>Bon</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-yellow)"></span>À surveiller</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-orange)"></span>Attention</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-red)"></span>Critique</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA</div>' : ''}
    `;
  }

  return `
    <div class="map-wrap">
      ${modeToggle}
      <div class="map-toolbar">
        <div class="map-tb-group" role="group" aria-label="Taille de la carte">
          <span class="map-tb-label">Taille</span>
          <button class="map-tb-btn ${state.mapSize === 'S' ? 'on' : ''}" data-map-size-btn="S" onclick="setMapSize('S')" title="Compacte">S</button>
          <button class="map-tb-btn ${state.mapSize === 'M' ? 'on' : ''}" data-map-size-btn="M" onclick="setMapSize('M')" title="Standard">M</button>
          <button class="map-tb-btn ${state.mapSize === 'L' ? 'on' : ''}" data-map-size-btn="L" onclick="setMapSize('L')" title="Étendue">L</button>
          <button class="map-tb-btn ${state.mapSize === 'XL' ? 'on' : ''}" data-map-size-btn="XL" onclick="setMapSize('XL')" title="Plein cadre">XL</button>
        </div>
        <div class="map-tb-group" role="group" aria-label="Zoom de la carte">
          <button class="map-tb-btn" data-map-zoom="out" onclick="mapZoomOut()" title="Dézoomer (molette ou pincement)">−</button>
          <span class="map-tb-zoom-pct" aria-live="polite">${Math.round(state.mapZoom * 100)}%</span>
          <button class="map-tb-btn" data-map-zoom="in" onclick="mapZoomIn()" title="Zoomer">+</button>
          <button class="map-tb-btn" data-map-zoom="reset" onclick="mapZoomReset()" title="Réinitialiser zoom et recadrage">⟲</button>
        </div>
      </div>
      <div class="map-svg-wrap" data-size="${state.mapSize}">
        <svg class="map-svg" viewBox="${currentMapViewBox()}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Carte des 23 provinces du Tchad">
          <g class="map-prov-layer">${paths.join("")}</g>
          <g class="map-label-layer">${labels.join("")}</g>
        </svg>
      </div>
      <div class="map-legend">${legendHtml}</div>
      <div class="map-info" id="map-info">
        <div class="map-info-tag">${PDA_PROVINCES.includes(defaultProv) ? "Province PDA" : "Province"}</div>
        <div class="map-info-name">${infoProv.name}${PDA_PROVINCES.includes(defaultProv) ? '<span class="map-info-pda">PDA</span>' : ''}</div>
        <div class="map-info-row"><span>Zone</span><span class="map-info-val" style="color:${infoZone.textDark ? '#5A3F1A' : infoZone.color};font-weight:700;">${infoZone.name}</span></div>
        <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${dispVal(infoVal)}</span></div>
        <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${infoRag}">${ragLabel(infoRag)}</span></span></div>
        <div class="map-info-row"><span>Tendance vs mois précédent</span><span class="map-info-val">${(() => { const pv = genValue(metric, defaultProv, 1); return (infoVal != null && pv != null) ? ((infoVal - pv >= 0 ? "+" : "") + (Math.round((infoVal - pv) * 10) / 10) + " pts") : "—"; })()}</span></div>
      </div>
    </div>
  `;
}

function showProvInfo(provId, metric, isVolume) {
  const p = PROVINCES.find(x => x.id === provId);
  if (!p) return;
  const val = genValue(metric, provId);
  const isPda = PDA_PROVINCES.includes(provId);
  const inverse = metric === "rupture" || metric === "abandon" || metric === "perim" || isVolume;
  let r;
  if (val == null) {
    r = "na";
  } else if (isVolume) {
    r = val <= 2500 ? "green" : val <= 4500 ? "yellow" : val <= 6500 ? "orange" : "red";
  } else if (inverse) {
    r = val <= 30 ? "green" : val <= 50 ? "yellow" : val <= 70 ? "orange" : "red";
  } else {
    r = val >= 80 ? "green" : val >= 60 ? "yellow" : val >= 40 ? "orange" : "red";
  }
  const prev = genValue(metric, provId, 1);
  const trend = (val != null && prev != null) ? Math.round((val - prev) * 10) / 10 : null;
  const display = val == null ? "ND" : (isVolume ? fmt(val) : val + "%");

  const info = document.getElementById("map-info");
  if (info) {
    info.innerHTML = `
      <div class="map-info-tag">${isPda ? "Province PDA" : "Province"}</div>
      <div class="map-info-name">${p.name}${isPda ? '<span class="map-info-pda">PDA</span>' : ''}</div>
      <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${display}</span></div>
      <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${r}">${ragLabel(r)}</span></span></div>
      <div class="map-info-row"><span>Tendance vs mois précédent</span><span class="map-info-val">${trend == null ? "—" : (trend >= 0 ? "+" : "") + trend + " pts"}</span></div>
    `;
  }
}

/* ==============================================================
   INIT
============================================================== */
function init() {
  applyStaticTranslations();
  document.documentElement.setAttribute("lang", state.lang);
  document.documentElement.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");
  renderSidebar();
  chargerDonneesReelles();   // bascule sur data/consolide.json des qu'il existe
  // Open vaccination program by default and select PDA
  setTimeout(() => {
    document.querySelector('.prog[data-prog="vacc"]').classList.add("open", "active");
    document.querySelector('.subprog[data-sub="vacc-overview"]').classList.add("active");
    renderMain();
  }, 30);
}

init();
</script>
</body>
</html>
